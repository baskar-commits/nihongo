<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Practice</title>
<style>
  :root{
    --bg:#f8f6f1; --card:#fff; --accent:#b7791f; --accent-dark:#8c5c14;
    --text:#2c3e50; --muted:#7f8c8d; --border:#ddd; --flag:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;padding:16px}
  .container{max-width:820px;margin:0 auto}
  header{background:linear-gradient(135deg,var(--accent),#d69e2e);color:#fff;border-radius:14px;padding:18px 16px}
  header h1{margin:0 0 6px;font-size:1.35rem}
  header p{margin:0;opacity:.95;font-size:.95rem}
  .crumbs{margin:14px 0 0;font-size:.9rem;color:var(--muted)}
  .crumbs a{color:var(--accent-dark);cursor:pointer;text-decoration:none;font-weight:600}
  .crumbs a:hover{text-decoration:underline}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  h2{margin:0 0 10px;font-size:1.1rem}
  h3{margin:0 0 4px;font-size:1.02rem;color:var(--accent-dark)}
  .muted{color:var(--muted);font-size:.92rem}
  .day{border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin:9px 0;background:#fff;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
  .day:hover{border-color:var(--accent)}
  .day .n{font-weight:800;color:var(--accent);min-width:2.6em;font-size:.95rem}
  .day .kana{color:var(--muted);font-size:.93rem}
  .day.today{border-color:var(--accent);background:#fffaf0}
  .todaypill{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;background:#fdf3e0;
             color:var(--accent-dark);font-size:.68rem;font-weight:800;letter-spacing:.06em;vertical-align:middle}
  .donepill{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;background:#eef1f3;
            color:var(--muted);font-size:.68rem;font-weight:700;letter-spacing:.05em;vertical-align:middle}
  details.how{border:1px solid var(--border);border-radius:12px;margin:12px 0;background:#fff}
  details.how>summary{cursor:pointer;padding:11px 14px;font-weight:700;color:var(--accent-dark);list-style:none}
  details.how>summary::-webkit-details-marker{display:none}
  details.how>summary::before{content:"\25B8 ";color:var(--accent)}
  details.how[open]>summary::before{content:"\25BE "}
  details.how .body{padding:0 14px 14px;font-size:.93rem}
  details.how ul{margin:6px 0 0;padding-left:20px}
  details.how li{margin:5px 0}
  .note{background:#fdf8ef;border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:.93rem}
  .note ul{margin:0;padding-left:19px}
  .note li{margin:5px 0}
  .turn{border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff;cursor:pointer}
  .turn:hover{border-color:#bbb;border-left-color:var(--accent)}
  .turnhead{display:flex;justify-content:flex-end}
  .num{font-size:.72rem;color:#aab4bd;font-weight:700;letter-spacing:.04em}
  .en{font-size:1.05rem}
  .hint{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:.8rem;color:var(--muted);font-style:italic}
  .pips{display:inline-flex;gap:4px}
  .pip{width:9px;height:9px;border-radius:50%;border:1.5px solid #bfc9d1;background:#fff;display:block}
  .pip.on{background:var(--accent);border-color:var(--accent)}
  .kana-line{font-size:1.5rem;margin-top:10px;line-height:1.7;word-break:break-word}
  .romaji-line{font-size:1rem;color:#4a6572;margin-top:6px;font-style:italic}
  .detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:.9rem}
  .src{color:var(--muted);font-size:.83rem;margin-top:6px}
  .lex{margin-top:8px;font-size:.87rem}
  .lex .row{margin:3px 0}
  .lex .lab{font-weight:700;color:var(--muted);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
  .wordmark{border-bottom:2px dotted #9aa7b1}
  .anchor{color:#5b6b7a;margin:2px 0 0 14px;font-size:.85rem;line-height:1.45}
  .grammar{margin-top:6px;color:#34495e}
  .cchip{display:inline;background:#fdf3e0;color:var(--accent-dark);border:1px solid #e8d4ab;border-radius:6px;
         padding:1px 6px;margin:0 1px;font-weight:600;cursor:pointer;font-family:inherit;font-size:inherit;white-space:nowrap}
  .cchip:hover{background:#f8e9cf}
  .cchip::after{content:" ?";font-size:.72em;opacity:.65;font-weight:700}
  .cpanel{margin:8px 0 4px;padding:11px 13px;background:#fdfaf3;border:1px solid #ecdcbd;border-radius:10px}
  .cpanel h4{margin:0 0 5px;font-size:.95rem;color:var(--accent-dark)}
  .cpanel ul.cbul{margin:4px 0 0;padding-left:19px;font-size:.9rem}
  .cpanel ul.cbul li{margin:5px 0}
  .grammar ul.gbul{margin:2px 0 0;padding-left:19px}
  .grammar ul.gbul li{margin:4px 0}
  .cpanel .cex{margin-top:7px}
  .cpanel .cex .k{font-size:1.1rem;line-height:1.5}
  .cpanel .cex .r{font-style:italic;color:#4a6572;font-size:.86rem}
  .cpanel .cex .e{color:var(--muted);font-size:.86rem}
  .cpanel .csrc{margin-top:8px;font-size:.8rem;color:var(--muted)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{display:inline-block;background:#fff;color:var(--accent-dark);border:1.5px solid var(--accent);
       font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer;font-size:.9rem;font-family:inherit}
  .btn:hover{background:#fdf3e0}
  .footer{margin-top:22px;color:var(--muted);font-size:.85rem;text-align:center}
  .footer a{color:var(--accent-dark)}
  @media(max-width:520px){ .kana-line{font-size:1.35rem} body{padding:12px} }
</style>
</head>
<body>
<div class="container">
  <header><h1>Daily Practice</h1><p>One set a day, fifteen lines. Say each one out loud before you check it.</p></header>
  <div class="crumbs" id="crumbs"></div>
  <div id="app"></div>
  <div class="footer">Kana only, no kanji. Every line traces to the textbook or the conversation course.<br>
    <a href="../index.html">Back to the Japanese Class site</a></div>
</div>
<script>
const DATA = {"title": "Daily Practice", "subtitle": "One set a day, fifteen lines. Say each one out loud before you check it.", "start": "2026-08-28", "howto": ["Read the English, say it in Japanese out loud, then tap to check yourself.", "First tap shows the kana. Second tap shows the romaji, the meaning, the grammar and where it came from.", "Green buttons open a short explanation of a pattern. Tap again to close.", "Lines with ______ are for your own details. Fill them with whatever is true today.", "Today's set opens automatically. You can open any other day from the list.", "Fifteen lines is about ten minutes. Saying it aloud is the part that counts."], "days": [{"n": 1, "title": {"en": "Getting there", "kana": "しゅっぱつ"}, "note": ["Travel day. Everything here is about going somewhere and arriving tired.", "Grammar focus: the motion particles へ, に, で and と, plus the past ending ました."], "lines": [{"en": "Today I am going to Australia.", "kana": "きょう、オーストラリアへいきます。", "romaji": "Kyou, Oosutoraria e ikimasu.", "source": "JBP L6 へいきます", "grammar": "へ marks the destination. に works here too."}, {"en": "I will go by plane.", "kana": "ひこうきでいきます。", "romaji": "Hikouki de ikimasu.", "source": "Easy Conv L4", "grammar": "The transport [[de-particle]]: by plane, by train, by bus."}, {"en": "What time is the plane?", "kana": "ひこうきはなんじですか。", "romaji": "Hikouki wa nan-ji desu ka.", "source": "JBP L4 time", "grammar": "なんじ asks for a point on the clock. See [[telling-time]] for reading the answer, and [[question-words]] for the whole family."}, {"en": "It is ten thirty in the morning.", "kana": "ごぜんじゅうじはんです。", "romaji": "Gozen juu-ji han desu.", "source": "JBP L4", "grammar": "ごぜん is a.m. and ごご is p.m., and both come before the hour. はん is the half hour.", "words": [{"word": "ごぜん", "romaji": "gozen", "gloss": "a.m., before noon", "anchor": "its partner is ごご, afternoon"}]}, {"en": "It is about fourteen hours.", "kana": "じゅうよじかんぐらいです。", "romaji": "Juuyo-jikan gurai desu.", "source": "JBP L11", "grammar": "See [[time-counters]]: じかん counts hours of duration. Note よ, not よん, in じゅうよ."}, {"en": "I am going with my family.", "kana": "かぞくといきます。", "romaji": "Kazoku to ikimasu.", "source": "JBP L9 かぞく", "grammar": "This と means with, marking who you are going with. See [[to-particle]].", "words": [{"word": "かぞく", "romaji": "kazoku", "gloss": "my family", "anchor": "ごかぞく with the polite ご- is how you ask about someone else's family"}]}, {"en": "There were a lot of people at the airport.", "kana": "くうこうにひとがたくさんいました。", "romaji": "Kuukou ni hito ga takusan imashita.", "source": "JBP L12", "grammar": "に marks where something exists. See [[ni-particle]]. が marks the thing that exists, and いました is the past of います. See [[arimasu-imasu]]."}, {"en": "Excuse me, where is the restroom?", "kana": "すみません。おてあらいはどこですか。", "romaji": "Sumimasen. Otearai wa doko desu ka.", "source": "Easy Conv L4"}, {"en": "My seat is 25A.", "kana": "わたしのせきはにじゅうごのエーです。", "romaji": "Watashi no seki wa nijuu-go no ee desu.", "source": "JBP L1 numbers", "grammar": "の joins the number to the letter, the way a hyphen would in English. See [[no-linker]] and [[numbers-big]].", "words": [{"word": "せき", "romaji": "seki", "gloss": "seat", "anchor": "the same word is on your boarding pass"}]}, {"en": "I drank coffee inside the plane.", "kana": "ひこうきのなかでコーヒーをのみました。", "romaji": "Hikouki no naka de koohii o nomimashita.", "source": "JBP L6", "grammar": "Three particles in one line. の attaches なか, で marks where the action happened, and を marks what you drank. See [[wo-particle]] and [[position-words]]."}, {"en": "I watched a movie.", "kana": "えいがをみました。", "romaji": "Eiga o mimashita.", "source": "JBP L6", "grammar": "を always sits between the thing and the verb that acts on it. See [[wo-particle]].", "words": [{"word": "えいが", "romaji": "eiga", "gloss": "movie, film", "anchor": "えいがかん is the cinema, with かん meaning building"}]}, {"en": "I did not sleep.", "kana": "ねませんでした。", "romaji": "Nemasen deshita.", "source": "JBP L6", "grammar": "ませんでした is the past negative: it did not happen. See [[verb-forms]] for all four endings side by side."}, {"en": "I am a little tired.", "kana": "ちょっとつかれました。", "romaji": "Chotto tsukaremashita.", "source": "JBP ～ました", "words": [{"word": "つかれました", "romaji": "tsukaremashita", "gloss": "got tired", "anchor": "Japanese uses the past here: you became tired, so you are tired now. Same logic as わかりました."}]}, {"en": "We arrived at ______ .", "kana": "______ につきました。", "romaji": "______ ni tsukimashita.", "source": "JBP ～ました", "grammar": "に marks the place you arrived at. Put your city in the blank."}, {"en": "Good night.", "kana": "おやすみなさい。", "romaji": "Oyasuminasai.", "source": "JBP greetings"}]}, {"n": 2, "title": {"en": "Where I am staying", "kana": "ホテルで"}, "note": ["Lesson 12 is the engine today: [[arimasu-imasu]] and position words.", "Grammar focus: これ, あれ, あちら and the floor counter かい. Look around the room and describe what is actually there."], "lines": [{"en": "Excuse me, I have a reservation.", "kana": "すみません。よやくがあります。", "romaji": "Sumimasen. Yoyaku ga arimasu.", "source": "JBP L12", "grammar": "が marks the thing that exists. See [[ga-subject]] and [[arimasu-imasu]].", "extras": [{"word": "よやく", "romaji": "yoyaku", "gloss": "a reservation, a booking", "anchor": "you already say おねがいします when you ask for something; this is the thing you booked in advance"}]}, {"en": "What time is check-in?", "kana": "チェックインはなんじからですか。", "romaji": "Chekku-in wa nan-ji kara desu ka.", "source": "JBP L4", "grammar": "から means from, so なんじから asks from what time. See [[kara-made]]."}, {"en": "What floor is my room on?", "kana": "へやはなんかいですか。", "romaji": "Heya wa nan-kai desu ka.", "source": "JBP L2", "grammar": "かい counts floors, and なんかい asks which one. See [[counters]]."}, {"en": "It is on the eighth floor.", "kana": "はっかいです。", "romaji": "Hakkai desu.", "source": "JBP L2", "grammar": "はち plus かい contracts to はっかい. One, six, eight and ten do this in front of か sounds. See [[counters]]."}, {"en": "Where is the elevator?", "kana": "エレベーターはどこですか。", "romaji": "Erebeetaa wa doko desu ka.", "source": "JBP L2", "grammar": "どこ asks for a place. See [[question-words]]."}, {"en": "It is over there. (staff)", "kana": "あちらです。", "romaji": "Achira desu.", "source": "JBP L2", "grammar": "あちら is the polite far one, which is why staff use it for directions. Your own version of the same idea is あそこ. See [[kosoado]]."}, {"en": "There is a person at the front desk.", "kana": "うけつけにひとがいます。", "romaji": "Uketsuke ni hito ga imasu.", "source": "JBP L12", "grammar": "**います, not あります**, because a person is animate. This is the whole distinction. See [[arimasu-imasu]]."}, {"en": "There is a big window.", "kana": "おおきいまどがあります。", "romaji": "Ookii mado ga arimasu.", "source": "JBP L12 + L10 おおきい", "grammar": "[[arimasu-imasu]]. あります is for things. An い-adjective attaches straight to the noun: see [[adj-types]]."}, {"en": "There is a table in the room.", "kana": "へやにテーブルがあります。", "romaji": "Heya ni teeburu ga arimasu.", "source": "JBP L12", "grammar": "[place] に [thing] が あります. に marks where, が marks the thing being introduced. See [[ga-subject]]."}, {"en": "There is a book on the table.", "kana": "テーブルのうえにほんがあります。", "romaji": "Teeburu no ue ni hon ga arimasu.", "source": "JBP L12", "grammar": "Position words attach with の: テーブルのうえ, the top of the table. See [[position-words]]."}, {"en": "My bag is under the bed.", "kana": "ベッドのしたにかばんがあります。", "romaji": "Beddo no shita ni kaban ga arimasu.", "source": "JBP L12 + L2 かばん", "grammar": "した is the partner of うえ. See [[position-words]]."}, {"en": "What is that over there?", "kana": "あれはなんですか。", "romaji": "Are wa nan desu ka.", "source": "JBP L2", "grammar": "あれ stands alone and means the far one. Nothing follows it. See [[kosoado]]."}, {"en": "There is a convenience store on the first floor.", "kana": "いっかいにコンビニがあります。", "romaji": "Ikkai ni konbini ga arimasu.", "source": "JBP L12 ～かい", "words": [{"word": "いっかい", "romaji": "ikkai", "gloss": "the first floor", "anchor": "～かい counts floors. Note the sound change: いち plus かい becomes いっかい."}]}, {"en": "The room is clean and quiet.", "kana": "へやはきれいで、しずかです。", "romaji": "Heya wa kirei de, shizuka desu.", "source": "JBP L10", "grammar": "Two な-adjectives joined: the first takes で. Both きれい and しずか are な-adjectives despite きれい ending in い. See [[adj-types]]."}, {"en": "There is no bath. (There isn't one.)", "kana": "おふろはありません。", "romaji": "Ofuro wa arimasen.", "source": "JBP L12", "grammar": "The negative of あります. Note は rather than が: you are commenting on a known topic rather than introducing something."}]}, {"n": 3, "title": {"en": "What is around here", "kana": "このへんに"}, "note": ["Grammar focus: the whole どれ, どの, どちら family, and counting things with いくつ.", "や versus と also shows up. Use や when you are giving examples, と when that is the complete list."], "lines": [{"en": "What is there around here?", "kana": "このへんになにがありますか。", "romaji": "Kono hen ni nani ga arimasu ka.", "source": "JBP L12", "grammar": "なに always takes が in this pattern. See [[ga-subject]] and [[arimasu-imasu]].", "words": [{"word": "このへん", "romaji": "kono hen", "gloss": "around here, this area", "anchor": "この plus へん, vicinity. See [[kosoado]] for the この family."}]}, {"en": "There is a park, a beach and so on.", "kana": "こうえんやうみがあります。", "romaji": "Kouen ya umi ga arimasu.", "source": "JBP L12 や", "grammar": "[[ya-to]]. や means these among others. There is more here than just a park and a beach."}, {"en": "There is a bank and a post office. (Just those two.)", "kana": "ぎんこうとゆうびんきょくがあります。", "romaji": "Ginkou to yuubinkyoku ga arimasu.", "source": "JBP L12 と", "grammar": "[[ya-to]]. と gives the complete list: those two and nothing else."}, {"en": "Is there a convenience store nearby?", "kana": "ちかくにコンビニがありますか。", "romaji": "Chikaku ni konbini ga arimasu ka.", "source": "JBP L12 + Easy Conv L4"}, {"en": "How many convenience stores are there?", "kana": "コンビニはいくつありますか。", "romaji": "Konbini wa ikutsu arimasu ka.", "source": "JBP L3", "grammar": "いくつ counts things and takes no counter after it. See [[ikura-ikutsu]]."}, {"en": "There are three.", "kana": "みっつあります。", "romaji": "Mittsu arimasu.", "source": "JBP L3", "grammar": "ひとつ, ふたつ, みっつ is the all-purpose counting set for objects. See [[counters]]."}, {"en": "There are a lot of people.", "kana": "ひとがおおいです。", "romaji": "Hito ga ooi desu.", "source": "JBP L10", "words": [{"word": "おおい", "romaji": "ooi", "gloss": "many, numerous", "anchor": "an い-adjective. Its opposite is すくない, few. Different word from おおきい, big."}]}, {"en": "This town is quiet.", "kana": "このまちはしずかです。", "romaji": "Kono machi wa shizuka desu.", "source": "JBP L10", "grammar": "この always has a noun after it. しずか is a な-adjective, so it takes plain です here. See [[kosoado]] and [[adj-types]]."}, {"en": "Which one is the map?", "kana": "ちずはどれですか。", "romaji": "Chizu wa dore desu ka.", "source": "JBP L2", "grammar": "どれ asks which one out of three or more, and stands alone. See [[kosoado]].", "words": [{"word": "ちず", "romaji": "chizu", "gloss": "map", "anchor": "ちかてつのちず is a subway map"}]}, {"en": "Which way is the station?", "kana": "えきはどちらですか。", "romaji": "Eki wa dochira desu ka.", "source": "JBP L2", "grammar": "どちら is the polite which, used for directions and for a choice between two. See [[kosoado]]."}, {"en": "Which bus goes to the beach?", "kana": "どのバスがうみへいきますか。", "romaji": "Dono basu ga umi e ikimasu ka.", "source": "JBP L6", "grammar": "どの needs a noun after it. Question words take が, never は. See [[ga-subject]]."}, {"en": "That blue one over there.", "kana": "あのあおいバスです。", "romaji": "Ano aoi basu desu.", "source": "JBP L2", "grammar": "あの points at something far from both of you, and needs a noun. あおい is an い-adjective, so it sits straight in front. See [[adj-types]]."}, {"en": "What is a ______ ?", "kana": "______ ってなんですか。", "romaji": "______ tte nan desu ka.", "source": "JBP L12", "grammar": "[[tte-nan-desu-ka]]. The single most useful thing you can say when you hear a word you do not know. Repeat the word back and add ってなんですか."}, {"en": "There is a famous temple here.", "kana": "ここにゆうめいなおてらがあります。", "romaji": "Koko ni yuumei na otera ga arimasu.", "source": "JBP L10 and L12", "grammar": "ゆうめい is a な-adjective, so it needs な before the noun. See [[adj-types]]."}, {"en": "I would like to go there.", "kana": "そこへいきたいです。", "romaji": "Soko e ikitai desu.", "source": "Easy Conv L4", "grammar": "[[tai-desu]]. そこ is there, near the listener. See [[kosoado]]."}]}, {"n": 4, "title": {"en": "What I did today", "kana": "きょうしたこと"}, "note": ["Past tense all day, positive and negative. Swap in whatever you actually did.", "Grammar focus: を on the thing, で on the place, に on the clock time, and the counters ほん and じかん."], "lines": [{"en": "What did you do today?", "kana": "きょうなにをしましたか。", "romaji": "Kyou nani o shimashita ka.", "source": "JBP L6", "grammar": "なに asks what, and を marks it as the thing being done. See [[wo-particle]]."}, {"en": "I got up at seven this morning.", "kana": "けさしちじにおきました。", "romaji": "Kesa shichi-ji ni okimashita.", "source": "JBP L2 and past ～ました", "grammar": "に marks the clock time. See [[time-counters]]: しちじ is seven o'clock, not seven hours."}, {"en": "I ate breakfast at the hotel.", "kana": "ホテルであさごはんをたべました。", "romaji": "Hoteru de asagohan o tabemashita.", "source": "Easy Conv L2 + JBP L8", "grammar": "This で marks where the action happened. See [[de-particle]]."}, {"en": "I went to the beach with my family.", "kana": "かぞくとうみへいきました。", "romaji": "Kazoku to umi e ikimashita.", "source": "JBP L6 and L10"}, {"en": "I did not take the train.", "kana": "でんしゃにのりませんでした。", "romaji": "Densha ni norimasen deshita.", "source": "JBP L6", "grammar": "のります takes に, not を: you board into a vehicle. Worth memorising as a pair. See [[ni-particle]]."}, {"en": "I walked for about two hours.", "kana": "にじかんぐらいあるきました。", "romaji": "Ni-jikan gurai arukimashita.", "source": "JBP L11 あるきます", "grammar": "じかん counts a length of time, and ぐらい softens it to about. See [[time-counters]]."}, {"en": "I bought two bottles of water.", "kana": "みずをにほんかいました。", "romaji": "Mizu o ni-hon kaimashita.", "source": "JBP L3", "grammar": "ほん counts long thin things, so it is the counter for bottles. The count sits after を and before the verb. See [[counters]]."}, {"en": "I did not eat lunch.", "kana": "ひるごはんをたべませんでした。", "romaji": "Hirugohan o tabemasen deshita.", "source": "JBP L6", "grammar": "See [[verb-forms]]. The を stays even when the sentence is negative."}, {"en": "I took a lot of photographs.", "kana": "しゃしんをたくさんとりました。", "romaji": "Shashin o takusan torimashita.", "source": "JBP L11 とります", "words": [{"word": "たくさん", "romaji": "takusan", "gloss": "a lot, many", "anchor": "goes before the verb, like よく and ときどき"}]}, {"en": "I read a book at the hotel.", "kana": "ホテルでほんをよみました。", "romaji": "Hoteru de hon o yomimashita.", "source": "JBP L6", "grammar": "で is the place the action happens, を is the thing acted on. See [[de-particle]]."}, {"en": "I did not study Japanese today.", "kana": "きょうはにほんごをべんきょうしませんでした。", "romaji": "Kyou wa nihongo o benkyou shimasen deshita.", "source": "JBP negative past", "grammar": "**～ませんでした** is the past negative: did not do. Built from ません plus でした."}, {"en": "When did you get back?", "kana": "いつかえりましたか。", "romaji": "Itsu kaerimashita ka.", "source": "JBP L4", "grammar": "いつ asks when in general. If you want a clock time ask なんじ, and for a day of the week ask なんようび. See [[question-words]]."}, {"en": "I got back at about six.", "kana": "ろくじごろかえりました。", "romaji": "Roku-ji goro kaerimashita.", "source": "JBP L4", "grammar": "ごろ is about, for a point in time. ぐらい is about, for a length of time. See [[time-counters]].", "words": [{"word": "ごろ", "romaji": "goro", "gloss": "around, about (a point in time)", "anchor": "ろくじ is six o'clock exactly; ろくじごろ is around six"}]}, {"en": "In the evening I relaxed at the hotel.", "kana": "よる、ホテルでゆっくりしました。", "romaji": "Yoru, hoteru de yukkuri shimashita.", "source": "Easy Conv L5 うちでゆっくりします", "grammar": "ゆっくり is the same word as in ゆっくりおねがいします, please say it slowly."}, {"en": "Today was a good day.", "kana": "きょうはいいひでした。", "romaji": "Kyou wa ii hi deshita.", "source": "JBP L10 and L11", "grammar": "いい in front of a noun stays いい. It only becomes irregular in the past on its own: よかったです. See [[adj-past]]."}]}, {"n": 5, "title": {"en": "How was it?", "kana": "どうでしたか"}, "note": ["Grammar focus: adjectives in all four shapes, present and past, positive and negative.", "Ask yourself どうでしたか about each part of the day and answer aloud."], "lines": [{"en": "How was today?", "kana": "きょうはどうでしたか。", "romaji": "Kyou wa dou deshita ka.", "source": "JBP L11", "grammar": "[[dou-deshita]]. The answer is nearly always a past-tense adjective."}, {"en": "It was a lot of fun.", "kana": "とてもたのしかったです。", "romaji": "Totemo tanoshikatta desu.", "source": "JBP L11", "grammar": "い-adjective past: drop い, add かったです. See [[adj-past]]."}, {"en": "How was the food?", "kana": "たべものはどうでしたか。", "romaji": "Tabemono wa dou deshita ka.", "source": "JBP L11", "grammar": "See [[dou-deshita]]. どう asks for an impression, so the answer is an adjective."}, {"en": "What was the most fun?", "kana": "なにがいちばんたのしかったですか。", "romaji": "Nani ga ichiban tanoshikatta desu ka.", "source": "JBP L11", "grammar": "See [[ichiban]]. なに takes が because it is the subject of the adjective."}, {"en": "The sea was beautiful.", "kana": "うみがきれいでした。", "romaji": "Umi ga kirei deshita.", "source": "JBP L10 and L11", "grammar": "きれい looks like an い-adjective but is a な-adjective, so it takes でした, never きれいかったです. The classic trap. See [[adj-types]]."}, {"en": "The sea is beautiful today too.", "kana": "きょうもうみがきれいです。", "romaji": "Kyou mo umi ga kirei desu.", "source": "JBP L10", "grammar": "も replaces は and means too. きれい looks like an い-adjective but is a な-adjective, so it takes plain です. See [[adj-types]]."}, {"en": "It was hot today.", "kana": "きょうはあつかったです。", "romaji": "Kyou wa atsukatta desu.", "source": "JBP L10 and L11", "grammar": "あつい is an い-adjective: あつかったです. Careful, Australia in August is winter, so さむかったです may be the truthful one."}, {"en": "The room is not big.", "kana": "へやはおおきくないです。", "romaji": "Heya wa ookiku nai desu.", "source": "JBP L10", "grammar": "い-adjectives drop い and add くないです. See [[adj-negative]]."}, {"en": "It is not quiet here.", "kana": "ここはしずかじゃありません。", "romaji": "Koko wa shizuka ja arimasen.", "source": "JBP L10", "grammar": "な-adjectives swap です for じゃありません. See [[adj-negative]]."}, {"en": "The weather is not good.", "kana": "てんきはよくないです。", "romaji": "Tenki wa yoku nai desu.", "source": "JBP L10", "grammar": "いい is irregular everywhere: it turns into よ before any ending. See [[adj-negative]]."}, {"en": "It was not boring.", "kana": "つまらなくなかったです。", "romaji": "Tsumaranaku nakatta desu.", "source": "JBP L11", "grammar": "The past negative of an い-adjective: drop い, add くなかったです. Worth knowing, though it is a mouthful."}, {"en": "The town was not lively.", "kana": "まちはにぎやかじゃありませんでした。", "romaji": "Machi wa nigiyaka ja arimasen deshita.", "source": "JBP L11", "grammar": "Add でした to the negative to put it in the past. See [[adj-negative]]."}, {"en": "It was tough, but it was interesting.", "kana": "たいへんでしたが、おもしろかったです。", "romaji": "Taihen deshita ga, omoshirokatta desu.", "source": "JBP L11", "grammar": "A な-adjective past (でした) and an い-adjective past (かったです) in one sentence, joined by [[ga-but]]. See [[adj-past]]."}, {"en": "It was a little expensive.", "kana": "ちょっとたかかったです。", "romaji": "Chotto takakatta desu.", "source": "JBP L10 and L11"}, {"en": "I want to go again tomorrow.", "kana": "あした、またいきたいです。", "romaji": "Ashita, mata ikitai desu.", "source": "Easy Conv L4 and L5", "grammar": "[[tai-desu]]."}]}, {"n": 6, "title": {"en": "Eating out", "kana": "がいしょく"}, "note": ["Grammar focus: counting people and counting things, and prices into the thousands.", "Several of these are staff lines you only need to recognize."], "lines": [{"en": "How many people, please? (staff)", "kana": "なんめいさまですか。", "romaji": "Nan-mei-sama desu ka.", "source": "Easy Conv L3", "grammar": "めいさま is the respectful counter restaurant staff use for customers. You answer with にん or with ふたり. See [[counting-people]] and [[keigo]]."}, {"en": "Two people, please.", "kana": "ふたりです。", "romaji": "Futari desu.", "source": "Easy Conv L3", "words": [{"word": "ふたり", "romaji": "futari", "gloss": "two people", "anchor": "ひとり is one person, ふたり is two, then さんにん, よにん. The first two are irregular."}]}, {"en": "Is there an English menu?", "kana": "えいごのメニューはありますか。", "romaji": "Eigo no menyuu wa arimasu ka.", "source": "JBP L12", "grammar": "の joins two nouns: an English-language menu. See [[no-linker]]."}, {"en": "May I have the menu, please?", "kana": "メニューをおねがいします。", "romaji": "Menyuu o onegaishimasu.", "source": "Easy Conv L3"}, {"en": "What do you recommend?", "kana": "おすすめはなんですか。", "romaji": "Osusume wa nan desu ka.", "source": "Easy Conv L3 + JBP L9", "grammar": "Works in restaurants, shops and stations alike. Probably the highest-value question you own."}, {"en": "Which one do you recommend?", "kana": "どれがおすすめですか。", "romaji": "Dore ga osusume desu ka.", "source": "Easy Conv L3", "grammar": "どれ picks one out of several. Question words take が. See [[ga-subject]]."}, {"en": "What is this?", "kana": "これはなんですか。", "romaji": "Kore wa nan desu ka.", "source": "JBP L2", "grammar": "これ stands alone. If you point at a dish on a menu you would say この～. See [[kosoado]]."}, {"en": "I will have this one, please.", "kana": "これをください。", "romaji": "Kore o kudasai.", "source": "JBP L3", "grammar": "ください asks for a thing; おねがいします is the slightly softer version and works for both things and favours."}, {"en": "One beer and two waters, please.", "kana": "ビールをひとつ、みずをふたつください。", "romaji": "Biiru o hitotsu, mizu o futatsu kudasai.", "source": "JBP L3", "grammar": "The count goes after を and before ください. ひとつ, ふたつ works for almost anything on a menu. See [[counters]]."}, {"en": "Thank you for the food. (before eating)", "kana": "いただきます。", "romaji": "Itadakimasu.", "source": "Easy Conv L3", "grammar": "No real English equivalent. Said before the first bite whether or not anyone is with you. Its partner is ごちそうさまでした, said afterwards."}, {"en": "It is delicious.", "kana": "とてもおいしいです。", "romaji": "Totemo oishii desu.", "source": "JBP L10"}, {"en": "How much is it all together?", "kana": "ぜんぶでいくらですか。", "romaji": "Zenbu de ikura desu ka.", "source": "JBP L3", "grammar": "いくら asks a price only. See [[ikura-ikutsu]].", "words": [{"word": "ぜんぶで", "romaji": "zenbu de", "gloss": "all together, in total", "anchor": "the same で that means by means of, here meaning taken as a whole"}]}, {"en": "It is 3,500 yen.", "kana": "さんぜんごひゃくえんです。", "romaji": "Sanzen gohyaku en desu.", "source": "JBP L3", "grammar": "Say it left to right, largest first: three thousand, five hundred. Watch さんぜん, not さんせん. See [[numbers-big]]."}, {"en": "The bill, please.", "kana": "おかいけいをおねがいします。", "romaji": "Okaikei o onegaishimasu.", "source": "JBP L9", "words": [{"word": "おかいけい", "romaji": "okaikei", "gloss": "the bill", "anchor": "add べつべつに, separately, if you are splitting it"}]}, {"en": "Thank you for the meal. (leaving)", "kana": "ごちそうさまでした。", "romaji": "Gochisousama deshita.", "source": "JBP greetings", "grammar": "You say it as you finish, which is why it ends in でした. Its partner at the start of the meal is いただきます."}]}, {"n": 7, "title": {"en": "People and family", "kana": "かぞくとひと"}, "note": ["Grammar focus: だれ, なんにん and の, plus います for people against あります for things.", "Family words come in pairs: humble for yours, polite for theirs."], "lines": [{"en": "There are four people in my family.", "kana": "かぞくはよにんです。", "romaji": "Kazoku wa yo-nin desu.", "source": "JBP L9 + counters", "grammar": "～にん counts people. ひとり and ふたり are irregular; from three on it is さんにん, よにん, ごにん."}, {"en": "How many people are in your family?", "kana": "ごかぞくはなんにんですか。", "romaji": "Gokazoku wa nan-nin desu ka.", "source": "JBP L9", "grammar": "ご- makes it about the other person's family. Your own is plain かぞく. See [[polite-o]]."}, {"en": "How many children do you have?", "kana": "おこさんはなんにんですか。", "romaji": "Okosan wa nan-nin desu ka.", "source": "JBP L9", "grammar": "なんにん asks how many people. おこさん is the polite word for someone else's child. See [[counting-people]] and [[polite-o]]."}, {"en": "I have two children.", "kana": "こどもはふたりです。", "romaji": "Kodomo wa futari desu.", "source": "JBP L9", "grammar": "ひとり and ふたり are irregular. From three on it is regular: さんにん, よにん. See [[counting-people]]."}, {"en": "There are no people here.", "kana": "ここにひとはいません。", "romaji": "Koko ni hito wa imasen.", "source": "JBP L12", "grammar": "The negative of います. は rather than が, because you are commenting rather than introducing."}, {"en": "My older sister lives in Japan.", "kana": "あねはにほんにすんでいます。", "romaji": "Ane wa Nihon ni sunde imasu.", "source": "JBP L9", "grammar": "すみます takes に for the place you live. See [[te-imasu]] for the ongoing state.", "words": [{"word": "あね", "romaji": "ane", "gloss": "my older sister", "anchor": "おねえさん is someone else's older sister, with the polite お-"}]}, {"en": "My wife is at the hotel.", "kana": "つまはホテルにいます。", "romaji": "Tsuma wa hoteru ni imasu.", "source": "JBP L9", "grammar": "つま is my wife; おくさん is someone else's. います is the verb for people. See [[arimasu-imasu]]."}, {"en": "Who is that person?", "kana": "あのひとはだれですか。", "romaji": "Ano hito wa dare desu ka.", "source": "JBP L1", "grammar": "だれ asks who. どなた is the politer version. See [[question-words]]."}, {"en": "That person is my friend.", "kana": "あのひとはわたしのともだちです。", "romaji": "Ano hito wa watashi no tomodachi desu.", "source": "JBP L1", "grammar": "の makes the first noun the owner of the second. See [[no-linker]]."}, {"en": "Whose bag is this?", "kana": "これはだれのかばんですか。", "romaji": "Kore wa dare no kaban desu ka.", "source": "JBP L2", "grammar": "だれの is whose: the same の doing the same job, with a question word in front."}, {"en": "It is mine.", "kana": "わたしのです。", "romaji": "Watashi no desu.", "source": "JBP L2", "grammar": "When the noun is already obvious you can stop at の, and it means the one belonging to me. See [[no-linker]]."}, {"en": "There is a child over there.", "kana": "あそこにこどもがいます。", "romaji": "Asoko ni kodomo ga imasu.", "source": "JBP L12", "grammar": "**います** because a child is animate. See [[arimasu-imasu]]."}, {"en": "There is a dog under the table.", "kana": "テーブルのしたにいぬがいます。", "romaji": "Teeburu no shita ni inu ga imasu.", "source": "JBP L12", "grammar": "Animals take います too. Position with の: see [[position-words]]."}, {"en": "My father is a teacher.", "kana": "ちちはせんせいです。", "romaji": "Chichi wa sensei desu.", "source": "JBP L9", "words": [{"word": "ちち", "romaji": "chichi", "gloss": "my father", "anchor": "おとうさん is how you refer to someone else's father, or address your own. Same split for はは and おかあさん."}]}, {"en": "We came from America.", "kana": "アメリカからきました。", "romaji": "Amerika kara kimashita.", "source": "JBP L6", "grammar": "から marks where you came from, the partner of まで."}]}, {"n": 8, "title": {"en": "Asking for things", "kana": "おねがいするとき"}, "note": ["Requests and permission. Both hang off the [[te-form]], so today is really one piece of grammar wearing two hats.", "Grammar focus: を ください against て ください, and the polite こちら."], "lines": [{"en": "Excuse me.", "kana": "すみません。", "romaji": "Sumimasen.", "source": "JBP L1", "grammar": "Opens almost every request. It covers excuse me, sorry and thank you depending on the situation."}, {"en": "Please say that once more.", "kana": "もういちどおねがいします。", "romaji": "Mou ichi-do onegaishimasu.", "source": "JBP L2", "grammar": "The single most useful sentence when you are lost in a conversation."}, {"en": "Please say it slowly.", "kana": "ゆっくりおねがいします。", "romaji": "Yukkuri onegaishimasu.", "source": "JBP L2"}, {"en": "Please speak in English.", "kana": "えいごではなしてください。", "romaji": "Eigo de hanashite kudasai.", "source": "JBP L4", "grammar": "で is the means, here the language you use. See [[de-particle]] and [[te-kudasai]]."}, {"en": "I am sorry, but I do not understand.", "kana": "すみませんが、わかりません。", "romaji": "Sumimasen ga, wakarimasen.", "source": "JBP L11", "grammar": "See [[ga-but]]. It softens the sentence, which is why it is common before bad news."}, {"en": "Please wait a moment.", "kana": "ちょっとまってください。", "romaji": "Chotto matte kudasai.", "source": "JBP L10", "grammar": "まちます becomes まって, then ください. See [[te-kudasai]] and [[which-form]]."}, {"en": "Please write it here.", "kana": "ここにかいてください。", "romaji": "Koko ni kaite kudasai.", "source": "JBP L4", "grammar": "に marks the spot the writing ends up on. See [[ni-particle]] and [[te-kudasai]]."}, {"en": "May I take a photograph?", "kana": "しゃしんをとってもいいですか。", "romaji": "Shashin o totte mo ii desu ka.", "source": "Easy Conv L4", "grammar": "[[te-mo-ii]]. とります becomes とって. Same て-form as ください, doing a different job."}, {"en": "Please take a photograph for me.", "kana": "しゃしんをとってください。", "romaji": "Shashin o totte kudasai.", "source": "JBP L4", "grammar": "てください asks someone else to do it. てもいいですか asks whether you may do it yourself. Same て-form, opposite direction. See [[te-kudasai]]."}, {"en": "May I sit here?", "kana": "ここにすわってもいいですか。", "romaji": "Koko ni suwatte mo ii desu ka.", "source": "Easy Conv L4 pattern", "words": [{"word": "すわって", "romaji": "suwatte", "gloss": "sit", "anchor": "the て-form of すわります. Verbs ending in ります take って, like とります and とって."}]}, {"en": "Can I use a card?", "kana": "カードはつかえますか。", "romaji": "Kaado wa tsukaemasu ka.", "source": "Easy Conv L3"}, {"en": "Please give me a receipt.", "kana": "レシートをください。", "romaji": "Reshiito o kudasai.", "source": "JBP L3", "grammar": "を ください asks for a thing. て ください asks for an action. See [[wo-particle]]."}, {"en": "I do not need a bag.", "kana": "ふくろはいりません。", "romaji": "Fukuro wa irimasen.", "source": "JBP L6", "grammar": "は marks what the sentence is about, and the negative does the refusing politely. See [[wa-vs-ga]].", "extras": [{"word": "ふくろ", "romaji": "fukuro", "gloss": "bag, carrier bag", "anchor": "かばん is the bag you carry; ふくろ is the one the shop puts things in"}, {"word": "いりません", "romaji": "irimasen", "gloss": "I do not need it", "anchor": "the negative of いります, and the same ません ending as わかりません"}]}, {"en": "This way, please. (staff)", "kana": "こちらへどうぞ。", "romaji": "Kochira e douzo.", "source": "JBP L2", "grammar": "こちら is the polite near one. へ points the direction. You hear this line far more often than you say it. See [[kosoado]]."}, {"en": "Thank you very much.", "kana": "どうもありがとうございました。", "romaji": "Doumo arigatou gozaimashita.", "source": "JBP L11", "grammar": "Past tense, because the thing you are thanking for is finished. See [[past-polite]]."}]}, {"n": 9, "title": {"en": "Weather and time", "kana": "てんきとじかん"}, "note": ["Remember it is winter where you are, so the cold words are the honest ones.", "Grammar focus: days of the week, the clock, and から to まで. Watch the two counters: じ is o'clock, じかん is hours."], "lines": [{"en": "What day is it today?", "kana": "きょうはなんようびですか。", "romaji": "Kyou wa nan-youbi desu ka.", "source": "JBP L4", "grammar": "See [[days-of-week]]."}, {"en": "It is Wednesday.", "kana": "すいようびです。", "romaji": "Suiyoubi desu.", "source": "JBP L4", "grammar": "Every day ends in ようび, so only the first part changes. See [[days-of-week]]."}, {"en": "What is the weather like today?", "kana": "きょうのてんきはどうですか。", "romaji": "Kyou no tenki wa dou desu ka.", "source": "JBP L10", "grammar": "どうですか asks how something is; どうでしたか asks how it was. See [[dou-deshita]]."}, {"en": "It is cold today.", "kana": "きょうはさむいです。", "romaji": "Kyou wa samui desu.", "source": "JBP L10", "grammar": "さむい is about the air. つめたい is cold to the touch, for a drink or a hand."}, {"en": "Yesterday was warm.", "kana": "きのうはあたたかかったです。", "romaji": "Kinou wa atatakakatta desu.", "source": "JBP L10 and L11", "grammar": "あたたかい becomes あたたかかったです. Four か sounds in a row, and it is correct. See [[adj-past]]."}, {"en": "It was raining yesterday.", "kana": "きのうはあめでした。", "romaji": "Kinou wa ame deshita.", "source": "JBP L11", "grammar": "あめ is a noun, not an adjective, so the past is でした. See [[adj-past]]."}, {"en": "Will it rain tomorrow?", "kana": "あしたはあめですか。", "romaji": "Ashita wa ame desu ka.", "source": "JBP L11", "grammar": "Japanese has no separate future form. です and ます cover now and later, and the time word does the rest. See [[verb-forms]]."}, {"en": "What time is it now?", "kana": "いまなんじですか。", "romaji": "Ima nan-ji desu ka.", "source": "JBP time", "grammar": "See [[time-counters]]. じ is a point on the clock."}, {"en": "It is half past three.", "kana": "さんじはんです。", "romaji": "San-ji han desu.", "source": "JBP time", "words": [{"word": "はん", "romaji": "han", "gloss": "half past", "anchor": "goes after the hour: さんじはん, half past three"}]}, {"en": "It is five past nine.", "kana": "くじごふんです。", "romaji": "Ku-ji go-fun desu.", "source": "JBP L4", "grammar": "Minutes are ふん or ぷん depending on the number in front. Nine o'clock is くじ, never きゅうじ. See [[telling-time]]."}, {"en": "The shop is open from nine until five.", "kana": "おみせはくじからごじまでです。", "romaji": "Omise wa ku-ji kara go-ji made desu.", "source": "JBP から／まで", "grammar": "から and まで as a pair: from and until. Note くじ, not きゅうじ."}, {"en": "From what time is the museum open?", "kana": "はくぶつかんはなんじからですか。", "romaji": "Hakubutsukan wa nan-ji kara desu ka.", "source": "JBP L4", "grammar": "See [[kara-made]]."}, {"en": "It is closed on Mondays.", "kana": "げつようびはやすみです。", "romaji": "Getsuyoubi wa yasumi desu.", "source": "JBP L4", "grammar": "やすみ covers a day off, a holiday and a closed day. See [[days-of-week]]."}, {"en": "How long does it take?", "kana": "どのくらいかかりますか。", "romaji": "Dono kurai kakarimasu ka.", "source": "JBP L11", "grammar": "[[dono-kurai]]. The answer pairs a counter with ぐらい."}, {"en": "About thirty minutes.", "kana": "さんじゅっぷんぐらいです。", "romaji": "Sanjuppun gurai desu.", "source": "JBP time", "words": [{"word": "ぷん", "romaji": "pun", "gloss": "minutes", "anchor": "the counter shifts sound depending on the number: いっぷん, にふん, さんぷん. Do not fight it, just learn the common ones."}]}]}, {"n": 10, "title": {"en": "Shopping and souvenirs", "kana": "かいものとおみやげ"}, "note": ["Prices, sizes and colors. The counters are the hard part; the sentences are not.", "Grammar focus: いくら, numbers up to まん, これ against それ, and comparing two things with どちら."], "lines": [{"en": "How much is this?", "kana": "これはいくらですか。", "romaji": "Kore wa ikura desu ka.", "source": "Easy Conv L3"}, {"en": "Excuse me, how much is that one?", "kana": "すみません。それはいくらですか。", "romaji": "Sumimasen. Sore wa ikura desu ka.", "source": "JBP L3", "grammar": "それ is the middle one: near the person you are talking to, away from you. See [[kosoado]]."}, {"en": "It is 12,000 yen.", "kana": "いちまんにせんえんです。", "romaji": "Ichiman nisen en desu.", "source": "JBP L3", "grammar": "Japanese counts in units of ten thousand, so 12,000 is one まん and two せん. See [[numbers-big]]."}, {"en": "That is a little expensive.", "kana": "ちょっとたかいですね。", "romaji": "Chotto takai desu ne.", "source": "JBP L10", "grammar": "ちょっと softens it into a comment rather than a complaint. See [[ne-yo]] for the ね."}, {"en": "Which is cheaper, this one or that one?", "kana": "これとそれとどちらがやすいですか。", "romaji": "Kore to sore to dochira ga yasui desu ka.", "source": "Beyond the class", "grammar": "See [[dochira-ga]]. と links the two candidates, どちら asks which of exactly two."}, {"en": "That one is cheaper.", "kana": "それのほうがやすいです。", "romaji": "Sore no hou ga yasui desu.", "source": "Beyond the class", "grammar": "のほうが marks the winner of a comparison of two. See [[dochira-ga]]."}, {"en": "May I look at it?", "kana": "みてもいいですか。", "romaji": "Mite mo ii desu ka.", "source": "Easy Conv L3", "grammar": "See [[te-mo-ii]]. みます becomes みて: only one sound is left after dropping ます, so there is nothing to change."}, {"en": "Do you have a bigger size?", "kana": "おおきいサイズはありますか。", "romaji": "Ookii saizu wa arimasu ka.", "source": "Easy Conv L3"}, {"en": "Do you have a different color?", "kana": "ほかのいろはありますか。", "romaji": "Hoka no iro wa arimasu ka.", "source": "Easy Conv L3", "words": [{"word": "ほかの", "romaji": "hoka no", "gloss": "another, a different one", "anchor": "attaches to the noun with の, like えきのまえ. See [[no-linker]]."}]}, {"en": "I will take two of these, please.", "kana": "これをふたつください。", "romaji": "Kore o futatsu kudasai.", "source": "JBP L3 counters", "grammar": "ひとつ, ふたつ, みっつ is the general counter for objects, up to ten. It works when you do not know the specific counter."}, {"en": "Five postcards, please.", "kana": "はがきをごまいください。", "romaji": "Hagaki o go-mai kudasai.", "source": "JBP L3", "grammar": "まい counts flat things: postcards, tickets, shirts, sheets of paper. See [[counters]].", "words": [{"word": "はがき", "romaji": "hagaki", "gloss": "postcard", "anchor": "きって is the stamp that goes on it"}]}, {"en": "I want to buy a souvenir.", "kana": "おみやげをかいたいです。", "romaji": "Omiyage o kaitai desu.", "source": "Easy Conv L3 + [[tai-desu]]", "grammar": "かいます becomes かいたいです. Drop ます, add たいです."}, {"en": "I bought a souvenir for my family.", "kana": "かぞくにおみやげをかいました。", "romaji": "Kazoku ni omiyage o kaimashita.", "source": "JBP L9", "grammar": "に also marks the person who receives something. See [[ni-particle]]."}, {"en": "No thank you, I am fine.", "kana": "だいじょうぶです。ありがとうございます。", "romaji": "Daijoubu desu. Arigatou gozaimasu.", "source": "Easy Conv L3 Expression of the Day", "grammar": "けっこうです means the same thing and is slightly more formal. Adding ありがとうございます keeps either one warm."}, {"en": "Do you have a bag?", "kana": "ふくろはありますか。", "romaji": "Fukuro wa arimasu ka.", "source": "JBP L12", "grammar": "See [[arimasu-imasu]]. Shops ask this before they wrap anything."}]}, {"n": 11, "title": {"en": "Plans for tomorrow", "kana": "あしたのよてい"}, "note": ["Wanting, inviting and arranging. Say them about tomorrow as you actually plan it.", "Grammar focus: ます covers now and later, so the time word carries the future. Plus ませんか and たいです."], "lines": [{"en": "What will you do tomorrow?", "kana": "あしたなにをしますか。", "romaji": "Ashita nani o shimasu ka.", "source": "Easy Conv L5"}, {"en": "Are you free tomorrow?", "kana": "あしたはひまですか。", "romaji": "Ashita wa hima desu ka.", "source": "JBP L10", "grammar": "ひま is a な-adjective, so the question is just です plus か. See [[adj-types]]."}, {"en": "I want to go to the museum.", "kana": "はくぶつかんへいきたいです。", "romaji": "Hakubutsukan e ikitai desu.", "source": "Easy Conv L4 + [[tai-desu]]", "words": [{"word": "はくぶつかん", "romaji": "hakubutsukan", "gloss": "museum", "anchor": "the かん ending turns up in buildings: としょかん library, たいしかん embassy"}]}, {"en": "I do not want to go far.", "kana": "とおくへいきたくないです。", "romaji": "Tooku e ikitaku nai desu.", "source": "JBP L10", "grammar": "たいです behaves like an い-adjective, so the negative is たくないです. See [[tai-desu]] and [[adj-negative]]."}, {"en": "Shall we go together?", "kana": "いっしょにいきませんか。", "romaji": "Issho ni ikimasen ka.", "source": "Easy Conv L5", "grammar": "[[masen-ka]]. The negative shape is what makes it polite: it leaves room to say no."}, {"en": "Shall we eat dinner together?", "kana": "いっしょにばんごはんをたべませんか。", "romaji": "Issho ni bangohan o tabemasen ka.", "source": "JBP L6", "grammar": "See [[masen-ka]]. It looks negative but it is an invitation."}, {"en": "Yes, that sounds good.", "kana": "ええ、いいですね。", "romaji": "Ee, ii desu ne.", "source": "JBP L11", "grammar": "ね invites agreement, which is what makes this an acceptance rather than a flat statement. See [[ne-yo]] and [[aizuchi]]."}, {"en": "Let's go.", "kana": "いきましょう。", "romaji": "Ikimashou.", "source": "Easy Conv L5", "grammar": "～ましょう is the firmer partner of ～ませんか: the decision is already made."}, {"en": "What time shall we meet?", "kana": "なんじにまちあわせますか。", "romaji": "Nan-ji ni machiawasemasu ka.", "source": "Easy Conv L5", "grammar": "まちあわせます means meeting at an arranged place and time, not bumping into someone."}, {"en": "Let's meet at six.", "kana": "ろくじにあいましょう。", "romaji": "Roku-ji ni aimashou.", "source": "JBP L6", "grammar": "に pins an action to a clock time. Words like あした and きょう take no に at all. See [[ni-particle]]."}, {"en": "How about in front of the hotel?", "kana": "ホテルのまえはどうですか。", "romaji": "Hoteru no mae wa dou desu ka.", "source": "Easy Conv L5", "grammar": "まえ is a position word, and の attaches it to the place. See [[position-words]] and [[no-linker]]."}, {"en": "When are you going home?", "kana": "いつかえりますか。", "romaji": "Itsu kaerimasu ka.", "source": "JBP L6", "grammar": "かえります here is about the future, and nothing in the verb says so. See [[verb-forms]]."}, {"en": "I am going home on the eighth.", "kana": "ようかにかえります。", "romaji": "Youka ni kaerimasu.", "source": "JBP L4", "grammar": "Days of the month one through ten have their own readings that you memorise. See [[counters]].", "words": [{"word": "ようか", "romaji": "youka", "gloss": "the eighth of the month", "anchor": "the number eight is はち, but the date is ようか, one of the ten irregular ones"}]}, {"en": "I am looking forward to it.", "kana": "たのしみです。", "romaji": "Tanoshimi desu.", "source": "Easy Conv L5", "grammar": "The noun built from たのしい. Said about something still ahead of you."}, {"en": "Sorry, tomorrow is a little difficult.", "kana": "すみません。あしたは、ちょっと…。", "romaji": "Sumimasen. Ashita wa, chotto....", "source": "Easy Conv L5", "grammar": "The polite refusal. You trail off deliberately and never finish the sentence, which is what makes it soft."}]}, {"n": 12, "title": {"en": "Going home", "kana": "きこく"}, "note": ["Last day. Look back over the whole trip in the past tense, then close it out.", "Grammar focus: どのくらい, どうして and から, and いちばん for the best of everything."], "lines": [{"en": "How was the trip?", "kana": "りょこうはどうでしたか。", "romaji": "Ryokou wa dou deshita ka.", "source": "JBP L11 + Easy Conv L2", "grammar": "[[dou-deshita]]. Ask it of yourself and answer aloud."}, {"en": "It was really fun.", "kana": "ほんとうにたのしかったです。", "romaji": "Hontou ni tanoshikatta desu.", "source": "JBP L10 and L11", "grammar": "ほんとうに is a stronger とても. See [[adj-past]]."}, {"en": "How long were you in Australia?", "kana": "オーストラリアにどのくらいいましたか。", "romaji": "Oosutoraria ni dono kurai imashita ka.", "source": "JBP L11", "grammar": "See [[dono-kurai]]. いました is the past of います, for people."}, {"en": "About twelve days.", "kana": "じゅうににちぐらいです。", "romaji": "Juuni-nichi gurai desu.", "source": "JBP L4", "grammar": "にち counts days from eleven upward, plainly. The first ten have their own irregular readings. See [[counters]]."}, {"en": "Why did you go to Australia?", "kana": "どうしてオーストラリアへいきましたか。", "romaji": "Doushite Oosutoraria e ikimashita ka.", "source": "JBP L9", "grammar": "See [[doushite-kara]]. へ marks the destination, and に would work here too."}, {"en": "Because my family is there.", "kana": "かぞくがいますから。", "romaji": "Kazoku ga imasu kara.", "source": "JBP L9", "grammar": "から at the end of a sentence means because. See [[doushite-kara]]."}, {"en": "Australia is a beautiful place.", "kana": "オーストラリアはきれいなところです。", "romaji": "Oosutoraria wa kirei na tokoro desu.", "source": "JBP L10", "grammar": "な before the noun, because きれい is a な-adjective. See [[adj-types]]."}, {"en": "Which place was the best?", "kana": "どこがいちばんよかったですか。", "romaji": "Doko ga ichiban yokatta desu ka.", "source": "JBP L11", "grammar": "See [[ichiban]]. いい becomes よかった in the past, never いかった."}, {"en": "I ate a lot of delicious food.", "kana": "おいしいものをたくさんたべました。", "romaji": "Oishii mono o takusan tabemashita.", "source": "JBP L8 and L10", "grammar": "もの is a physical thing. See [[stem-nouns]] for how たべもの is built from the same word."}, {"en": "I did not speak much Japanese.", "kana": "にほんごをあまりはなしませんでした。", "romaji": "Nihongo o amari hanashimasen deshita.", "source": "JBP L6", "grammar": "あまり only ever appears with a negative, and together they mean not much.", "words": [{"word": "あまり", "romaji": "amari", "gloss": "not much, not very", "anchor": "its opposite is とても, which only appears with positives"}]}, {"en": "Next time I want to go to Japan.", "kana": "こんど、にほんへいきたいです。", "romaji": "Kondo, Nihon e ikitai desu.", "source": "Easy Conv L6", "grammar": "See [[kondo]] and [[tai-desu]]."}, {"en": "I want to come again.", "kana": "またきたいです。", "romaji": "Mata kitai desu.", "source": "Easy Conv L4 + [[tai-desu]]", "grammar": "きます becomes きたいです. Slightly irregular in sound but the same rule."}, {"en": "I am a little tired, but I am happy.", "kana": "ちょっとつかれましたが、うれしいです。", "romaji": "Chotto tsukaremashita ga, ureshii desu.", "source": "JBP L11", "grammar": "[[ga-but]] joining two halves that pull against each other.", "words": [{"word": "うれしい", "romaji": "ureshii", "gloss": "happy, glad", "anchor": "an い-adjective, so the past is うれしかったです"}]}, {"en": "Thank you for everything.", "kana": "いろいろありがとうございました。", "romaji": "Iroiro arigatou gozaimashita.", "source": "JBP L11", "grammar": "Past tense, because the trip is over. See [[past-polite]]."}, {"en": "I am going home now.", "kana": "これからうちへかえります。", "romaji": "Kore kara uchi e kaerimasu.", "source": "JBP L6", "grammar": "かえります is specifically returning home, not just going. これから means from now on, from here."}]}]};
const CONCEPTS = {"te-form": {"chip": "て-form", "title": "The て-form, and when you need it", "body": ["**When:** only when something attaches after the verb. Never alone, never at the end of a sentence.", "**What attaches:** ください (request), もいいですか (permission), います (ongoing state), みます (try it).", "**It also joins clauses:** べんきょうして、どのくらいですか, having studied, how long is it?", "**How to build it,** from the ます form: く becomes いて (おきます, おいて). り, ち, い become って (とります, とって). み, び become んで (のみます, のんで). し becomes して. One sound left, add て (たべます, たべて).", "**Irregular:** いきます becomes いって.", "Swap that final て for た and you have the [[ta-form]]."], "examples": [{"kana": "とります → とって → とってもいいですか。", "romaji": "Totte mo ii desu ka.", "en": "attaching a pattern: may I take one?"}, {"kana": "みせます → みせて → みせてください。", "romaji": "Misete kudasai.", "en": "attaching a pattern: please show me"}, {"kana": "べんきょうして、どのくらいですか。", "romaji": "Benkyou shite, dono kurai desu ka.", "en": "joining two halves: having studied, how long is it?"}, {"kana": "いって → いった", "romaji": "itte, itta", "en": "swap て for た and you have the plain past"}], "source": "Lesson 4"}, "te-kudasai": {"chip": "～てください", "title": "Asking someone to do something", "body": ["**When:** you want to ask someone to do something politely.", "**How:** [[te-form]] plus ください.", "まちます → まって → まってください."], "examples": [{"kana": "まちます → まって → まってください。", "romaji": "Matte kudasai.", "en": "Please wait."}, {"kana": "まがります → まがって → まがってください。", "romaji": "Magatte kudasai.", "en": "Please turn."}], "source": "Lesson 4"}, "te-mo-ii": {"chip": "～てもいいですか", "title": "Asking permission: ～てもいいですか", "body": ["**When:** you want permission to do something.", "**How:** [[te-form]] plus もいいですか.", "**The pieces:** て (the verb), も (even if), いい (good), ですか (is it?). Literally: is it all right even if I do this?", "**The reply you want:** はい、どうぞ."], "examples": [{"kana": "とります → とって → とってもいいですか。", "romaji": "Totte mo ii desu ka.", "en": "May I take (a photo)?"}, {"kana": "おきます → おいて → おいてもいいですか。", "romaji": "Oite mo ii desu ka.", "en": "May I put it (here)?"}], "source": "Lesson 4"}, "te-imasu": {"chip": "～ています", "title": "Ongoing states", "body": ["**When:** describing something ongoing or a continuing state, rather than a one-off action.", "**How:** [[te-form]] plus います.", "Japanese uses it for where you live, where you work and what you do for a living, where English just uses the present tense."], "examples": [{"kana": "すみます → すんで → すんでいます。", "romaji": "Sunde imasu.", "en": "I live (there)."}, {"kana": "します → して → しています。", "romaji": "Shite imasu.", "en": "I do (it) / I work as."}, {"kana": "つとめます → つとめて → つとめています。", "romaji": "Tsutomete imasu.", "en": "I work at."}], "source": "Lesson 1"}, "tai-desu": {"chip": "～たいです", "title": "Saying what you want to do", "body": ["**When:** saying what you want to do.", "**How:** drop ます and add たいです. No て-form needed for this one.", "いきます → いきたいです.  たべます → たべたいです."], "examples": [{"kana": "いきます → いきたいです。", "romaji": "Ikitai desu.", "en": "I want to go."}, {"kana": "たべます → たべたいです。", "romaji": "Tabetai desu.", "en": "I want to eat."}], "source": "Lessons 4 and 5"}, "masen-ka": {"chip": "～ませんか", "title": "Inviting someone", "body": ["**When:** inviting someone, without pressing them.", "**Why the negative shape:** literally won't you do it? It leaves the other person free to decline.", "**Its firmer partner** is ～ましょう, let's, for when the decision is already made."], "examples": [{"kana": "いっしょにおちゃしませんか。", "romaji": "Issho ni ocha shimasen ka.", "en": "Shall we grab tea together?"}, {"kana": "わしょくをたべにいきませんか。", "romaji": "Washoku o tabe ni ikimasen ka.", "en": "Would you like to go eat Japanese food?"}], "source": "Lesson 5"}, "ne-yo": {"chip": "ね and よ", "title": "ね and よ at the end of a sentence", "body": ["**ね** invites the other person to agree with something you both know.", "**よ** tells them something they did not know.", "They can turn up in the same short exchange."], "examples": [{"kana": "すごいですね。", "romaji": "Sugoi desu ne.", "en": "That's impressive, isn't it."}, {"kana": "しんかんせんははやいですよ。", "romaji": "Shinkansen wa hayai desu yo.", "en": "The shinkansen is fast, you know."}], "source": "Lessons 1 and 2"}, "de-particle": {"chip": "で", "title": "Two jobs for で", "body": ["**Place:** where the action happens. にほんでなにをしますか.", "**Means:** what you use to do it. しんかんせんでいきます.", "Same particle, two jobs, and the verb tells you which.", "**Exception:** あるいて, on foot, takes no で."], "examples": [{"kana": "にほんでなにをしますか。", "romaji": "Nihon de nani o shimasu ka.", "en": "What will you do in Japan? (place)"}, {"kana": "しんかんせんでいきます。", "romaji": "Shinkansen de ikimasu.", "en": "I'll go by shinkansen. (means)"}], "source": "Lessons 2 and 4"}, "no-linker": {"chip": "の", "title": "の joining two nouns", "body": ["**Joins two nouns:** the second belongs to, or is described by, the first.", "はねだのてんき, the weather in Haneda.  とうきょうのぎんこう, a bank in Tokyo.", "**It also attaches position words:** えきのまえ, in front of the station."], "examples": [{"kana": "はねだのてんき", "romaji": "Haneda no tenki", "en": "the weather in Haneda"}, {"kana": "とうきょうのぎんこう", "romaji": "Toukyou no ginkou", "en": "a bank in Tokyo"}, {"kana": "えきのまえ", "romaji": "eki no mae", "en": "in front of the station"}], "source": "Lessons 1 and 2"}, "polite-o": {"chip": "polite お-", "title": "The polite お- prefix", "body": ["**When:** the thing belongs to the other person, or staff are speaking to a customer.", "おなまえ, your name.  おしごと, your work.", "**Some words carry it almost always:** おちゃ, おべんとう."], "examples": [{"kana": "おなまえはなんですか。", "romaji": "Onamae wa nan desu ka.", "en": "What is your name?"}, {"kana": "おしごとはなんですか。", "romaji": "Oshigoto wa nan desu ka.", "en": "What do you do for work?"}], "source": "Lesson 1"}, "kosoado": {"chip": "これ／この／こちら", "title": "The これ family, all sixteen", "body": ["**Four columns:** こ near me, そ near you, あ far from both, ど the question.", "**これ, それ, あれ, どれ** stand alone and mean this one, that one, that one over there, which one. Nothing follows them.", "**この, その, あの, どの** always have a noun after them: このまち, あのバス, どのバス.", "**ここ, そこ, あそこ, どこ** are places: here, there, over there, where.", "**こちら, そちら, あちら, どちら** are the polite set, for directions and for customers. Staff say こちらへどうぞ and あちらです. どちら is also which of two.", "**The pattern never breaks.** Learn the four columns once and all sixteen follow."], "examples": [{"kana": "これはいくらですか。", "romaji": "Kore wa ikura desu ka.", "en": "How much is this?"}, {"kana": "それはなんですか。", "romaji": "Sore wa nan desu ka.", "en": "What is that? (near you)"}, {"kana": "あのバスです。", "romaji": "Ano basu desu.", "en": "That bus over there."}, {"kana": "ちずはどれですか。", "romaji": "Chizu wa dore desu ka.", "en": "Which one is the map?"}, {"kana": "あそこにこどもがいます。", "romaji": "Asoko ni kodomo ga imasu.", "en": "There is a child over there."}, {"kana": "こちらへどうぞ。", "romaji": "Kochira e douzo.", "en": "This way, please. (staff)"}], "source": "Lessons 2 and 3"}, "past-polite": {"chip": "ました", "title": "Thanking in the past", "body": ["**ありがとうございます** thanks for something still going on.", "**ありがとうございました** thanks for something now finished, so it is what you say as you leave.", "The same ました ending turns any ます verb into the past: いきます becomes いきました."], "examples": [{"kana": "ありがとうございます。", "romaji": "Arigatou gozaimasu.", "en": "Thank you. (ongoing)"}, {"kana": "ありがとうございました。", "romaji": "Arigatou gozaimashita.", "en": "Thank you. (finished)"}], "source": "Lesson 1 and the textbook"}, "aizuchi": {"chip": "あいづち", "title": "Showing you are listening", "body": ["**What:** short reactions dropped in to show you are following.", "**Why it matters:** Japanese expects them far more often than English does. Silence reads as disengagement, not politeness.", "そうですか, oh really.  そうなんですか, is that so, warmer.  へえ～！すごいですね, wow."], "examples": [{"kana": "そうですか。", "romaji": "Sou desu ka.", "en": "Oh, really?"}, {"kana": "そうなんですか。", "romaji": "Sou nan desu ka.", "en": "Is that so? (warmer, more surprised)"}, {"kana": "へえ～！すごいですね。", "romaji": "Hee~! Sugoi desu ne.", "en": "Wow, that's amazing!"}], "source": "every Easy Conversation lesson"}, "keigo": {"chip": "keigo", "title": "Keigo: the formal layer", "body": ["**When:** announcements, staff, and anyone serving a customer.", "**You need to recognize it, not produce it.**", "**The common swaps:** です becomes でございます, します becomes いたします, います becomes おります, もらいます becomes いただきます.", "**Nouns take ご- or お-:** ごとうじょう, ごりよう, おしょくじ.", "Spot those endings and the sentence underneath is usually one you know."], "examples": [{"kana": "きちょうのやまだです。 → きちょうのやまだでございます。", "romaji": "Kichou no Yamada de gozaimasu.", "en": "This is Captain Yamada. (formal)"}, {"kana": "とうちゃくしました。 → とうちゃくいたしました。", "romaji": "Touchaku itashimashita.", "en": "We have arrived. (humble)"}, {"kana": "まってください。 → おまちください。", "romaji": "Omachi kudasai.", "en": "Please wait. (formal)"}], "source": "outside the class syllabus, but worth recognizing in Japan"}, "adj-types": {"chip": "い / な adjectives", "title": "Two kinds of adjective", "body": ["**い-adjectives** end in い and attach straight to a noun: おおきいこうえん.", "**な-adjectives** need な in between: きれいなはな.", "The split matters because the two form the past differently. See [[adj-past]]."], "examples": [{"kana": "たかいです。", "romaji": "Takai desu.", "en": "It's expensive. (い-adjective)"}, {"kana": "ひまです。", "romaji": "Hima desu.", "en": "I'm free. (な-adjective)"}], "source": "Lesson 10"}, "adj-past": {"chip": "was / were", "title": "Adjectives in the past", "body": ["**い-adjectives:** drop い, add かったです. たのしい → たのしかったです.", "**な-adjectives and nouns:** swap です for でした. ひまです → ひまでした.", "**Irregular:** いい becomes よかった, never いかった.", "Get the type right and the past follows. See [[adj-types]]."], "examples": [{"kana": "たのしい → たのしかったです。", "romaji": "Tanoshikatta desu.", "en": "It was fun."}, {"kana": "むずかしい → むずかしかったです。", "romaji": "Muzukashikatta desu.", "en": "It was difficult."}, {"kana": "ひまです → ひまでした。", "romaji": "Hima deshita.", "en": "I was free."}, {"kana": "たいへんです → たいへんでした。", "romaji": "Taihen deshita.", "en": "It was tough."}, {"kana": "いい → よかったです。", "romaji": "Yokatta desu.", "en": "It was good. (irregular)"}], "source": "Lesson 11"}, "ga-but": {"chip": "が (but)", "title": "が joining two halves", "body": ["**When:** you want to say two things that pull against each other, in one sentence.", "**How:** put が at the end of the first clause.", "たのしかったですが、むずかしかったです。 It was fun, but it was difficult.", "**Not the same が** as the one marking a subject. See [[ga-subject]]."], "examples": [{"kana": "たのしかったですが、むずかしかったです。", "romaji": "Tanoshikatta desu ga, muzukashikatta desu.", "en": "It was fun, but it was difficult."}, {"kana": "たいへんですが、たのしいです。", "romaji": "Taihen desu ga, tanoshii desu.", "en": "It's tough, but it's fun."}], "source": "Lesson 11"}, "dou-deshita": {"chip": "どうでしたか", "title": "Asking how something was", "body": ["**どうですか** asks how something is.  **どうでしたか** asks how it was.", "It opens almost any catch-up conversation.", "**The answer** is nearly always a past-tense adjective, so listen for かったです or でした. See [[adj-past]]."], "examples": [{"kana": "クラスはどうでしたか。", "romaji": "Kurasu wa dou deshita ka.", "en": "How was the class?"}, {"kana": "とてもたのしかったです。", "romaji": "Totemo tanoshikatta desu.", "en": "It was a lot of fun."}], "source": "Lesson 11"}, "dono-kurai": {"chip": "どのくらい", "title": "How long, how much", "body": ["**When:** asking about a length of time or an amount.", "**The answer** usually pairs a counter with ～ぐらい, about: はちじかんぐらい, about eight hours.", "See [[time-counters]] for which counter to use."], "examples": [{"kana": "どのくらいべんきょうしていますか。", "romaji": "Dono kurai benkyou shite imasu ka.", "en": "How long have you been studying?"}, {"kana": "にねんぐらいです。", "romaji": "Ni-nen gurai desu.", "en": "About two years."}], "source": "Lesson 11"}, "kondo": {"chip": "こんど", "title": "こんど: this coming, or next time", "body": ["**With a day attached:** this coming. こんどのどようび, this Saturday.", "**On its own:** sometime soon, next time. こんどいっしょにいきませんか.", "**With また in front:** a sign-off. またこんど, see you next time.", "The vagueness is the point. It lets you suggest something without committing to a date."], "examples": [{"kana": "こんどのどようび", "romaji": "kondo no doyoubi", "en": "this coming Saturday"}, {"kana": "こんどいっしょにいきませんか。", "romaji": "Kondo issho ni ikimasen ka.", "en": "Shall we go together sometime?"}, {"kana": "またこんど。", "romaji": "Mata kondo.", "en": "See you next time."}], "source": "Easy Conv L5 and JBP L11"}, "stem-nouns": {"chip": "ます-stem", "title": "Turning a verb into a noun", "body": ["**The stem:** drop ます. たべます gives たべ, のみます gives のみ, かいます gives かい.", "**Add もの, thing,** and you have a noun. たべもの is literally an eating-thing.", "たべもの food.  のみもの a drink.  かいもの shopping.", "**もの versus こと:** もの is a physical thing you could hold, こと is an abstract one, a fact or an act.", "The same stem is what ～たいです attaches to, so finding it pays off twice. See [[tai-desu]]."], "examples": [{"kana": "たべます → たべ + もの → たべもの", "romaji": "tabemono", "en": "food"}, {"kana": "のみます → のみ + もの → のみもの", "romaji": "nomimono", "en": "a drink"}, {"kana": "かいます → かい + もの → かいもの", "romaji": "kaimono", "en": "shopping"}], "source": "JBP Lessons 8 and 10"}, "time-counters": {"chip": "じ / じかん", "title": "O'clock versus hours", "body": ["**～じ** is a point on the clock. はちじ, eight o'clock.", "**～じかん** is a length of time. はちじかん, eight hours.", "**～ねん** counts years the same way. にねん, two years.", "Add ～ぐらい to any of them for about."], "examples": [{"kana": "はちじ", "romaji": "hachi-ji", "en": "eight o'clock"}, {"kana": "はちじかん", "romaji": "hachi-jikan", "en": "eight hours"}, {"kana": "にねんぐらい", "romaji": "ni-nen gurai", "en": "about two years"}], "source": "JBP Lesson 11"}, "ga-subject": {"chip": "が (subject)", "title": "The other が", "body": ["**When:** marking what an adjective describes, or what you like, or what exists.", "**Question words always take it:** なにがむずかしいですか.", "おすしがすきです, sushi is what I like.  うみがきれいでした, the ocean was beautiful.", "**Not the same が** as the one meaning but. See [[ga-but]]."], "examples": [{"kana": "なにがむずかしかったですか。", "romaji": "Nani ga muzukashikatta desu ka.", "en": "What was difficult?"}, {"kana": "おすしがすきです。", "romaji": "Osushi ga suki desu.", "en": "I like sushi."}, {"kana": "うみがきれいでした。", "romaji": "Umi ga kirei deshita.", "en": "The ocean was beautiful."}], "source": "JBP Lessons 10 and 11"}, "which-form": {"chip": "choosing a form", "title": "Which verb form do I need?", "body": ["**Look at what comes after the verb.** That decides the form, not the meaning you are going for.", "**Nothing comes after it** and the verb ends the sentence: use ます or ました. いきます, いきました. Never て, never た.", "**ください, もいいですか, います or みます comes after:** use the [[te-form]]. いってください, いってもいいですか.", "**Another clause comes after:** use the [[te-form]] to join them. べんきょうして、どのくらいですか.", "**ことがあります comes after:** use the [[ta-form]]. いったことがあります.", "So て and た are never something you choose. They are demanded by whatever follows."], "examples": [{"kana": "いきました。", "romaji": "Ikimashita.", "en": "ends the sentence, so ました"}, {"kana": "いってください。", "romaji": "Itte kudasai.", "en": "ください follows, so the て-form"}, {"kana": "いったことがあります。", "romaji": "Itta koto ga arimasu.", "en": "ことがあります follows, so the た-form"}], "source": "Lessons 4 and 11"}, "arimasu-imasu": {"chip": "あります／います", "title": "There is, there are", "body": ["**あります** for things: books, buildings, shops, flowers.", "**います** for anything alive: people, animals, insects.", "**The shape:** [place] に [thing] が あります. に marks where, が marks what.", "が is used because you are introducing something the listener does not know about yet. See [[ga-subject]].", "**Negatives:** ありません and いません."], "examples": [{"kana": "いっかいにうけつけがあります。", "romaji": "Ikkai ni uketsuke ga arimasu.", "en": "There is a reception desk on the first floor."}, {"kana": "うけつけにおんなのひとがいます。", "romaji": "Uketsuke ni onna no hito ga imasu.", "en": "There is a woman at the reception desk."}], "source": "Lesson 12"}, "position-words": {"chip": "うえ／した", "title": "Saying where something is", "body": ["Position words attach to a noun with **の**: [thing] の [position].", "**うえ** on, above.  **した** under, below.  **まえ** in front of.  **ちかく** near.", "Then the whole phrase takes に to mark the location.", "It is the same の that joins any two nouns. See [[no-linker]]."], "examples": [{"kana": "テーブルのうえにはながあります。", "romaji": "Teeburu no ue ni hana ga arimasu.", "en": "There are flowers on the table."}, {"kana": "えきのまえ", "romaji": "eki no mae", "en": "in front of the station"}], "source": "Lesson 12"}, "ya-to": {"chip": "や and と", "title": "Two ways to say and", "body": ["**と** gives the complete list: these and nothing else.", "**や** gives examples: these among other things.", "So おてらやじんじゃ means temples, shrines and other sights. おてらとじんじゃ means those two only.", "Both join **nouns only**. Neither can join verbs or clauses."], "examples": [{"kana": "おてらやじんじゃがあります。", "romaji": "Otera ya jinja ga arimasu.", "en": "There are temples, shrines and so on."}, {"kana": "ぎんこうとコンビニがあります。", "romaji": "Ginkou to konbini ga arimasu.", "en": "There is a bank and a convenience store, and nothing else."}], "source": "Lesson 12"}, "tte-nan-desu-ka": {"chip": "ってなんですか", "title": "What is a ...?", "body": ["When you hear a word you do not know, **repeat it back** and add ってなんですか.", "って is a casual quoting particle: the thing you just said.", "It is the most useful survival sentence in the language, because it keeps a conversation going instead of ending it.", "The polite full form is ～はなんですか, but ってなんですか is what people actually say."], "examples": [{"kana": "おんせんってなんですか。", "romaji": "Onsen tte nan desu ka.", "en": "What is an onsen?"}, {"kana": "これはなんですか。", "romaji": "Kore wa nan desu ka.", "en": "What is this? (pointing)"}], "source": "Lesson 12"}, "wo-particle": {"chip": "を", "title": "を marks what the verb acts on", "body": ["**Where it goes:** straight after the thing, straight before the verb. コーヒーをのみます.", "**It is pronounced o**, not wo, even though it is written with its own kana.", "**It survives the negative:** ひるごはんをたべませんでした still keeps を.", "**A count slides in between:** みずをにほんかいました, I bought two bottles of water.", "**Some verbs refuse it.** のります takes に, because you board into a vehicle rather than act on it."], "examples": [{"kana": "えいがをみました。", "romaji": "Eiga o mimashita.", "en": "I watched a movie."}, {"kana": "しゃしんをとってください。", "romaji": "Shashin o totte kudasai.", "en": "Please take a photograph."}, {"kana": "これをふたつください。", "romaji": "Kore o futatsu kudasai.", "en": "Two of these, please."}], "source": "Lesson 6"}, "wa-vs-ga": {"chip": "は / が", "title": "Topic against subject", "body": ["**は sets the topic:** as for this, here is what I want to say. わたしはベーカーです.", "**が points at the answer:** it picks out which one, out of everything it could have been.", "**Question words always take が**, never は, because the whole point is which one. だれがきましたか.", "**は is pronounced wa** when it is the particle, and ha everywhere else.", "**A rough test:** if the English sentence would stress the word, use が. Otherwise は.", "**Not the same が** as the one meaning but. See [[ga-but]]."], "examples": [{"kana": "わたしはにほんじんです。", "romaji": "Watashi wa nihonjin desu.", "en": "I am Japanese. (topic)"}, {"kana": "だれがいきますか。", "romaji": "Dare ga ikimasu ka.", "en": "Who is going? (question word takes が)"}, {"kana": "うみがきれいです。", "romaji": "Umi ga kirei desu.", "en": "The sea is beautiful. (が with an adjective)"}], "source": "Lessons 1 and 10"}, "ni-particle": {"chip": "に", "title": "The five jobs of に", "body": ["**A point in time:** ろくじにおきます, I get up at six. Only with numbers on a clock or calendar.", "**Where something exists:** へやにテーブルがあります, there is a table in the room.", "**Where you arrive:** とうきょうにつきました, we arrived in Tokyo.", "**Who receives:** かぞくにおみやげをかいました, I bought a souvenir for my family.", "**Which vehicle you board:** でんしゃにのります. This one just has to be memorized.", "**No に on vague time words.** あした, きょう and けさ take nothing at all.", "**へ against に for a destination:** either works, and へ leans slightly more toward the direction than the arrival."], "examples": [{"kana": "ろくじにあいましょう。", "romaji": "Roku-ji ni aimashou.", "en": "Let's meet at six. (time)"}, {"kana": "ホテルにいます。", "romaji": "Hoteru ni imasu.", "en": "She is at the hotel. (existence)"}, {"kana": "でんしゃにのりませんでした。", "romaji": "Densha ni norimasen deshita.", "en": "I did not take the train. (boarding)"}, {"kana": "あしたいきます。", "romaji": "Ashita ikimasu.", "en": "I am going tomorrow. (no に)"}], "source": "Lessons 4, 6 and 12"}, "to-particle": {"chip": "と", "title": "と for with, and for and", "body": ["**With a person:** かぞくといきます, I am going with my family.", "**Joining nouns:** ぎんこうとゆうびんきょく, a bank and a post office, and that is the complete list.", "**Use や instead** when you are only giving examples and there is more. See [[ya-to]].", "**Comparing two things** it appears twice, once after each candidate. See [[dochira-ga]]."], "examples": [{"kana": "ともだちといきました。", "romaji": "Tomodachi to ikimashita.", "en": "I went with a friend."}, {"kana": "パンとたまごをかいました。", "romaji": "Pan to tamago o kaimashita.", "en": "I bought bread and eggs."}], "source": "Lessons 5 and 9"}, "counters": {"chip": "counting things", "title": "Which counter for what", "body": ["**Japanese never counts bare.** A number needs a counter word glued to it, chosen by the shape of the thing.", "**～つ is the all-purpose one:** ひとつ, ふたつ, みっつ, よっつ, いつつ. It stops at とお, ten. Use it whenever you are unsure.", "**～ほん** for long thin things: bottles, pens, umbrellas. いっぽん, にほん, さんぼん.", "**～まい** for flat things: postcards, tickets, shirts. いちまい, にまい, さんまい.", "**～かい** for floors: いっかい, にかい, さんがい.", "**～にん** for people. See [[counting-people]].", "**～にち** for days of the month, and the first ten are irregular: ついたち, ふつか, みっか, よっか, いつか, むいか, なのか, ようか, ここのか, とおか. From じゅういちにち on it is regular.", "**The sound changes are the work.** One, six, eight and ten squash into the counter that follows: はち plus かい gives はっかい, not はちかい.", "**Where it sits:** after the particle, before the verb. みずをにほんかいました."], "examples": [{"kana": "みっつあります。", "romaji": "Mittsu arimasu.", "en": "There are three."}, {"kana": "はがきをごまいください。", "romaji": "Hagaki o go-mai kudasai.", "en": "Five postcards, please."}, {"kana": "はっかいです。", "romaji": "Hakkai desu.", "en": "It is on the eighth floor."}, {"kana": "ようかにかえります。", "romaji": "Youka ni kaerimasu.", "en": "I am going home on the eighth."}], "source": "Lessons 3 and 4"}, "counting-people": {"chip": "ひとり / ふたり / にん", "title": "Counting people", "body": ["**One and two are irregular:** ひとり and ふたり. Nothing about them is predictable.", "**Three onward is regular:** さんにん, よにん, ごにん, ろくにん.", "**Four is よにん**, not よんにん, and seven is しちにん or ななにん.", "**How many:** なんにんですか.", "**Staff use めいさま instead**, a respectful counter for customers: なんめいさまですか. You never say it about yourself. See [[keigo]]."], "examples": [{"kana": "ふたりです。", "romaji": "Futari desu.", "en": "Two people."}, {"kana": "かぞくはよにんです。", "romaji": "Kazoku wa yonin desu.", "en": "There are four in my family."}, {"kana": "なんにんですか。", "romaji": "Nan-nin desu ka.", "en": "How many people?"}], "source": "Lessons 3 and 9"}, "numbers-big": {"chip": "ひゃく / せん / まん", "title": "Numbers past a hundred", "body": ["**Tens** are just the digit plus じゅう: にじゅう is twenty, ごじゅう is fifty.", "**Hundreds** are ひゃく: にひゃく, ごひゃく. Three, six and eight change sound: さんびゃく, ろっぴゃく, はっぴゃく.", "**Thousands** are せん: にせん, ごせん. Three and eight change: さんぜん, はっせん.", "**Then まん, ten thousand**, and this is the one that catches English speakers. Japanese groups by four digits, not three.", "**So 10,000 is いちまん** and 12,000 is いちまんにせん. 100,000 is じゅうまん, ten まん.", "**Say it left to right**, largest unit first, exactly as you read the digits."], "examples": [{"kana": "さんぜんごひゃくえん", "romaji": "sanzen gohyaku en", "en": "3,500 yen"}, {"kana": "いちまんにせんえん", "romaji": "ichiman nisen en", "en": "12,000 yen"}, {"kana": "にじゅうごのエー", "romaji": "nijuu-go no ee", "en": "25A"}], "source": "Lessons 1 and 3"}, "days-of-week": {"chip": "ようび", "title": "The days of the week", "body": ["**Every one ends in ようび**, so only the first syllable changes.", "げつようび Monday, かようび Tuesday, すいようび Wednesday, もくようび Thursday, きんようび Friday, どようび Saturday, にちようび Sunday.", "**They come from moon, fire, water, wood, gold, earth, sun**, in that order, which is why the list never shuffles.", "**Asking:** なんようびですか.", "**With は they mark a routine:** げつようびはやすみです, it is closed on Mondays."], "examples": [{"kana": "きょうはなんようびですか。", "romaji": "Kyou wa nan-youbi desu ka.", "en": "What day is it today?"}, {"kana": "すいようびです。", "romaji": "Suiyoubi desu.", "en": "It is Wednesday."}, {"kana": "どようびにいきます。", "romaji": "Doyoubi ni ikimasu.", "en": "I am going on Saturday."}], "source": "Lesson 4"}, "telling-time": {"chip": "なんじ / ふん", "title": "Reading the clock", "body": ["**Hours take じ**, and three of them are irregular: よじ four, しちじ seven, くじ nine. Never よんじ or きゅうじ.", "**Minutes take ふん or ぷん**, decided by the number in front. いっぷん, にふん, さんぷん, よんぷん, ごふん, ろっぷん, ななふん, はっぷん, きゅうふん, じゅっぷん.", "**Half past is はん**, put after the hour: さんじはん.", "**Morning and afternoon go in front:** ごぜんじゅうじ, ごごさんじ.", "**About a point in time is ごろ.** About a length of time is ぐらい. See [[time-counters]]."], "examples": [{"kana": "いまなんじですか。", "romaji": "Ima nan-ji desu ka.", "en": "What time is it now?"}, {"kana": "くじごふんです。", "romaji": "Ku-ji go-fun desu.", "en": "It is five past nine."}, {"kana": "ろくじごろかえりました。", "romaji": "Roku-ji goro kaerimashita.", "en": "I got back at about six."}], "source": "Lesson 4"}, "kara-made": {"chip": "から / まで", "title": "From and until", "body": ["**から is from**, まで is until, and they attach to the end of the time or place.", "**They pair up naturally:** くじからごじまで, from nine until five.", "**Either can stand alone:** なんじからですか asks only about the opening time.", "**から also works on places:** アメリカからきました, I came from America.", "**A different から** sits at the very end of a sentence and means because. See [[doushite-kara]]."], "examples": [{"kana": "くじからごじまでです。", "romaji": "Ku-ji kara go-ji made desu.", "en": "From nine until five."}, {"kana": "なんじからですか。", "romaji": "Nan-ji kara desu ka.", "en": "From what time?"}, {"kana": "アメリカからきました。", "romaji": "Amerika kara kimashita.", "en": "I came from America."}], "source": "Lesson 4"}, "verb-forms": {"chip": "ます / ました", "title": "The four verb endings", "body": ["**Every polite verb sits in one of four boxes**, and you swap only the ending.", "**いきます** I go, or I will go.", "**いきません** I do not go, or I will not go.", "**いきました** I went.", "**いきませんでした** I did not go.", "**There is no future form.** ます covers now and later both, and the time word does the work: あしたいきます is tomorrow, まいにちいきます is every day.", "**Everything else stays put.** を, に and で do not move when the ending changes."], "examples": [{"kana": "たべます → たべません", "romaji": "tabemasu, tabemasen", "en": "I eat, I do not eat"}, {"kana": "たべました → たべませんでした", "romaji": "tabemashita, tabemasen deshita", "en": "I ate, I did not eat"}, {"kana": "あしたかえります。", "romaji": "Ashita kaerimasu.", "en": "I am going home tomorrow. (future, same form)"}], "source": "Lesson 6"}, "adj-negative": {"chip": "not / was not", "title": "Adjectives in the negative", "body": ["**い-adjectives** drop い and add くないです. たかい becomes たかくないです.", "**な-adjectives and nouns** swap です for じゃありません. しずかです becomes しずかじゃありません.", "**For the past, add でした to the な version:** しずかじゃありませんでした.", "**For the past い version, swap ない for なかった:** たかくなかったです.", "**いい is irregular** and turns into よ before every ending: よくないです, よかったです, よくなかったです. Never いくない.", "**Get the type right first.** See [[adj
