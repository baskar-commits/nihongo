-types]], then [[adj-past]] for the positive past."], "examples": [{"kana": "おおきくないです。", "romaji": "Ookiku nai desu.", "en": "It is not big."}, {"kana": "しずかじゃありません。", "romaji": "Shizuka ja arimasen.", "en": "It is not quiet."}, {"kana": "つまらなくなかったです。", "romaji": "Tsumaranaku nakatta desu.", "en": "It was not boring."}, {"kana": "にぎやかじゃありませんでした。", "romaji": "Nigiyaka ja arimasen deshita.", "en": "It was not lively."}, {"kana": "よくないです。", "romaji": "Yoku nai desu.", "en": "It is not good. (irregular)"}], "source": "Lessons 10 and 11"}, "question-words": {"chip": "question words", "title": "The whole question set", "body": ["**なに or なん** what. It becomes なん in front of です and counters: なんですか, なんじ, なんにん.", "**だれ** who. どなた is the polite version.", "**どこ** where. どちら is the polite version, and also which of two.", "**いつ** when, in general. For a clock time ask なんじ, for a day ask なんようび.", "**どうして** why. See [[doushite-kara]].", "**どう** how, or what is it like. See [[dou-deshita]].", "**いくら** how much money, **いくつ** how many things. See [[ikura-ikutsu]].", "**どのくらい** how long or how much in total. See [[dono-kurai]].", "**どれ** which one, standing alone. **どの** which, with a noun after it. See [[kosoado]].", "**They all take が, not は**, when they are the subject, because a question word is exactly the thing being singled out."], "examples": [{"kana": "これはなんですか。", "romaji": "Kore wa nan desu ka.", "en": "What is this?"}, {"kana": "だれがいきますか。", "romaji": "Dare ga ikimasu ka.", "en": "Who is going?"}, {"kana": "いつかえりますか。", "romaji": "Itsu kaerimasu ka.", "en": "When are you going home?"}, {"kana": "どこがいちばんよかったですか。", "romaji": "Doko ga ichiban yokatta desu ka.", "en": "Which place was the best?"}], "source": "Lessons 1 through 11"}, "ikura-ikutsu": {"chip": "いくら / いくつ", "title": "How much against how many", "body": ["**いくら asks a price**, and nothing else. これはいくらですか.", "**いくつ asks a number of things**, and takes no counter after it because it already is one.", "**For people use なんにん**, not いくつ. See [[counting-people]].", "**For a length of time use どのくらい.** See [[dono-kurai]].", "**ぜんぶで** in front of いくら asks for the total."], "examples": [{"kana": "これはいくらですか。", "romaji": "Kore wa ikura desu ka.", "en": "How much is this?"}, {"kana": "ぜんぶでいくらですか。", "romaji": "Zenbu de ikura desu ka.", "en": "How much all together?"}, {"kana": "いくつありますか。", "romaji": "Ikutsu arimasu ka.", "en": "How many are there?"}], "source": "Lesson 3"}, "doushite-kara": {"chip": "どうして / から", "title": "Why, and because", "body": ["**どうして asks why**, and sits near the front of the sentence.", "**から answers it**, and sits at the very end, after the whole reason.", "**The order is opposite to English.** English puts because first; Japanese puts から last.", "**It attaches to a finished sentence:** かぞくがいます becomes かぞくがいますから.", "**A different から** attaches to a time or place and means from. See [[kara-made]]."], "examples": [{"kana": "どうしていきましたか。", "romaji": "Doushite ikimashita ka.", "en": "Why did you go?"}, {"kana": "かぞくがいますから。", "romaji": "Kazoku ga imasu kara.", "en": "Because my family is there."}], "source": "Lesson 9"}, "dochira-ga": {"chip": "どちらが", "title": "Comparing two things", "body": ["**Lay out both candidates with と after each one:** これとそれと.", "**Then どちらが plus the adjective:** どちらがやすいですか.", "**Answer with のほうが**, which marks the winner: それのほうがやすいです.", "**Only for two.** With three or more use いちばん. See [[ichiban]].", "**どちら is also polite where**, which is why staff say こちらへどうぞ. Same word, and the context separates them."], "examples": [{"kana": "これとそれとどちらがやすいですか。", "romaji": "Kore to sore to dochira ga yasui desu ka.", "en": "Which is cheaper, this one or that one?"}, {"kana": "それのほうがやすいです。", "romaji": "Sore no hou ga yasui desu.", "en": "That one is cheaper."}], "source": "Beyond the class, but you will hear it in shops"}, "ichiban": {"chip": "いちばん", "title": "The most, the best", "body": ["**いちばん means number one**, and put in front of any adjective it makes a superlative.", "**Nothing else changes:** たのしい becomes いちばんたのしい, most fun of all.", "**The thing being singled out takes が:** なにがいちばんたのしかったですか.", "**For a straight two-way comparison** use どちら instead. See [[dochira-ga]]."], "examples": [{"kana": "なにがいちばんたのしかったですか。", "romaji": "Nani ga ichiban tanoshikatta desu ka.", "en": "What was the most fun?"}, {"kana": "どこがいちばんよかったですか。", "romaji": "Doko ga ichiban yokatta desu ka.", "en": "Which place was the best?"}], "source": "Lesson 11"}};

// Which day is it? Worked out from this device's clock, so no server is involved.
function todayN(){
  const [y,m,d] = DATA.start.split("-").map(Number);
  const start = new Date(y, m-1, d);
  const now = new Date();
  const t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const n = Math.floor((t - start) / 86400000) + 1;
  return (n >= 1 && n <= DATA.days.length) ? n : 0;
}
function dateOf(n){
  const [y,m,d] = DATA.start.split("-").map(Number);
  const dt = new Date(y, m-1, d + n - 1);
  return dt.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
}

const app = document.getElementById("app");
const crumbs = document.getElementById("crumbs");
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function chips(t){
  return esc(t).replace(/\[\[([a-z0-9-]+)\]\]/g,(m,k)=>{
    const c = CONCEPTS[k];
    return c ? '<button type="button" class="cchip" data-concept="'+esc(k)+'">'+esc(c.chip)+'</button>' : m;
  });
}
function md(t){ return chips(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function bodyHtml(b){
  if(!b) return '';
  if(Array.isArray(b)) return '<ul class="cbul">'+b.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul>';
  return '<div>'+md(b)+'</div>';
}
function conceptPanel(k){
  const c = CONCEPTS[k]; if(!c) return '';
  let h = '<div class="cpanel" data-panel="'+esc(k)+'"><h4>'+esc(c.title)+'</h4>'+bodyHtml(c.body);
  (c.examples||[]).forEach(x=>{ h += '<div class="cex"><div class="k">'+esc(x.kana)+'</div><div class="r">'+esc(x.romaji)+'</div><div class="e">'+esc(x.en)+'</div></div>'; });
  if(c.source) h += '<div class="csrc">From '+esc(c.source)+'</div>';
  return h+'</div>';
}
function noteHtml(n){
  if(!n) return '';
  if(Array.isArray(n)) return '<div class="note"><ul>'+n.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul></div>';
  return '<div class="note">'+md(n)+'</div>';
}
function setCrumbs(parts){
  crumbs.innerHTML = parts.map((p,i)=> p.go ? '<a data-go="'+i+'">'+esc(p.label)+'</a>' : esc(p.label)).join(" &nbsp;\u203A&nbsp; ");
  crumbs.querySelectorAll("a[data-go]").forEach(a=>{ a.onclick=()=>parts[+a.dataset.go].go(); });
}
function markKana(t){
  let out = esc(t.kana);
  (t.words||[]).forEach(e=>{ const w=esc(e.word); if(w&&out.includes(w)) out=out.split(w).join('<span class="wordmark">'+w+'</span>'); });
  return out;
}
function lexBlock(list){
  if(!list||!list.length) return '';
  let h='<div class="lex"><div class="lab">Words in this line</div>';
  list.forEach(e=>{
    h += '<div class="row"><span class="wordmark">'+esc(e.word)+'</span>';
    if(e.romaji) h += ' <i>('+esc(e.romaji)+')</i>';
    h += ': '+esc(e.gloss);
    if(e.anchor) h += '<div class="anchor">'+chips(e.anchor)+'</div>';
    h += '</div>';
  });
  return h+'</div>';
}
function renderHub(){
  const t = todayN();
  setCrumbs([{label:"All days"}]);
  let h = '<div class="card"><h2>Twelve days, one short set each</h2>';
  h += '<details class="how"><summary>How to use this</summary><div class="body"><ul>'
     + DATA.howto.map(x=>'<li>'+md(x)+'</li>').join('') + '</ul></div></details></div>';
  h += '<div class="card"><h2>Days</h2>';
  DATA.days.forEach(d=>{
    const isToday = d.n === t, done = t && d.n < t;
    h += '<div class="day'+(isToday?' today':'')+'" data-day="'+d.n+'"><div class="n">'+d.n+'</div><div>';
    h += '<h3>'+esc(d.title.en)+(isToday?'<span class="todaypill">today</span>':(done?'<span class="donepill">past</span>':''))+'</h3>';
    h += '<div class="kana">'+esc(d.title.kana)+' \u00B7 '+dateOf(d.n)+' \u00B7 '+d.lines.length+' lines</div>';
    h += '</div></div>';
  });
  h += '</div>';
  app.innerHTML = h;
  app.querySelectorAll("[data-day]").forEach(el=>{ el.onclick=()=>renderDay(+el.dataset.day); });
  wireChips(app);
}
function renderDay(n){
  const d = DATA.days.find(x=>x.n===n);
  setCrumbs([{label:"All days",go:renderHub},{label:"Day "+n}]);
  let h = '<div class="card"><h2>Day '+n+': '+esc(d.title.en)+' <span class="muted">'+esc(d.title.kana)+'</span></h2>';
  h += '<div class="muted">'+dateOf(n)+'</div>' + noteHtml(d.note) + '</div><div class="card">';
  d.lines.forEach((t,i)=>{
    h += '<div class="turn" data-state="0"><div class="turnhead"><div class="num">'+n+'-'+String(i+1).padStart(2,"0")+'</div></div>';
    h += '<div class="en">'+esc(t.en)+'</div>';
    h += '<div class="hint"><span class="pips"><span class="pip"></span><span class="pip"></span></span><span class="hinttext">tap to reveal the kana</span></div>';
    h += '<div class="kana-line" hidden>'+markKana(t)+'</div>';
    h += '<div class="detail" hidden><div class="romaji-line">'+esc(t.romaji)+'</div>';
    if(t.grammar) h += '<div class="grammar">'+(Array.isArray(t.grammar)
        ? '<ul class="gbul">'+t.grammar.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul>' : md(t.grammar))+'</div>';
    h += lexBlock(t.words);
    h += '<div class="src">Source: '+esc(t.source||"\u2014")+'</div></div></div>';
  });
  h += '</div><div class="card"><div class="btnrow">';
  if(n>1) h += '<button class="btn" data-nav="'+(n-1)+'">\u2190 day '+(n-1)+'</button>';
  if(n<DATA.days.length) h += '<button class="btn" data-nav="'+(n+1)+'">day '+(n+1)+' \u2192</button>';
  h += '</div></div>';
  app.innerHTML = h;
  app.querySelectorAll(".turn").forEach(el=>{ el.onclick=()=>applyState(el,(+el.dataset.state+1)%3); });
  app.querySelectorAll("[data-nav]").forEach(b=>{ b.onclick=ev=>{ev.stopPropagation(); renderDay(+b.dataset.nav); window.scrollTo(0,0);}; });
  wireChips(app);
  window.scrollTo(0,0);
}
function applyState(el,st){
  const k=el.querySelector(".kana-line"), d=el.querySelector(".detail"),
        pips=el.querySelectorAll(".pip"), hint=el.querySelector(".hinttext");
  k.hidden=st<1; d.hidden=st<2;
  pips[0].classList.toggle("on",st>=1); pips[1].classList.toggle("on",st>=2);
  hint.textContent = st===0?"tap to reveal the kana":st===1?"tap again for romaji and notes":"tap to hide and try again";
  el.dataset.state=String(st);
}
function wireChips(root){
  root.querySelectorAll(".cchip[data-concept]").forEach(btn=>{
    btn.onclick=ev=>{
      ev.stopPropagation();
      const key=btn.dataset.concept;
      const host=btn.closest(".detail")||btn.closest(".note")||btn.closest(".body")||btn.parentElement;
      const open=host.querySelector('[data-panel="'+key+'"]');
      if(open){ open.remove(); return; }
      host.insertAdjacentHTML("beforeend",conceptPanel(key));
    };
  });
}
// Open today's set straight away; fall back to the list outside the trip dates.
const t0 = todayN();
if (t0) renderDay(t0); else renderHub();
</script>
</body>
</html>
