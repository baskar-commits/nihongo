<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Practicing with Friends</title>
<style>
  :root{
    --bg:#f8f6f1; --card:#fff; --accent:#5b4b8a; --accent-dark:#463a6b;
    --text:#2c3e50; --muted:#7f8c8d; --border:#ddd; --flag:#c0392b;
    --p1:#0e7c66; --p2:#8e44ad; --p3:#b7791f; --p4:#2472a4;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;padding:16px}
  .container{max-width:820px;margin:0 auto}
  header{background:linear-gradient(135deg,var(--accent),#7b68a8);color:#fff;border-radius:14px;padding:18px 16px}
  header h1{margin:0 0 6px;font-size:1.35rem}
  header p{margin:0;opacity:.95;font-size:.95rem}
  .crumbs{margin:14px 0 0;font-size:.9rem;color:var(--muted)}
  .crumbs a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
  .crumbs a:hover{text-decoration:underline}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  h2{margin:0 0 10px;font-size:1.1rem}
  h3{margin:0 0 4px;font-size:1.02rem;color:var(--accent-dark)}
  .muted{color:var(--muted);font-size:.92rem}
  .conv{border:1px solid var(--border);border-radius:12px;padding:14px;margin:10px 0;background:#fff;cursor:pointer}
  .conv:hover{border-color:var(--accent)}
  .conv .pair{font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .conv .kana{color:var(--muted);font-size:.95rem}
  .newpill{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:99px;background:#e6f4ee;
           color:#0e7c66;font-size:.68rem;font-weight:800;letter-spacing:.06em;vertical-align:middle}
  details.how{border:1px solid var(--border);border-radius:12px;margin:12px 0;background:#fff}
  details.how>summary{cursor:pointer;padding:11px 14px;font-weight:700;color:var(--accent-dark);list-style:none}
  details.how>summary::-webkit-details-marker{display:none}
  details.how>summary::before{content:"\25B8 ";color:var(--accent)}
  details.how[open]>summary::before{content:"\25BE "}
  details.how .body{padding:0 14px 14px;font-size:.93rem}
  details.how ul{margin:6px 0 0;padding-left:20px}
  details.how li{margin:5px 0}
  .note{background:#f5f3f9;border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:.93rem}
  .note ul{margin:0;padding-left:19px}
  .note li{margin:5px 0}
  .turn{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff;cursor:pointer}
  .turn:hover{border-color:#bbb}
  .turnhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .who{font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
  .num{font-size:.72rem;color:#aab4bd;font-weight:700;letter-spacing:.04em;white-space:nowrap}
  .en{font-size:1.02rem}
  .hint{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:.8rem;color:var(--muted);font-style:italic}
  .pips{display:inline-flex;gap:4px}
  .pip{width:9px;height:9px;border-radius:50%;border:1.5px solid #bfc9d1;background:#fff;display:block}
  .pip.on{background:var(--accent);border-color:var(--accent)}
  .kana-line{font-size:1.5rem;margin-top:10px;line-height:1.65;word-break:break-word}
  .romaji-line{font-size:1rem;color:#4a6572;margin-top:6px;font-style:italic}
  .detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:.9rem}
  .src{color:var(--muted);font-size:.83rem;margin-top:6px}
  .extra{color:var(--flag);font-weight:600}
  .wordmark{border-bottom:2px dotted #9aa7b1}
  .lex{margin-top:8px;font-size:.87rem}
  .lex .row{margin:3px 0}
  .lex .lab{font-weight:700;color:var(--muted);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
  .anchor{color:#5b6b7a;margin:2px 0 0 14px;font-size:.85rem;line-height:1.45}
  .grammar{margin-top:6px;color:#34495e}
  .cchip{display:inline;background:#efecf7;color:var(--accent-dark);border:1px solid #cdc4e4;border-radius:6px;
         padding:1px 6px;margin:0 1px;font-weight:600;cursor:pointer;font-family:inherit;font-size:inherit;white-space:nowrap}
  .cchip:hover{background:#e3ddf2}
  .cchip::after{content:" ?";font-size:.72em;opacity:.65;font-weight:700}
  .cpanel{margin:8px 0 4px;padding:11px 13px;background:#f6f4fb;border:1px solid #dbd4ec;border-radius:10px}
  .cpanel h4{margin:0 0 5px;font-size:.95rem;color:var(--accent-dark)}
  .cpanel ul.cbul{margin:4px 0 0;padding-left:19px;font-size:.9rem}
  .cpanel ul.cbul li{margin:5px 0}
  .grammar ul.gbul{margin:2px 0 0;padding-left:19px}
  .grammar ul.gbul li{margin:4px 0}
  .cpanel .cex{margin-top:7px}
  .cpanel .cex .k{font-size:1.1rem;line-height:1.5}
  .cpanel .cex .r{font-style:italic;color:#4a6572;font-size:.86rem}
  .cpanel .cex .e{color:var(--muted);font-size:.86rem}
  .cpanel .csrc{margin-top:8px;font-size:.8rem;color:var(--muted)}
  .legend{margin-top:16px;font-size:.85rem;color:var(--muted)}
  .legend span{margin-right:14px;white-space:nowrap}
  .footer{margin-top:22px;color:var(--muted);font-size:.85rem;text-align:center}
  @media(max-width:520px){ .kana-line{font-size:1.35rem} body{padding:12px} }
</style>
</head>

<div class="container">
  <header><h1>Practicing with Friends</h1><p>Six conversations between four friends.</p></header>
  <div class="crumbs" id="crumbs"></div>
  <div id="app"></div>
  <div class="footer">Kana only, no kanji. Everything traces to the class handouts or the textbook.</div>
</div>
<script>
const DATA = {"title": "Practicing with Friends", "subtitle": "Six conversations between four friends.", "date": "2026-08-26", "people": {"basara": {"en": "Basara", "kana": "ばさらさん"}, "shinobu": {"en": "Shinobu", "kana": "しのぶさん"}, "kasumi": {"en": "Kasumi", "kana": "かすみさん"}, "shouyou": {"en": "Shouyou", "kana": "しょうようさん"}}, "howto": ["Four friends take turns in pairs, so across the six conversations everyone speaks with everyone else.", "The running order spreads people out, so nobody appears in two conversations back to back where that is possible.", "Read the English line, say it in Japanese out loud, then tap to check yourself.", "First tap shows the kana. Second tap shows the romaji, the meaning, the grammar and where it came from.", "Green buttons open a short explanation of a grammar pattern. Tap again to close.", "Words in red were not in either course. Words with a dotted underline were taught, but are worth a reminder.", "Swap in your own name, job and answers. These are starting points, not scripts to recite."], "conversations": [{"id": "A", "pair": ["basara", "shinobu"], "title": {"en": "How was your week?", "kana": "こんしゅうはどうでしたか"}, "note": ["Lesson 11 is the engine here: どうでしたか plus past-tense adjectives.", "This is the most useful exchange in the whole set, because it opens almost any catch-up."], "turns": [{"speaker": "basara", "en": "Shinobu, good evening.", "kana": "しのぶさん、こんばんは。", "romaji": "Shinobu-san, konbanwa.", "source": "Easy Conv L1", "words": [{"word": "こんばんは", "romaji": "konbanwa", "gloss": "good evening", "anchor": "from about sunset onward. こんにちは covers the middle of the day and おはようございます the morning."}]}, {"speaker": "shinobu", "en": "Good evening, Basara. It's been a while.", "kana": "こんばんは、ばさらさん。おひさしぶりです。", "romaji": "Konbanwa, Basara-san. Ohisashiburi desu.", "source": "Easy Conv L1", "words": [{"word": "おひさしぶりです", "romaji": "ohisashiburi desu", "gloss": "it's been a long time", "anchor": "the greeting for someone you already know, in place of はじめまして. The formal version is ごぶさたしております."}]}, {"speaker": "basara", "en": "How was the class?", "kana": "クラスはどうでしたか。", "romaji": "Kurasu wa dou deshita ka.", "source": "JBP L11", "grammar": "[[dou-deshita]]. The answer will almost always be a past-tense adjective, so listen for かったです or でした.", "words": [{"word": "クラス", "romaji": "kurasu", "gloss": "class", "anchor": "English written in katakana. Sound it out and the English word is there."}]}, {"speaker": "shinobu", "en": "It was a lot of fun, but it was a little difficult.", "kana": "とてもたのしかったですが、ちょっとむずかしかったです。", "romaji": "Totemo tanoshikatta desu ga, chotto muzukashikatta desu.", "source": "JBP L10 and L11", "grammar": ["Two い-adjectives in the past. See [[adj-past]].", "The halves are joined by [[ga-but]], which keeps it from sounding like two separate sentences."], "words": [{"word": "とても", "romaji": "totemo", "gloss": "very", "anchor": "goes straight before the adjective. ほんとうに, really, works the same way."}, {"word": "ちょっと", "romaji": "chotto", "gloss": "a little, slightly", "anchor": "it also works alone as a soft refusal: すみません、ちょっと… . Softening is its job in both cases."}]}, {"speaker": "basara", "en": "Is that so. What was difficult?", "kana": "そうですか。なにがむずかしかったですか。", "romaji": "Sou desu ka. Nani ga muzukashikatta desu ka.", "source": "JBP L11", "grammar": "そうですか is [[aizuchi]], buying you a moment while you think of the follow-up question. なに takes が, not を. See [[ga-subject]]."}, {"speaker": "shinobu", "en": "The test. The test was tough.", "kana": "テストです。テストはたいへんでした。", "romaji": "Tesuto desu. Tesuto wa taihen deshita.", "source": "JBP L11", "grammar": "たいへん is a な-adjective, so the past is でした, not かったです. See [[adj-past]] and [[adj-types]]."}, {"speaker": "basara", "en": "I know the feeling. It was tough for me too.", "kana": "わかります。わたしもたいへんでした。", "romaji": "Wakarimasu. Watashi mo taihen deshita.", "source": "Easy Conv L1", "grammar": "わかります here is not I understand the words, it is I can relate. It is listed as [[aizuchi]] in your Lesson 1 handout for exactly this use.", "words": [{"word": "も", "romaji": "mo", "gloss": "too, also", "anchor": "it replaces は or を rather than joining them. わたしは becomes わたしも when you mean me too."}]}, {"speaker": "shinobu", "en": "Basara, were you busy today?", "kana": "ばさらさんは、きょうはいそがしかったですか。", "romaji": "Basara-san wa, kyou wa isogashikatta desu ka.", "source": "JBP L11", "grammar": "いそがしい is an い-adjective, so the past question is かったですか. See [[adj-past]]. Two はs in one sentence: the first sets the person, the second contrasts today against other days."}, {"speaker": "basara", "en": "No, I was free today.", "kana": "いいえ、きょうはひまでした。", "romaji": "Iie, kyou wa hima deshita.", "source": "JBP L11", "grammar": "ひま is a な-adjective, so it takes でした. Right next to いそがしかったです you can feel the difference between the two types."}, {"speaker": "shinobu", "en": "That's good.", "kana": "よかったですね。", "romaji": "Yokatta desu ne.", "source": "Easy Conv L4", "grammar": ["The past of いい, used as a set phrase meaning I'm glad.", "**Irregular:** いい becomes よかった, never いかった. See [[adj-past]].", "See [[ne-yo]] for the ね."]}], "added": "2026-08-26"}, {"id": "B", "pair": ["kasumi", "shouyou"], "title": {"en": "Places you've been", "kana": "いったことがあるところ"}, "note": ["Lesson 11's past adjectives meet Lesson 1's ことがあります.", "はちじかんぐらい is lifted straight from the textbook vocabulary list, counter and all."], "turns": [{"speaker": "shouyou", "en": "Kasumi, have you ever been to Japan?", "kana": "かすみさん、にほんへいったことがありますか。", "romaji": "Kasumi-san, Nihon e itta koto ga arimasu ka.", "source": "Easy Conv L1", "grammar": ["**Which form?** ことがあります follows the verb, so the verb takes the [[ta-form]]. See [[which-form]].", "**Building it:** いきます gives the て-form いって; swap て for た and you have いった.", "**こと** means a thing in the abstract, a fact rather than an object. いったこと is the fact of having gone.", "**があります** says that fact exists. See [[koto-ga-arimasu]]."], "words": [{"word": "こと", "romaji": "koto", "gloss": "a thing in the abstract sense", "anchor": "the partner of もの. もの is a physical thing, as in たべもの, food. こと is a fact or an act, as in いったこと, the fact of having gone."}]}, {"speaker": "kasumi", "en": "Yes, I have. I went to Okinawa.", "kana": "はい、あります。おきなわへいきました。", "romaji": "Hai, arimasu. Okinawa e ikimashita.", "source": "Easy Conv L1 + JBP L10", "grammar": "いきます becomes いきました in the past. See [[past-polite]].", "words": [{"word": "おきなわ", "romaji": "Okinawa", "gloss": "the islands in southern Japan", "anchor": "in your textbook's place list with ろっぽんぎ, あさくさ and にっこう"}]}, {"speaker": "shouyou", "en": "How was it?", "kana": "どうでしたか。", "romaji": "Dou deshita ka.", "source": "JBP L11", "grammar": "[[dou-deshita]]. Three words, and it opens up any story."}, {"speaker": "kasumi", "en": "It was very beautiful. The ocean was beautiful.", "kana": "とてもきれいでした。うみがきれいでした。", "romaji": "Totemo kirei deshita. Umi ga kirei deshita.", "source": "JBP L10 and L11", "grammar": "きれい looks like an い-adjective but is a な-adjective, so the past is きれいでした, never きれいかったです. See [[adj-types]] and [[adj-past]]. It is the classic trap.", "words": [{"word": "うみ", "romaji": "umi", "gloss": "the ocean, the sea", "anchor": "うみがきれいでした uses [[ga-subject]]: が marks what the adjective describes."}]}, {"speaker": "shouyou", "en": "Nice. How long is it by plane?", "kana": "いいですね。ひこうきでどのくらいですか。", "romaji": "Ii desu ne. Hikouki de dono kurai desu ka.", "source": "JBP L11 + Easy Conv L4", "grammar": "This で is the transport で: see [[de-particle]]. [[dono-kurai]] asks the length of the trip.", "words": [{"word": "ひこうき", "romaji": "hikouki", "gloss": "airplane", "anchor": "the き here means machine, the same き as in きちょう, the captain."}]}, {"speaker": "kasumi", "en": "About eight hours.", "kana": "はちじかんぐらいです。", "romaji": "Hachi-jikan gurai desu.", "source": "JBP L11", "grammar": "〜じかん counts hours of duration, and 〜ぐらい softens it to about. This exact phrase is in your Lesson 11 vocabulary. See [[time-counters]]: はちじかん is eight hours, while はちじ would be eight o'clock."}, {"speaker": "shouyou", "en": "That must have been tough.", "kana": "たいへんでしたね。", "romaji": "Taihen deshita ne.", "source": "JBP L11", "grammar": "ね asks Shinobu to agree with you. See [[ne-yo]]."}, {"speaker": "kasumi", "en": "It was tough, but it was fun. I took photos.", "kana": "たいへんでしたが、たのしかったです。しゃしんをとりました。", "romaji": "Taihen deshita ga, tanoshikatta desu. Shashin o torimashita.", "source": "JBP L11", "grammar": "な-adjective past plus [[ga-but]] plus い-adjective past, all in one line. See [[adj-past]]. とります becomes とりました in the past, the same ました ending as いきました. See [[past-polite]].", "words": [{"word": "しゃしん", "romaji": "shashin", "gloss": "photograph", "anchor": "goes with とります, the verb for taking a photo, as in しゃしんをとってもいいですか"}]}, {"speaker": "shouyou", "en": "Show me sometime.", "kana": "こんどみせてください。", "romaji": "Kondo misete kudasai.", "source": "JBP L11", "grammar": "みせます becomes みせて. See [[te-kudasai]]."}, {"speaker": "kasumi", "en": "Yes, of course.", "kana": "ええ、ぜひ。", "romaji": "Ee, zehi.", "source": "Easy Conv L5", "words": [{"word": "ええ", "romaji": "ee", "gloss": "yes", "anchor": "a softer, warmer はい. Fine in polite conversation, just less crisp."}]}], "added": "2026-08-26"}, {"id": "C", "pair": ["basara", "shouyou"], "title": {"en": "How long have you been studying?", "kana": "にほんごのべんきょう"}, "note": ["The one conversation that is about the thing you are all actually doing.", "どのくらい and 〜ぐらい are the pair to watch: one asks how long, the other softens the answer."], "turns": [{"speaker": "shouyou", "en": "Basara, how long have you been studying Japanese?", "kana": "ばさらさん、にほんごをべんきょうしてどのくらいですか。", "romaji": "Basara-san, nihongo o benkyou shite dono kurai desu ka.", "source": "Easy Conv L1 + JBP L11", "grammar": ["**Which form?** another clause follows, so べんきょう takes the [[te-form]] to join the two halves. See [[which-form]].", "Literally: having studied Japanese, how long is it?", "This is the て-form joining clauses, not carrying a request.", "[[dono-kurai]] asks the length."], "words": [{"word": "にほんご", "romaji": "nihongo", "gloss": "the Japanese language", "anchor": "〜ご makes a language name: えいご English, ちゅうごくご Chinese. Different from にほんじん, a Japanese person."}]}, {"speaker": "basara", "en": "I've been studying about two years. How about you, Shouyou?", "kana": "にねんぐらいべんきょうしています。しょうようさんは？", "romaji": "Ni-nen gurai benkyou shite imasu. Shouyou-san wa?", "source": "Easy Conv L1", "grammar": "Studying is an ongoing state, so [[te-imasu]]. 〜ぐらい turns two years into about two years, which is usually the honest answer. にねん is the year counter. See [[time-counters]]."}, {"speaker": "shouyou", "en": "One year for me. It's still difficult.", "kana": "わたしはいちねんです。まだむずかしいです。", "romaji": "Watashi wa ichi-nen desu. Mada muzukashii desu.", "source": "JBP L11", "words": [{"word": "まだ", "romaji": "mada", "gloss": "still, yet", "anchor": "the same まだ as in まだいったことがありません, I haven't been yet. It leaves the door open."}]}, {"speaker": "basara", "en": "Is katakana difficult?", "kana": "カタカナはむずかしいですか。", "romaji": "Katakana wa muzukashii desu ka.", "source": "JBP L11", "words": [{"word": "カタカナ", "romaji": "katakana", "gloss": "the katakana script", "anchor": "used for foreign words, names and emphasis. ひらがな handles native Japanese."}]}, {"speaker": "shouyou", "en": "Yes, it's tough. But it's fun.", "kana": "はい、たいへんですが、たのしいです。", "romaji": "Hai, taihen desu ga, tanoshii desu.", "source": "JBP L11", "grammar": "[[ga-but]] again, this time in the present. Notice たいへんです with no な, because it is a predicate rather than sitting in front of a noun. See [[adj-types]]."}, {"speaker": "basara", "en": "I know the feeling. Do you study often?", "kana": "わかります。よくべんきょうしますか。", "romaji": "Wakarimasu. Yoku benkyou shimasu ka.", "source": "Easy Conv L1 and L2", "words": [{"word": "よく", "romaji": "yoku", "gloss": "often", "anchor": "sits on the frequency scale with いつも, たいてい, ときどき and あまり"}]}, {"speaker": "shouyou", "en": "Sometimes. I study a lot on weekends.", "kana": "ときどきです。しゅうまつによくべんきょうします。", "romaji": "Tokidoki desu. Shuumatsu ni yoku benkyou shimasu.", "source": "Easy Conv L2", "grammar": "に marks the time when something happens, the same に as ろくじにおきます.", "words": [{"word": "ときどき", "romaji": "tokidoki", "gloss": "sometimes", "anchor": "on the frequency scale below よく, often, and たいてい, usually."}]}, {"speaker": "basara", "en": "Shall we study together sometime?", "kana": "こんど、いっしょにべんきょうしませんか。", "romaji": "Kondo, issho ni benkyou shimasen ka.", "source": "Easy Conv L5", "grammar": "[[masen-ka]] invites without pressing. The negative shape is what makes it easy to decline. [[kondo]] softens the invitation: sometime, rather than a fixed date."}, {"speaker": "shouyou", "en": "Sounds good! Absolutely.", "kana": "いいですね！ぜひ。", "romaji": "Ii desu ne! Zehi.", "source": "Easy Conv L5", "words": [{"word": "ぜひ", "romaji": "zehi", "gloss": "by all means, definitely", "anchor": "your Lesson 5 expression of the day. はい、ぜひ is far warmer than はい on its own."}]}], "added": "2026-08-26"}, {"id": "D", "pair": ["shinobu", "kasumi"], "title": {"en": "Food and eating out", "kana": "たべものとがいしょく"}, "note": ["Easy Conversation Lesson 3 with Lesson 9 vocabulary from the textbook.", "It ends with かいけい and べつべつに, which is the single most practical thing in this set if you ever eat out in Japan as a group."], "turns": [{"speaker": "shinobu", "en": "Kasumi, what food do you like?", "kana": "かすみさん、すきなたべものはなんですか。", "romaji": "Kasumi-san, suki na tabemono wa nan desu ka.", "source": "Easy Conv L1", "grammar": ["すき is a な-adjective, so it needs な in front of a noun: すきなたべもの. See [[adj-types]].", "たべもの is itself a noun built out of a verb. See [[stem-nouns]]."], "words": [{"word": "たべもの", "romaji": "tabemono", "gloss": "food", "anchor": "たべます, to eat, loses ます to give the stem たべ, then もの, thing, is added. Literally an eating-thing."}]}, {"speaker": "kasumi", "en": "I like sushi. How about you, Shinobu?", "kana": "おすしがすきです。しのぶさんは？", "romaji": "Osushi ga suki desu. Shinobu-san wa?", "source": "Easy Conv L1 + JBP L8", "words": [{"word": "おすし", "romaji": "osushi", "gloss": "sushi", "anchor": "the [[polite-o]] on the front, the same one as おちゃ and おべんとう"}]}, {"speaker": "shinobu", "en": "I like ramen.", "kana": "わたしはラーメンがすきです。", "romaji": "Watashi wa raamen ga suki desu.", "source": "JBP L8", "grammar": "が marks what you like, not を. See [[ga-subject]].", "words": [{"word": "ラーメン", "romaji": "raamen", "gloss": "ramen", "anchor": "katakana, but borrowed from Chinese rather than English"}]}, {"speaker": "kasumi", "en": "What do you recommend in Seattle?", "kana": "シアトルのおすすめはなんですか。", "romaji": "Shiatoru no osusume wa nan desu ka.", "source": "JBP L9", "grammar": "シアトルのおすすめ is [[no-linker]]: a recommendation belonging to Seattle.", "words": [{"word": "おすすめ", "romaji": "osusume", "gloss": "recommendation", "anchor": "the most useful noun you own. It works in restaurants, shops and stations alike."}]}, {"speaker": "shinobu", "en": "There's a place near the university. It's very good.", "kana": "だいがくのちかくです。とてもおいしいですよ。", "romaji": "Daigaku no chikaku desu. Totemo oishii desu yo.", "source": "Easy Conv L4 + JBP L10", "grammar": "よ tells Kasumi something she did not know. See [[ne-yo]].", "words": [{"word": "ちかく", "romaji": "chikaku", "gloss": "nearby, the vicinity", "anchor": "attaches with の, like えきのまえ. See [[no-linker]]."}, {"word": "おいしい", "romaji": "oishii", "gloss": "delicious", "anchor": "its opposite is まずい, bad-tasting. Both are い-adjectives."}]}, {"speaker": "kasumi", "en": "Is it expensive?", "kana": "たかいですか。", "romaji": "Takai desu ka.", "source": "JBP L10", "words": [{"word": "たかい", "romaji": "takai", "gloss": "expensive, tall", "anchor": "one word for both meanings. Its opposite for price is やすい; for height it is ひくい."}]}, {"speaker": "shinobu", "en": "No, it's cheap.", "kana": "いいえ、やすいです。", "romaji": "Iie, yasui desu.", "source": "JBP L10", "words": [{"word": "やすい", "romaji": "yasui", "gloss": "inexpensive, cheap", "anchor": "the price opposite of たかい. For height, たかい pairs with ひくい instead."}]}, {"speaker": "kasumi", "en": "Nice. Shall we go together sometime?", "kana": "いいですね。こんどいっしょにいきませんか。", "romaji": "Ii desu ne. Kondo issho ni ikimasen ka.", "source": "Easy Conv L5", "grammar": "[[masen-ka]]. [[kondo]] means sometime soon here, with no date attached."}, {"speaker": "shinobu", "en": "Absolutely! Let's split the bill.", "kana": "ぜひ！かいけいはべつべつにしましょう。", "romaji": "Zehi! Kaikei wa betsubetsu ni shimashou.", "source": "JBP L9", "grammar": "ましょう is the firmer partner of ませんか: let's, rather than shall we. See [[masen-ka]].", "words": [{"word": "かいけい", "romaji": "kaikei", "gloss": "the bill, the check", "anchor": "you ask for it with かいけいをおねがいします, the same おねがいします as everywhere else"}, {"word": "べつべつに", "romaji": "betsubetsu ni", "gloss": "separately", "anchor": "the phrase for splitting a bill. Say it before anyone reaches for their wallet."}]}, {"speaker": "kasumi", "en": "Let's do that.", "kana": "そうしましょう。", "romaji": "Sou shimashou.", "source": "Easy Conv L5", "grammar": "そうしましょう accepts a suggestion someone else made: let's do that. See [[masen-ka]] for the ましょう family."}], "added": "2026-08-26"}, {"id": "E", "pair": ["basara", "kasumi"], "title": {"en": "Weekends and hobbies", "kana": "しゅうまつとしゅみ"}, "note": ["Easy Conversation Lesson 2, with the adverbs of frequency doing the work.", "Notice how たいてい and ときどき let you answer honestly instead of claiming you always do something."], "turns": [{"speaker": "kasumi", "en": "Basara, what do you do on weekends?", "kana": "ばさらさん、しゅうまつはなにをしますか。", "romaji": "Basara-san, shuumatsu wa nani o shimasu ka.", "source": "Easy Conv L2", "words": [{"word": "しゅうまつ", "romaji": "shuumatsu", "gloss": "the weekend", "anchor": "は marks it as the topic: as for the weekend, what do you do?"}]}, {"speaker": "basara", "en": "I usually go hiking. How about you, Kasumi?", "kana": "たいてい、ハイキングをします。かすみさんは？", "romaji": "Taitei, haikingu o shimasu. Kasumi-san wa?", "source": "Easy Conv L2 Expression of the Day", "grammar": "Ending with 〜さんは？ and nothing else bounces the same question back. It is the cheapest way to keep a conversation moving.", "words": [{"word": "たいてい", "romaji": "taitei", "gloss": "usually, most of the time", "anchor": "softer than いつも, always. It leaves room for the weekends you did nothing, which is why it sounds more natural."}]}, {"speaker": "kasumi", "en": "I watch movies. Sometimes I cook.", "kana": "わたしはえいがをみます。ときどきりょうりをします。", "romaji": "Watashi wa eiga o mimasu. Tokidoki ryouri o shimasu.", "source": "Easy Conv L2", "words": [{"word": "ときどき", "romaji": "tokidoki", "gloss": "sometimes", "anchor": "one step down from よく, often, on the same scale as たいてい and いつも"}]}, {"speaker": "basara", "en": "Wow, nice. What kind of movies do you watch?", "kana": "へえ～！いいですね。どんなえいがをみますか。", "romaji": "Hee~! Ii desu ne. Donna eiga o mimasu ka.", "source": "Easy Conv L2 + JBP L10", "words": [{"word": "どんな", "romaji": "donna", "gloss": "what kind of", "anchor": "always followed by a noun: どんなえいが, どんなところ. Different from どう, which asks how something is."}]}, {"speaker": "kasumi", "en": "I like Japanese movies.", "kana": "にほんのえいががすきです。", "romaji": "Nihon no eiga ga suki desu.", "source": "Easy Conv L1", "grammar": "にほんのえいが is [[no-linker]]: films belonging to Japan. What you like is marked with が, not を."}, {"speaker": "basara", "en": "Is that so. Are they interesting?", "kana": "そうなんですか。おもしろいですか。", "romaji": "Sou nan desu ka. Omoshiroi desu ka.", "source": "JBP L10", "words": [{"word": "おもしろい", "romaji": "omoshiroi", "gloss": "interesting, funny", "anchor": "its opposite is つまらない, boring. Both are い-adjectives: see [[adj-types]]."}]}, {"speaker": "kasumi", "en": "Yes, very interesting.", "kana": "はい、とてもおもしろいです。", "romaji": "Hai, totemo omoshiroi desu.", "source": "JBP L10", "words": [{"word": "とても", "romaji": "totemo", "gloss": "very", "anchor": "goes straight before the adjective, with no particle. ほんとうに, really, behaves the same way."}]}, {"speaker": "basara", "en": "Show me one sometime.", "kana": "こんどみせてください。", "romaji": "Kondo misete kudasai.", "source": "JBP L11 + Easy Conv L5", "grammar": ["**Which form?** ください follows, so みせます takes the [[te-form]]: みせて. See [[which-form]].", "みせて plus ください is a polite request. See [[te-kudasai]].", "[[kondo]], sometime, is what turns this from a command into a friendly suggestion."]}, {"speaker": "kasumi", "en": "Yes, absolutely!", "kana": "ええ、ぜひ！", "romaji": "Ee, zehi!", "source": "Easy Conv L5", "words": [{"word": "ええ", "romaji": "ee", "gloss": "yes", "anchor": "a softer, warmer はい, and it pairs naturally with ぜひ."}]}], "added": "2026-08-26"}, {"id": "F", "pair": ["shinobu", "shouyou"], "title": {"en": "Making a plan", "kana": "やくそく"}, "note": ["Easy Conversation Lesson 5 end to end, closing with the textbook's polite way of leaving.", "If the group runs long, そろそろしつれいします is how you get out gracefully."], "turns": [{"speaker": "shinobu", "en": "Shouyou, are you free this coming Saturday?", "kana": "しょうようさん、こんどのどようび、ひまですか。", "romaji": "Shouyou-san, kondo no doyoubi, hima desu ka.", "source": "Easy Conv L5 + JBP L11", "words": [{"word": "ひま", "romaji": "hima", "gloss": "free, not busy", "anchor": "the opposite of いそがしい. A な-adjective, so the past is ひまでした."}], "grammar": "[[kondo]] with a day attached means this coming Saturday, not next week's."}, {"speaker": "shouyou", "en": "Yes, I'm free. Why do you ask?", "kana": "はい、ひまです。どうしてですか。", "romaji": "Hai, hima desu. Doushite desu ka.", "source": "JBP question words", "words": [{"word": "どうして", "romaji": "doushite", "gloss": "why", "anchor": "なぜ and なんで mean the same thing. どうして is the everyday one."}]}, {"speaker": "shinobu", "en": "Would you like to have coffee together?", "kana": "いっしょにコーヒーをのみませんか。", "romaji": "Issho ni koohii o nomimasen ka.", "source": "Easy Conv L5", "grammar": "[[masen-ka]]. Straight out of the Lesson 5 invitation table."}, {"speaker": "shouyou", "en": "Sounds good! What time?", "kana": "いいですね！なんじですか。", "romaji": "Ii desu ne! Nanji desu ka.", "source": "Easy Conv L5", "grammar": "なんじ asks the point on the clock. See [[time-counters]] for why じ and じかん are not the same counter."}, {"speaker": "shinobu", "en": "How about twelve o'clock?", "kana": "じゅうにじはどうですか。", "romaji": "Juuni-ji wa dou desu ka.", "source": "Easy Conv L5", "grammar": "どうですか proposes rather than states, which leaves Shouyou room to counter with another time."}, {"speaker": "shouyou", "en": "Yes, understood. Where shall we meet?", "kana": "はい、わかりました。どこでまちあわせますか。", "romaji": "Hai, wakarimashita. Doko de machiawasemasu ka.", "source": "Easy Conv L5", "words": [{"word": "まちあわせます", "romaji": "machiawasemasu", "gloss": "to meet at an arranged place", "anchor": "starts with まち, from まちます, to wait. It means meeting somewhere agreed, not bumping into someone."}]}, {"speaker": "shinobu", "en": "How about in front of the station?", "kana": "えきのまえはどうですか。", "romaji": "Eki no mae wa dou desu ka.", "source": "Easy Conv L5", "grammar": "Position words attach with の. See [[no-linker]]."}, {"speaker": "shouyou", "en": "Good. I'm looking forward to it.", "kana": "いいですね。たのしみです。", "romaji": "Ii desu ne. Tanoshimi desu.", "source": "Easy Conv L5", "words": [{"word": "たのしみ", "romaji": "tanoshimi", "gloss": "something to look forward to", "anchor": "the noun built from たのしい, fun. たのしみです is what you say about something still ahead of you."}]}, {"speaker": "shinobu", "en": "Well then, I should be going.", "kana": "じゃあ、そろそろしつれいします。", "romaji": "Jaa, sorosoro shitsurei shimasu.", "source": "JBP L11", "words": [{"word": "そろそろ", "romaji": "sorosoro", "gloss": "about time to", "anchor": "your textbook gives it together with しつれいします as the set way to leave without seeming abrupt"}]}, {"speaker": "shouyou", "en": "Yes, until next time. Thank you very much.", "kana": "はい、またこんど。どうもありがとうございました。", "romaji": "Hai, mata kondo. Doumo arigatou gozaimashita.", "source": "JBP L11", "grammar": "Past tense, because the conversation is finished. See [[past-polite]].", "words": [{"word": "またこんど", "romaji": "mata kondo", "gloss": "see you next time", "anchor": "また, again, plus [[kondo]]. A standard warm sign-off when no date is set."}]}], "added": "2026-08-26"}]};
const CONCEPTS = {"te-form": {"chip": "て-form", "title": "The て-form, and when you need it", "body": ["**When:** only when something attaches after the verb. Never alone, never at the end of a sentence.", "**What attaches:** ください (request), もいいですか (permission), います (ongoing state), みます (try it).", "**It also joins clauses:** べんきょうして、どのくらいですか, having studied, how long is it?", "**How to build it,** from the ます form: く becomes いて (おきます, おいて). り, ち, い become って (とります, とって). み, び become んで (のみます, のんで). し becomes して. One sound left, add て (たべます, たべて).", "**Irregular:** いきます becomes いって.", "Swap that final て for た and you have the [[ta-form]]."], "examples": [{"kana": "とります → とって → とってもいいですか。", "romaji": "Totte mo ii desu ka.", "en": "attaching a pattern: may I take one?"}, {"kana": "みせます → みせて → みせてください。", "romaji": "Misete kudasai.", "en": "attaching a pattern: please show me"}, {"kana": "べんきょうして、どのくらいですか。", "romaji": "Benkyou shite, dono kurai desu ka.", "en": "joining two halves: having studied, how long is it?"}, {"kana": "いって → いった", "romaji": "itte, itta", "en": "swap て for た and you have the plain past"}], "source": "Lesson 4"}, "te-kudasai": {"chip": "～てください", "title": "Asking someone to do something", "body": ["**When:** you want to ask someone to do something politely.", "**How:** [[te-form]] plus ください.", "まちます → まって → まってください."], "examples": [{"kana": "まちます → まって → まってください。", "romaji": "Matte kudasai.", "en": "Please wait."}, {"kana": "まがります → まがって → まがってください。", "romaji": "Magatte kudasai.", "en": "Please turn."}], "source": "Lesson 4"}, "te-imasu": {"chip": "～ています", "title": "Ongoing states", "body": ["**When:** describing something ongoing or a continuing state, rather than a one-off action.", "**How:** [[te-form]] plus います.", "Japanese uses it for where you live, where you work and what you do for a living, where English just uses the present tense."], "examples": [{"kana": "すみます → すんで → すんでいます。", "romaji": "Sunde imasu.", "en": "I live (there)."}, {"kana": "します → して → しています。", "romaji": "Shite imasu.", "en": "I do (it) / I work as."}, {"kana": "つとめます → つとめて → つとめています。", "romaji": "Tsutomete imasu.", "en": "I work at."}], "source": "Lesson 1"}, "masen-ka": {"chip": "～ませんか", "title": "Inviting someone", "body": ["**When:** inviting someone, without pressing them.", "**Why the negative shape:** literally won't you do it? It leaves the other person free to decline.", "**Its firmer partner** is ～ましょう, let's, for when the decision is already made."], "examples": [{"kana": "いっしょにおちゃしませんか。", "romaji": "Issho ni ocha shimasen ka.", "en": "Shall we grab tea together?"}, {"kana": "わしょくをたべにいきませんか。", "romaji": "Washoku o tabe ni ikimasen ka.", "en": "Would you like to go eat Japanese food?"}], "source": "Lesson 5"}, "ne-yo": {"chip": "ね and よ", "title": "ね and よ at the end of a sentence", "body": ["**ね** invites the other person to agree with something you both know.", "**よ** tells them something they did not know.", "They can turn up in the same short exchange."], "examples": [{"kana": "すごいですね。", "romaji": "Sugoi desu ne.", "en": "That's impressive, isn't it."}, {"kana": "しんかんせんははやいですよ。", "romaji": "Shinkansen wa hayai desu yo.", "en": "The shinkansen is fast, you know."}], "source": "Lessons 1 and 2"}, "de-particle": {"chip": "で", "title": "Two jobs for で", "body": ["**Place:** where the action happens. にほんでなにをしますか.", "**Means:** what you use to do it. しんかんせんでいきます.", "Same particle, two jobs, and the verb tells you which.", "**Exception:** あるいて, on foot, takes no で."], "examples": [{"kana": "にほんでなにをしますか。", "romaji": "Nihon de nani o shimasu ka.", "en": "What will you do in Japan? (place)"}, {"kana": "しんかんせんでいきます。", "romaji": "Shinkansen de ikimasu.", "en": "I'll go by shinkansen. (means)"}], "source": "Lessons 2 and 4"}, "no-linker": {"chip": "の", "title": "の joining two nouns", "body": ["**Joins two nouns:** the second belongs to, or is described by, the first.", "はねだのてんき, the weather in Haneda.  とうきょうのぎんこう, a bank in Tokyo.", "**It also attaches position words:** えきのまえ, in front of the station."], "examples": [{"kana": "はねだのてんき", "romaji": "Haneda no tenki", "en": "the weather in Haneda"}, {"kana": "とうきょうのぎんこう", "romaji": "Toukyou no ginkou", "en": "a bank in Tokyo"}, {"kana": "えきのまえ", "romaji": "eki no mae", "en": "in front of the station"}], "source": "Lessons 1 and 2"}, "polite-o": {"chip": "polite お-", "title": "The polite お- prefix", "body": ["**When:** the thing belongs to the other person, or staff are speaking to a customer.", "おなまえ, your name.  おしごと, your work.", "**Some words carry it almost always:** おちゃ, おべんとう."], "examples": [{"kana": "おなまえはなんですか。", "romaji": "Onamae wa nan desu ka.", "en": "What is your name?"}, {"kana": "おしごとはなんですか。", "romaji": "Oshigoto wa nan desu ka.", "en": "What do you do for work?"}], "source": "Lesson 1"}, "past-polite": {"chip": "ました", "title": "Thanking in the past", "body": ["**ありがとうございます** thanks for something still going on.", "**ありがとうございました** thanks for something now finished, so it is what you say as you leave.", "The same ました ending turns any ます verb into the past: いきます becomes いきました."], "examples": [{"kana": "ありがとうございます。", "romaji": "Arigatou gozaimasu.", "en": "Thank you. (ongoing)"}, {"kana": "ありがとうございました。", "romaji": "Arigatou gozaimashita.", "en": "Thank you. (finished)"}], "source": "Lesson 1 and the textbook"}, "aizuchi": {"chip": "あいづち", "title": "Showing you are listening", "body": ["**What:** short reactions dropped in to show you are following.", "**Why it matters:** Japanese expects them far more often than English does. Silence reads as disengagement, not politeness.", "そうですか, oh really.  そうなんですか, is that so, warmer.  へえ～！すごいですね, wow."], "examples": [{"kana": "そうですか。", "romaji": "Sou desu ka.", "en": "Oh, really?"}, {"kana": "そうなんですか。", "romaji": "Sou nan desu ka.", "en": "Is that so? (warmer, more surprised)"}, {"kana": "へえ～！すごいですね。", "romaji": "Hee~! Sugoi desu ne.", "en": "Wow, that's amazing!"}], "source": "every Easy Conversation lesson"}, "adj-types": {"chip": "い / な adjectives", "title": "Two kinds of adjective", "body": ["**い-adjectives** end in い and attach straight to a noun: おおきいこうえん.", "**な-adjectives** need な in between: きれいなはな.", "The split matters because the two form the past differently. See [[adj-past]]."], "examples": [{"kana": "たかいです。", "romaji": "Takai desu.", "en": "It's expensive. (い-adjective)"}, {"kana": "ひまです。", "romaji": "Hima desu.", "en": "I'm free. (な-adjective)"}], "source": "Lesson 10"}, "adj-past": {"chip": "was / were", "title": "Adjectives in the past", "body": ["**い-adjectives:** drop い, add かったです. たのしい → たのしかったです.", "**な-adjectives and nouns:** swap です for でした. ひまです → ひまでした.", "**Irregular:** いい becomes よかった, never いかった.", "Get the type right and the past follows. See [[adj-types]]."], "examples": [{"kana": "たのしい → たのしかったです。", "romaji": "Tanoshikatta desu.", "en": "It was fun."}, {"kana": "むずかしい → むずかしかったです。", "romaji": "Muzukashikatta desu.", "en": "It was difficult."}, {"kana": "ひまです → ひまでした。", "romaji": "Hima deshita.", "en": "I was free."}, {"kana": "たいへんです → たいへんでした。", "romaji": "Taihen deshita.", "en": "It was tough."}, {"kana": "いい → よかったです。", "romaji": "Yokatta desu.", "en": "It was good. (irregular)"}], "source": "Lesson 11"}, "ga-but": {"chip": "が (but)", "title": "が joining two halves", "body": ["**When:** you want to say two things that pull against each other, in one sentence.", "**How:** put が at the end of the first clause.", "たのしかったですが、むずかしかったです。 It was fun, but it was difficult.", "**Not the same が** as the one marking a subject. See [[ga-subject]]."], "examples": [{"kana": "たのしかったですが、むずかしかったです。", "romaji": "Tanoshikatta desu ga, muzukashikatta desu.", "en": "It was fun, but it was difficult."}, {"kana": "たいへんですが、たのしいです。", "romaji": "Taihen desu ga, tanoshii desu.", "en": "It's tough, but it's fun."}], "source": "Lesson 11"}, "dou-deshita": {"chip": "どうでしたか", "title": "Asking how something was", "body": ["**どうですか** asks how something is.  **どうでしたか** asks how it was.", "It opens almost any catch-up conversation.", "**The answer** is nearly always a past-tense adjective, so listen for かったです or でした. See [[adj-past]]."], "examples": [{"kana": "クラスはどうでしたか。", "romaji": "Kurasu wa dou deshita ka.", "en": "How was the class?"}, {"kana": "とてもたのしかったです。", "romaji": "Totemo tanoshikatta desu.", "en": "It was a lot of fun."}], "source": "Lesson 11"}, "dono-kurai": {"chip": "どのくらい", "title": "How long, how much", "body": ["**When:** asking about a length of time or an amount.", "**The answer** usually pairs a counter with ～ぐらい, about: はちじかんぐらい, about eight hours.", "See [[time-counters]] for which counter to use."], "examples": [{"kana": "どのくらいべんきょうしていますか。", "romaji": "Dono kurai benkyou shite imasu ka.", "en": "How long have you been studying?"}, {"kana": "にねんぐらいです。", "romaji": "Ni-nen gurai desu.", "en": "About two years."}], "source": "Lesson 11"}, "kondo": {"chip": "こんど", "title": "こんど: this coming, or next time", "body": ["**With a day attached:** this coming. こんどのどようび, this Saturday.", "**On its own:** sometime soon, next time. こんどいっしょにいきませんか.", "**With また in front:** a sign-off. またこんど, see you next time.", "The vagueness is the point. It lets you suggest something without committing to a date."], "examples": [{"kana": "こんどのどようび", "romaji": "kondo no doyoubi", "en": "this coming Saturday"}, {"kana": "こんどいっしょにいきませんか。", "romaji": "Kondo issho ni ikimasen ka.", "en": "Shall we go together sometime?"}, {"kana": "またこんど。", "romaji": "Mata kondo.", "en": "See you next time."}], "source": "Easy Conv L5 and JBP L11"}, "stem-nouns": {"chip": "ます-stem", "title": "Turning a verb into a noun", "body": ["**The stem:** drop ます. たべます gives たべ, のみます gives のみ, かいます gives かい.", "**Add もの, thing,** and you have a noun. たべもの is literally an eating-thing.", "たべもの food.  のみもの a drink.  かいもの shopping.", "**もの versus こと:** もの is a physical thing you could hold, こと is an abstract one, a fact or an act.", "The same stem is what ～たいです attaches to, so finding it pays off twice. See [[tai-desu]]."], "examples": [{"kana": "たべます → たべ + もの → たべもの", "romaji": "tabemono", "en": "food"}, {"kana": "のみます → のみ + もの → のみもの", "romaji": "nomimono", "en": "a drink"}, {"kana": "かいます → かい + もの → かいもの", "romaji": "kaimono", "en": "shopping"}], "source": "JBP Lessons 8 and 10"}, "koto-ga-arimasu": {"chip": "～たことがあります", "title": "～たことがあります: have you ever?", "body": ["**When:** asking or saying whether someone has ever done something.", "**Three pieces:** the plain past ([[ta-form]]), then こと, then があります.", "いきます → いった (went) + こと (the fact of) + があります (exists).", "So literally: there exists a fact of having gone. English says I have been.", "**Negative:** swap あります for ありません, and add まだ for not yet."], "examples": [{"kana": "いく → いった + こと + が + あります", "romaji": "itta koto ga arimasu", "en": "there exists an experience of going"}, {"kana": "にほんへいったことがありますか。", "romaji": "Nihon e itta koto ga arimasu ka.", "en": "Have you ever been to Japan?"}, {"kana": "いいえ、まだいったことがありません。", "romaji": "Iie, mada itta koto ga arimasen.", "en": "No, I haven't been yet."}], "source": "Easy Conv L1"}, "time-counters": {"chip": "じ / じかん", "title": "O'clock versus hours", "body": ["**～じ** is a point on the clock. はちじ, eight o'clock.", "**～じかん** is a length of time. はちじかん, eight hours.", "**～ねん** counts years the same way. にねん, two years.", "Add ～ぐらい to any of them for about."], "examples": [{"kana": "はちじ", "romaji": "hachi-ji", "en": "eight o'clock"}, {"kana": "はちじかん", "romaji": "hachi-jikan", "en": "eight hours"}, {"kana": "にねんぐらい", "romaji": "ni-nen gurai", "en": "about two years"}], "source": "JBP Lesson 11"}, "ga-subject": {"chip": "が (subject)", "title": "The other が", "body": ["**When:** marking what an adjective describes, or what you like, or what exists.", "**Question words always take it:** なにがむずかしいですか.", "おすしがすきです, sushi is what I like.  うみがきれいでした, the ocean was beautiful.", "**Not the same が** as the one meaning but. See [[ga-but]]."], "examples": [{"kana": "なにがむずかしかったですか。", "romaji": "Nani ga muzukashikatta desu ka.", "en": "What was difficult?"}, {"kana": "おすしがすきです。", "romaji": "Osushi ga suki desu.", "en": "I like sushi."}, {"kana": "うみがきれいでした。", "romaji": "Umi ga kirei deshita.", "en": "The ocean was beautiful."}], "source": "JBP Lessons 10 and 11"}, "ta-form": {"chip": "た-form", "title": "The plain past, built from the て-form", "body": ["**When:** in this course, only inside ～たことがあります. It is not a form you end sentences with.", "**Why not:** た is the plain past. Polite sentences end in ～ました instead: いきました.", "**How to build it:** take the [[te-form]] and swap て for た, で for だ. That is the whole rule.", "いきます → いって → いった.  たべます → たべて → たべた.  のみます → のんで → のんだ."], "examples": [{"kana": "いきます → いって → いった", "romaji": "ikimasu, itte, itta", "en": "went"}, {"kana": "たべます → たべて → たべた", "romaji": "tabemasu, tabete, tabeta", "en": "ate"}, {"kana": "のみます → のんで → のんだ", "romaji": "nomimasu, nonde, nonda", "en": "drank"}], "source": "Lesson 4, built on the て-form"}, "which-form": {"chip": "choosing a form", "title": "Which verb form do I need?", "body": ["**Look at what comes after the verb.** That decides the form, not the meaning you are going for.", "**Nothing comes after it** and the verb ends the sentence: use ます or ました. いきます, いきました. Never て, never た.", "**ください, もいいですか, います or みます comes after:** use the [[te-form]]. いってください, いってもいいですか.", "**Another clause comes after:** use the [[te-form]] to join them. べんきょうして、どのくらいですか.", "**ことがあります comes after:** use the [[ta-form]]. いったことがあります.", "So て and た are never something you choose. They are demanded by whatever follows."], "examples": [{"kana": "いきました。", "romaji": "Ikimashita.", "en": "ends the sentence, so ました"}, {"kana": "いってください。", "romaji": "Itte kudasai.", "en": "ください follows, so the て-form"}, {"kana": "いったことがあります。", "romaji": "Itta koto ga arimasu.", "en": "ことがあります follows, so the た-form"}], "source": "Lessons 4 and 11"}};
const PCOLOR = {};
Object.keys(DATA.people).forEach((k,i) => { PCOLOR[k] = "var(--p" + (i+1) + ")"; });

const BATCHES = [...new Set(DATA.conversations.map(c => c.added || ""))].filter(Boolean).sort();
// Only meaningful once a second batch exists: with one batch everything is "new".
const NEWEST = BATCHES.length > 1 ? BATCHES[BATCHES.length - 1] : "";
const app = document.getElementById("app");
const crumbs = document.getElementById("crumbs");
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function chips(t){
  return esc(t).replace(/\[\[([a-z0-9-]+)\]\]/g,(m,k)=>{
    const c = CONCEPTS[k];
    return c ? '<button type="button" class="cchip" data-concept="'+esc(k)+'">'+esc(c.chip)+'</button>' : m;
  });
}
function md(t){ return chips(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function bodyHtml(b){
  if(!b) return '';
  if(Array.isArray(b)) return '<ul class="cbul">'+b.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul>';
  return '<div>'+md(b)+'</div>';
}
function conceptPanel(k){
  const c = CONCEPTS[k]; if(!c) return '';
  let h = '<div class="cpanel" data-panel="'+esc(k)+'"><h4>'+esc(c.title)+'</h4>'+bodyHtml(c.body);
  (c.examples||[]).forEach(x=>{ h += '<div class="cex"><div class="k">'+esc(x.kana)+'</div><div class="r">'+esc(x.romaji)+'</div><div class="e">'+esc(x.en)+'</div></div>'; });
  if(c.source) h += '<div class="csrc">From '+esc(c.source)+'</div>';
  return h+'</div>';
}
function noteHtml(n){
  if(!n) return '';
  if(Array.isArray(n)) return '<div class="note"><ul>'+n.map(x=>'<li>'+chips(x)+'</li>').join('')+'</ul></div>';
  return '<div class="note">'+chips(n)+'</div>';
}
function setCrumbs(parts){
  crumbs.innerHTML = parts.map((p,i)=> p.go ? '<a data-go="'+i+'">'+esc(p.label)+'</a>' : esc(p.label)).join(" &nbsp;\u203A&nbsp; ");
  crumbs.querySelectorAll("a[data-go]").forEach(a=>{ a.onclick=()=>parts[+a.dataset.go].go(); });
}
function markKana(t){
  let out = esc(t.kana);
  (t.extras||[]).forEach(e=>{ const w=esc(e.word); if(w&&out.includes(w)) out=out.split(w).join('<span class="extra">'+w+'</span>'); });
  (t.words||[]).forEach(e=>{ const w=esc(e.word); if(w&&out.includes(w)) out=out.split(w).join('<span class="wordmark">'+w+'</span>'); });
  return out;
}
function lexBlock(list,label,cls){
  if(!list||!list.length) return '';
  let h = '<div class="lex"><div class="lab">'+esc(label)+'</div>';
  list.forEach(e=>{
    h += '<div class="row"><span class="'+cls+'">'+esc(e.word)+'</span>';
    if(e.romaji) h += ' <i>('+esc(e.romaji)+')</i>';
    h += ': '+esc(e.gloss);
    if(e.anchor) h += '<div class="anchor">'+chips(e.anchor)+'</div>';
    h += '</div>';
  });
  return h+'</div>';
}
function renderHub(){
  setCrumbs([{label:"All conversations"}]);
  let h = '<div class="card"><h2>Six conversations, one for every pair</h2>';
  h += '<details class="how"><summary>How to use this</summary><div class="body"><ul>'
     + DATA.howto.map(x=>'<li>'+chips(x)+'</li>').join('') + '</ul></div></details></div>';
  h += '<div class="card"><h2>Conversations</h2>';
  DATA.conversations.forEach((c,i)=>{
    const names = c.pair.map(p=>DATA.people[p].en).join(" and ");
    const isNew = c.added && c.added === NEWEST;
    h += '<div class="conv" data-conv="'+i+'"><div class="pair">'+esc(c.id)+' &nbsp;\u00B7&nbsp; '+esc(names)
       + (isNew ? '<span class="newpill">new</span>' : '') + '</div>';
    h += '<h3>'+esc(c.title.en)+'</h3><div class="kana">'+esc(c.title.kana)+' \u00B7 '+c.turns.length+' lines'
       + (c.added ? ' \u00B7 added '+esc(c.added) : '') + '</div></div>';
  });
  h += '</div><div class="legend">'
     + Object.keys(DATA.people).map(k=>'<span><b style="color:'+PCOLOR[k]+'">\u258C</b> '+esc(DATA.people[k].en)+'</span>').join('')
     + '</div>';
  app.innerHTML = h;
  app.querySelectorAll("[data-conv]").forEach(el=>{ el.onclick=()=>renderConv(+el.dataset.conv); });
  wireChips(app);
}
function renderConv(i){
  const c = DATA.conversations[i];
  setCrumbs([{label:"All conversations",go:renderHub},{label:c.pair.map(p=>DATA.people[p].en).join(" and ")}]);
  let h = '<div class="card"><h2>'+esc(c.title.en)+' <span class="muted">'+esc(c.title.kana)+'</span></h2>';
  h += noteHtml(c.note) + '</div><div class="card">';
  c.turns.forEach((t,n)=>{
    const p = DATA.people[t.speaker];
    h += '<div class="turn" data-state="0" style="border-left:4px solid '+PCOLOR[t.speaker]+'">';
    h += '<div class="turnhead"><div class="who" style="color:'+PCOLOR[t.speaker]+'">'+esc(p.en)+'</div>'
       + '<div class="num">'+esc(c.id)+'-'+String(n+1).padStart(2,"0")+'</div></div>';
    h += '<div class="en">'+esc(t.en)+'</div>';
    h += '<div class="hint"><span class="pips"><span class="pip"></span><span class="pip"></span></span><span class="hinttext">tap to reveal the kana</span></div>';
    h += '<div class="kana-line" hidden>'+markKana(t)+'</div>';
    h += '<div class="detail" hidden><div class="romaji-line">'+esc(t.romaji)+'</div>';
    if(t.grammar) h += '<div class="grammar">'+(Array.isArray(t.grammar)
        ? '<ul class="gbul">'+t.grammar.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul>'
        : md(t.grammar))+'</div>';
    h += lexBlock(t.words,"Words in this line","wordmark") + lexBlock(t.extras,"Not from class","extra");
    h += '<div class="src">Source: '+esc(t.source||"\u2014")+'</div></div></div>';
  });
  h += '</div><div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap">';
  if(i>0) h += '<button class="cchip" style="padding:9px 14px" data-nav="'+(i-1)+'">\u2190 previous</button>';
  if(i<DATA.conversations.length-1) h += '<button class="cchip" style="padding:9px 14px" data-nav="'+(i+1)+'">next \u2192</button>';
  h += '</div></div>';
  app.innerHTML = h;
  app.querySelectorAll(".turn").forEach(el=>{ el.onclick=()=>applyState(el,(+el.dataset.state+1)%3); });
  app.querySelectorAll("[data-nav]").forEach(b=>{ b.onclick=ev=>{ ev.stopPropagation(); renderConv(+b.dataset.nav); window.scrollTo(0,0); }; });
  wireChips(app);
  window.scrollTo(0,0);
}
function applyState(el,st){
  const k=el.querySelector(".kana-line"), d=el.querySelector(".detail"),
        pips=el.querySelectorAll(".pip"), hint=el.querySelector(".hinttext");
  k.hidden=st<1; d.hidden=st<2;
  pips[0].classList.toggle("on",st>=1); pips[1].classList.toggle("on",st>=2);
  hint.textContent = st===0?"tap to reveal the kana":st===1?"tap again for romaji and notes":"tap to hide and try again";
  el.dataset.state=String(st);
}
function wireChips(root){
  root.querySelectorAll(".cchip[data-concept]").forEach(btn=>{
    btn.onclick=ev=>{
      ev.stopPropagation();
      const key=btn.dataset.concept;
      const host=btn.closest(".detail")||btn.closest(".note")||btn.closest(".body")||btn.parentElement;
      const open=host.querySelector('[data-panel="'+key+'"]');
      if(open){ open.remove(); return; }
      host.insertAdjacentHTML("beforeend",conceptPanel(key));
    };
  });
}
renderHub();
</script>
</body>
</html>
