body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:16px 16px 120px;}

.sec-score-card{background:#f8f6f1;border-radius:10px;padding:12px 20px;min-width:130px;}

.type-score-row .t-label{color:var(--text);}
.type-score-row .t-val{font-weight:700;color:var(--text);}
.action-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}

  body{padding:0;}

<script>
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const questions=[
{id:1,type:"mc",section:"L17",
 text:"Which sentence is correct? (Choose the right demonstrative.)",
 options:{a:"あれ レストランは おいしいです。",b:"あの レストランは おいしいです。",c:"あれな レストランは おいしいです。",d:"あのれ レストランは おいしいです。"},
 answer:"b",
 hint:"One of these words stands alone as a pronoun; the other must come before a noun.",
 explanation:"あの must precede a noun directly: あの レストラン (that restaurant over there). あれ is a standalone pronoun and cannot modify a noun.",
 example:"あの くるまは ふるいです。(Ano kuruma wa furui desu.) That car over there is old."},

{id:2,type:"particle",section:"L17",
 text:"Complete the sentence:",
 pre:"たなかさん",sel1:["は","の","で","に"],answer1:"は",post:"せんせい です。",
 hint:"This particle marks the topic of the sentence.",
 translation:"Mr. Tanaka is a teacher.",
 explanation:"は (wa) is the topic marker. の shows possession, で marks place of action, に marks direction or receiver.",
 example:"スミスさんは がくせい です。(Sumisu-san wa gakusei desu.) Mr. Smith is a student."},

{id:3,type:"sequence",section:"L17",
 text:"Build the Japanese sentence starting with クラスは: 'The class is from 9 a.m. to 11 a.m.'",
 chips:shuffle(["クラスは","ごぜん","くじ","から","じゅういちじ","まで","です","ごご","に"]),
 answer:["クラスは","ごぜん","くじ","から","じゅういちじ","まで","です"],
 hint:"Use the kara...made pattern for start and end times. ごぜん means a.m.",
 explanation:"[noun] は [time1] から [time2] まで です shows a time range. ごぜん = a.m.; くじ = 9 o'clock; じゅういちじ = 11 o'clock.",
 example:"デパートは じゅうじ から はちじ まで です。(Depato wa juji kara hachiji made desu.) The department store is open from 10 to 8."},

{id:4,type:"mc",section:"L17",
 text:"Choose the correct sentence: 'I go to the library by train.'",
 options:{a:"わたしは としょかん に でんしゃ に いきます。",b:"わたしは でんしゃ で としょかん に いきます。",c:"わたしは でんしゃ に としょかん で いきます。",d:"わたしは としょかん で でんしゃ に いきます。"},
 answer:"b",
 hint:"One particle marks the destination of movement; a different particle marks the means of transportation.",
 explanation:"に (or へ) marks the destination with movement verbs. で marks the means of transportation. Correct word order: [transport] で + [place] に + いきます.",
 example:"バス で がっこう に いきます。(Basu de gakko ni ikimasu.) I go to school by bus."},

{id:5,type:"mc",section:"L17",
 text:"A classmate says: 'あした テストが あります よ!' You are surprised. Which is the best casual response?",
 options:{a:"なるほど！",b:"まじですか！",c:"さすが！",d:"めんどくさい！"},
 answer:"b",
 hint:"One of these is used to show surprise or disbelief at unexpected news.",
 explanation:"まじですか！(maji desu ka!) = Really!? / Are you serious!? Used for surprise. なるほど = I see. さすが = Impressive. めんどくさい = What a hassle.",
 example:"A: あした、テストが あります よ。B: えっ、まじですか！？"},

{id:6,type:"sequence-en",section:"L17",
 text:"Translate this sentence by arranging the English chips:",
 jp:"スミスさんは きのう ともだちと えいがに いきました。",
 chips:shuffle(["Smith-san","went","yesterday","to a movie","with a friend","by train","at the library","watched"]),
 answer:["Smith-san","went","to a movie","with a friend","yesterday"],
 hint:"The sentence uses と for 'with someone' and に for the destination. The verb is past tense.",
 explanation:"と means 'with (someone)'. に marks the destination. いきました is past affirmative of いきます. 'by train' and 'at the library' are not in this sentence.",
 example:"わたしは せんせいと がっこうに いきます。(Watashi wa sensei to gakko ni ikimasu.) I go to school with my teacher."},

{id:7,type:"particle2",section:"L17",
 text:"Fill in both particles:",
 pre:"わたしは どようび",sel1:["に","で","は","を"],answer1:"に",mid:"こうえん",sel2:["で","に","は","を"],answer2:"で",post:"さんぽを します。",
 hint:"One particle marks the specific time; another marks the place where the action happens.",
 translation:"I take a walk in the park on Saturdays.",
 explanation:"に marks a specific time (どようびに = on Saturdays). で marks the place of action (こうえんで = in the park).",
 example:"きんようびに としょかんで ほんを よみます。(Kinyobi ni toshokan de hon o yomimasu.) I read books at the library on Fridays."},

{id:8,type:"mc",section:"L17",
 text:"How do you read the date 'March 3rd' in Japanese?",
 options:{a:"さんがつ みっか",b:"さんがつ さんにち",c:"みっか さんがつ",d:"さんがつ みっつ"},
 answer:"a",
 hint:"Months use gatsu after the number. Dates 1-10 have special readings - the 3rd is irregular.",
 explanation:"Months: [number]+がつ (さんがつ = March). The 3rd = みっか (special reading, NOT さんにち). みっつ is the general counter for 3 things.",
 example:"しがつ ついたち は わたしの たんじょうびです。(Shigatsu tsuitachi wa watashi no tanjobi desu.) April 1st is my birthday."},

{id:9,type:"error-mc",section:"L17",
 text:"One of these sentences has an error. Which option correctly fixes the mistake?",
 jp:"(Original) あのひとわ だれですか。",
 options:{a:"あのひとは だれですか。",b:"あのひとを だれですか。",c:"あのひとに だれですか。",d:"あのひとの だれですか。"},
 answer:"a",
 hint:"The error is with the topic marker particle. It is written one way but pronounced differently.",
 explanation:"The topic marker は is WRITTEN as は (ha) but PRONOUNCED 'wa'. Writing わ is a hiragana spelling error. Always write は, never わ.",
 example:"このほんは おもしろいです。(Kono hon wa omoshiroi desu.) This book is interesting."},

{id:10,type:"sequence",section:"L17",
 text:"Build the sentence starting with あれは: 'That over there is a Japanese car.'",
 chips:shuffle(["あれは","にほん","の","くるま","です","これは","でんしゃ","それは"]),
 answer:["あれは","にほん","の","くるま","です"],
 hint:"Use the demonstrative pronoun for something far from both speaker and listener, plus の to show origin.",
 explanation:"あれ is the pronoun for something far from both people. にほん の くるま = Japanese car (place + の + noun = origin). これ = near speaker; それ = near listener.",
 example:"あれは フランスの ワインです。(Are wa Furansu no wain desu.) That over there is French wine."},

{id:11,type:"multiselect",section:"L17",
 text:"Which of the following sentences correctly use the particle を? (Select all correct ones.)",
 options:{a:"わたしは コーヒーを のみます。",b:"がっこうを いきます。",c:"えいがを みます。",d:"ともだちを あいます。",e:"ほんを よみます。"},
 answer:["a","c","e"],
 hint:"を marks the direct object of an action verb. Some verbs use に for their target instead.",
 explanation:"を marks the direct object: のみます (drink), みます (watch), よみます (read) all take を. いきます takes に/へ for destination. あいます takes に for the person met.",
 example:"わたしは まいにち ニュースを よみます。(Watashi wa mainichi nyusu o yomimasu.) I read the news every day."},

{id:12,type:"matching",section:"L17",
 text:"Match each Japanese word to its English meaning.",
 pairs:[
   {jp:"すみません",en:"Excuse me / I'm sorry"},
   {jp:"はじめまして",en:"Nice to meet you"},
   {jp:"めいし",en:"business card"},
   {jp:"かさ",en:"umbrella"},
   {jp:"さいふ",en:"wallet"},
 ],
 options:["umbrella","Nice to meet you","wallet","key","Excuse me / I'm sorry","smartphone","business card","glasses"],
 hint:"These are Lesson 1 and Lesson 2 vocabulary words. Think about introductions and everyday objects.",
 explanation:"すみません = excuse me/sorry. はじめまして = nice to meet you (first meeting). めいし = business card. かさ = umbrella. さいふ = wallet.",
 example:"すみません、トイレは どこですか。(Sumimasen, toire wa doko desu ka.) Excuse me, where is the restroom?"},

{id:13,type:"mc",section:"L17",
 text:"You want to order three bottles of water. Which is correct?",
 options:{a:"みずを さんまい ください。",b:"みずを さんぼん ください。",c:"みずを さんこ ください。",d:"みずを さんつ ください。"},
 answer:"b",
 hint:"This counter is used for long, thin cylindrical objects like bottles, pens, and umbrellas.",
 explanation:"ほん/ぼん/ぽん is the counter for cylindrical objects: いっぽん、にほん、さんぼん. まい = flat objects. こ = small round objects. つ = general counting up to 10.",
 example:"コーラを にほん ください。(Kora o nihon kudasai.) Two colas please."},

{id:14,type:"particle",section:"L17",
 text:"Complete the sentence:",
 pre:"マリアさんは ブラジル",sel1:["から","まで","で","に"],answer1:"から",post:"きました。",
 hint:"This particle follows a place to show where someone originated or departed from.",
 translation:"Maria came from Brazil.",
 explanation:"から after a place means 'from' - showing origin or departure point. まで = until. で = at/by. に = to/at (destination).",
 example:"どこから きましたか。(Doko kara kimashita ka.) Where did you come from?"},

{id:15,type:"conversation",section:"L89",
 text:"Restaurant scenario: You are dining alone (party of 1) at a tempura restaurant. When asked about drinks, you order green tea (おちゃ). You also order exactly one serving of tempura. After eating, you ask for the check.",
 turns:[
   {speaker:"staff",line:"いらっしゃいませ！なんめいさまですか。"},
   {speaker:"you",answer:["ひとり","です"],distractors:["ふたり","さんにん","おねがいします","ください"]},
   {speaker:"staff",line:"どうぞ、こちらへ。おのみものは いかがですか。"},
   {speaker:"you",answer:["おちゃ","を","おねがいします"],distractors:["ください","に","は","で"]},
   {speaker:"staff",line:"はい、かしこまりました。ごちゅうもんは？"},
   {speaker:"you",answer:["てんぷら","を","ひとつ","ください"],distractors:["ふたつ","さんぼん","おねがいします","みず"]}
 ],
 explanation:"なんめいさまですか = 'How many people?' (polite). ひとりです = 'Just one.' おちゃをおねがいします = 'Green tea please.' (おちゃ is specified in the scenario.) てんぷらをひとつください = 'One tempura please.'",
 example:"おかいけいを おねがいします。(Okaikei o onegaishimasu.) Check please."},

const answered={};
let submitted=false;

function buildNav(){
  const nd=document.getElementById('navDots');
  nd.innerHTML='';
  questions.forEach(q=>{
    const d=document.createElement('div');
    d.className='dot';
    d.id='dot-'+q.id;
    d.textContent=q.id;
    d.onclick=()=>document.getElementById('q-'+q.id).scrollIntoView({behavior:'smooth',block:'start'});
    nd.appendChild(d);
  });
}

function updateDot(qid){
  const d=document.getElementById('dot-'+qid);
  if(!d)return;
  if(submitted){
    d.className='dot '+(answered[qid]?'correct':'incorrect');
  } else {
    if(answered[qid]!==undefined) d.className='dot '+(answered[qid]?'correct':'incorrect');
    else if(hasUserInput(qid)) d.className='dot interacted';
    else d.className='dot';
  }
}

function updateFooter(){
  const fc=document.getElementById('footerCount');
  if(submitted){fc.textContent='';return;}
  const n=questions.filter(q=>hasUserInput(q.id)).length;
  fc.textContent=n+'/30 answered';
  document.getElementById('topProgress').style.width=(n/30*100)+'%';
}

function hasUserInput(qid){
  const q=questions.find(x=>x.id===qid);
  if(!q)return false;
  const t=q.type;
  if(t==='mc'||t==='error-mc'){
    return Array.from(document.querySelectorAll('input[name="mc-'+qid+'"]')).some(r=>r.checked);
  }
  if(t==='multiselect'){
    return Array.from(document.querySelectorAll('input[name="ms-'+qid+'"]')).some(b=>b.checked);
  }
  if(t==='type-word'){
    const inp=document.getElementById('tw-'+qid);
    return inp&&inp.value.trim().length>0;
  }
  if(t==='particle'){
    const s1=document.getElementById('sel1-'+qid);
    return s1&&s1.value!=='';
  }
  if(t==='particle2'){
    const s1=document.getElementById('sel1-'+qid);
    const s2=document.getElementById('sel2-'+qid);
    return (s1&&s1.value!=='')||(s2&&s2.value!=='');
  }
  if(t==='sequence'||t==='sequence-en'){
    return document.querySelectorAll('#slots-'+qid+' .slot-chip').length>0;
  }
  if(t==='matching'){
    return Array.from(document.querySelectorAll('.match-sel-'+qid)).some(s=>s.value!=='');
  }
  if(t==='conversation'){
    const q2=questions.find(x=>x.id===qid);
    return q2.turns.filter(tu=>tu.speaker==='you').some((_,ti)=>
      document.querySelectorAll('#conv-slots-'+qid+'-'+ti+' .slot-chip').length>0
    );
  }
  return false;
}

function onInteract(qid){
  if(submitted)return;
  const btn=document.getElementById('check-'+qid);
  if(btn&&answered[qid]===undefined) btn.classList.add('visible');
  updateDot(qid);
  updateFooter();
}

function evaluateQ(qid){
  const q=questions.find(x=>x.id===qid);
  if(!q)return{hasAnswer:false,correct:false};
  const t=q.type;
  if(t==='mc'||t==='error-mc'){
    const sel=document.querySelector('input[name="mc-'+qid+'"]:checked');
    if(!sel)return{hasAnswer:false,correct:false};
    return{hasAnswer:true,correct:sel.value===q.answer};
  }
  if(t==='multiselect'){
    const checked=Array.from(document.querySelectorAll('input[name="ms-'+qid+'"]:checked')).map(c=>c.value);
    if(!checked.length)return{hasAnswer:false,correct:false};
    return{hasAnswer:true,correct:checked.length===q.answer.length&&q.answer.every(a=>checked.includes(a))};
  }
  if(t==='type-word'){
    const inp=document.getElementById('tw-'+qid);
    if(!inp||!inp.value.trim())return{hasAnswer:false,correct:false};
    const norm=s=>s.trim().toLowerCase().replace(/\s+/g,'').replace(/[oōo]/g,'o').replace(/[uū]/g,'u');
    const uv=norm(inp.value);
    return{hasAnswer:true,correct:uv===norm(q.answer)||(q.altTyping||[]).some(a=>uv===norm(a))};
  }
  if(t==='particle'){
    const s1=document.getElementById('sel1-'+qid);
    if(!s1||!s1.value)return{hasAnswer:false,correct:false};
    return{hasAnswer:true,correct:s1.value===q.answer1};
  }
  if(t==='particle2'){
    const s1=document.getElementById('sel1-'+qid);
    const s2=document.getElementById('sel2-'+qid);
    if((!s1||!s1.value)&&(!s2||!s2.value))return{hasAnswer:false,correct:false};
    return{hasAnswer:true,correct:s1&&s1.value===q.answer1&&s2&&s2.value===q.answer2};
  }
  if(t==='sequence'||t==='sequence-en'){
    const placed=Array.from(document.querySelectorAll('#slots-'+qid+' .slot-chip')).map(s=>s.dataset.word);
    if(!placed.length)return{hasAnswer:false,correct:false};
    return{hasAnswer:true,correct:placed.length===q.answer.length&&q.answer.every((w,i)=>w===placed[i])};
  }
  if(t==='matching'){
    const sels=document.querySelectorAll('.match-sel-'+qid);
    if(!Array.from(sels).some(s=>s.value))return{hasAnswer:false,correct:false};
    let correct=true;
    q.pairs.forEach((pair,i)=>{
      const sel=document.getElementById('match-'+qid+'-'+i);
      if(!sel||sel.value!==pair.en)correct=false;
    });
    return{hasAnswer:true,correct};
  }
  if(t==='conversation'){
    const youTurns=q.turns.filter(tu=>tu.speaker==='you');
    const allCorrect=youTurns.every((tu,ti)=>{
      const placed=Array.from(document.querySelectorAll('#conv-slots-'+qid+'-'+ti+' .slot-chip')).map(s=>s.dataset.word);
      return placed.length===tu.answer.length&&tu.answer.every((w,i)=>w===placed[i]);
    });
    return{hasAnswer:true,correct:allCorrect};
  }
  return{hasAnswer:false,correct:false};
}

function showFeedback(qid,correct){
  const fb=document.getElementById('fb-'+qid);
  if(!fb)return;
  const q=questions.find(x=>x.id===qid);
  fb.className='feedback show '+(correct?'correct-fb':'incorrect-fb');
  let html=`<div class="answer-line">${correct?'Correct!':'Incorrect'}</div>`;
  const t=q.type;
  if(t==='mc'||t==='error-mc') html+=`<div class="answer-line">Correct answer: ${q.options[q.answer]}</div>`;
  else if(t==='multiselect') html+=`<div class="answer-line">Correct answers: ${q.answer.map(a=>q.options[a]).join(', ')}</div>`;
  else if(t==='type-word') html+=`<div class="answer-line">Correct answer: ${q.answer}</div>`;
  else if(t==='particle') html+=`<div class="answer-line">Correct particle: ${q.answer1}</div>`;
  else if(t==='particle2') html+=`<div class="answer-line">Correct particles: ${q.answer1} and ${q.answer2}</div>`;
  else if(t==='sequence'||t==='sequence-en') html+=`<div class="answer-line">Correct order: ${q.answer.join(' ')}</div>`;
  else if(t==='matching') html+=`<div class="answer-line">Correct matches: ${q.pairs.map(p=>p.jp+' = '+p.en).join('; ')}</div>`;
  else if(t==='conversation'){
    q.turns.filter(tu=>tu.speaker==='you').forEach((tu,ti)=>{
      html+=`<div class="conv-correct-ans">Turn ${ti+1}: ${tu.answer.map(w=>`<span>${w}</span>`).join('')}</div>`;
    });
  }
  html+=`<div class="explanation">${q.explanation}</div>`;
  html+=`<div class="example">${q.example}</div>`;
  fb.innerHTML=html;
  const card=document.getElementById('q-'+qid);
  if(card)card.classList.add(correct?'correct':'incorrect');
}

function lockQuestion(qid){
  const card=document.getElementById('q-'+qid);
  if(!card)return;
  card.querySelectorAll('input,select').forEach(el=>el.disabled=true);
  card.querySelectorAll('.chip,.slot-chip').forEach(el=>{el.style.pointerEvents='none';el.style.cursor='default';});
  const btn=document.getElementById('check-'+qid);
  if(btn)btn.style.display='none';
}

function checkAnswer(qid){
  if(answered[qid]!==undefined)return;
  const {correct}=evaluateQ(qid);
  answered[qid]=correct;
  showFeedback(qid,correct);
  lockQuestion(qid);
  updateDot(qid);
  updateFooter();
}

function handleSubmit(){
  const unanswered=questions.filter(q=>!hasUserInput(q.id)&&answered[q.id]===undefined).length;
  if(unanswered>0){
    if(!confirm(unanswered+' question(s) have no input. Submit anyway? They will be marked incorrect.'))return;
  }
  confirmSubmit();
}

function confirmSubmit(){
  submitted=true;
  document.getElementById('fixedFooter').style.display='none';
  questions.forEach(q=>{
    if(answered[q.id]!==undefined){
      showFeedback(q.id,answered[q.id]);
      lockQuestion(q.id);
    } else if(hasUserInput(q.id)){
      const {correct}=evaluateQ(q.id);
      answered[q.id]=correct;
      showFeedback(q.id,correct);
      lockQuestion(q.id);
    } else {
      answered[q.id]=false;
      showFeedback(q.id,false);
      lockQuestion(q.id);
    }
    updateDot(q.id);
  });
  showScore();
}

function showScore(){
  const total=Object.values(answered).filter(Boolean).length;
  const l17=questions.filter(q=>q.section==='L17').reduce((s,q)=>s+(answered[q.id]?1:0),0);
  const l89=questions.filter(q=>q.section==='L89').reduce((s,q)=>s+(answered[q.id]?1:0),0);
  const l10=questions.filter(q=>q.section==='L10').reduce((s,q)=>s+(answered[q.id]?1:0),0);
  const pct=Math.round(total/30*100);
  document.getElementById('scoreBig').textContent=total+'/30';
  document.getElementById('scoreSub').textContent=pct+'% - '+getGrade(pct);
  document.getElementById('sectionScores').innerHTML=`
    <div class="sec-score-card"><h4>Lessons 1-7</h4><div class="val">${l17}/15</div></div>
    <div class="sec-score-card"><h4>Lessons 8-9</h4><div class="val">${l89}/9</div></div>
    <div class="sec-score-card"><h4>Lesson 10</h4><div class="val">${l10}/6</div></div>`;
  const typeLabelsMap={'mc':'Multiple Choice','error-mc':'Error Correction','multiselect':'Multi-Select',
    'type-word':'Type the Word','particle':'Fill-in Particle','particle2':'Fill-in 2 Particles',
    'sequence':'Word Sequencing','sequence-en':'Translate to English','matching':'Vocab Matching','conversation':'Conversation Roleplay'};
  const typeOrder=['mc','error-mc','multiselect','type-word','particle','particle2','sequence','sequence-en','matching','conversation'];
  document.getElementById('typeScores').innerHTML=typeOrder.map(t=>{
    const qs=questions.filter(q=>q.type===t);
    if(!qs.length)return'';
    const got=qs.filter(q=>answered[q.id]===true).length;
    return`<div class="type-score-row"><span class="t-label">${typeLabelsMap[t]}</span><span class="t-val">${got}/${qs.length}</span></div>`;
  }).join('');
  const sc=document.getElementById('scoreSection');
  sc.classList.add('show');
  sc.scrollIntoView({behavior:'smooth',block:'start'});
}

function getGrade(p){
  if(p>=90)return'Excellent!';if(p>=75)return'Well done!';if(p>=60)return'Good effort!';return'Keep practicing!';
}

${questions.filter(q=>answered[q.id]!==true).map(qBlock).join('\n\n')}
`;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert('Copied to clipboard!')).catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
}

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');alert('Copied to clipboard!');}
  catch(e){alert('Could not copy. Please copy manually.');}
  document.body.removeChild(ta);
}

function getAnswerText(q){
  const t=q.type;
  if(t==='mc'||t==='error-mc')return q.options[q.answer];
  if(t==='multiselect')return q.answer.map(a=>q.options[a]).join(', ');
  if(t==='type-word')return q.answer;
  if(t==='particle')return q.answer1;
  if(t==='particle2')return q.answer1+' and '+q.answer2;
  if(t==='sequence'||t==='sequence-en')return q.answer.join(' ');
  if(t==='matching')return q.pairs.map(p=>p.jp+' = '+p.en).join('; ');
  if(t==='conversation')return q.turns.filter(tu=>tu.speaker==='you').map(tu=>tu.answer.join(' ')).join(' / ');
  return'';
}

function renderMC(q){
  return`<div class="option-group">${Object.entries(q.options).map(([k,v])=>`
    <label class="option-label" id="opt-${q.id}-${k}">
      <input type="radio" name="mc-${q.id}" value="${k}" onchange="onInteract(${q.id})"> ${v}
    </label>`).join('')}</div>`;
}

function renderMultiselect(q){
  return`<div class="option-group">${Object.entries(q.options).map(([k,v])=>`
    <label class="option-label" id="opt-${q.id}-${k}">
      <input type="checkbox" name="ms-${q.id}" value="${k}" onchange="onInteract(${q.id})"> ${v}
    </label>`).join('')}<div style="font-size:.82em;color:var(--muted);margin-top:4px;">Select all that apply.</div></div>`;
}

function renderTypeWord(q){
  return`<input type="text" id="tw-${q.id}" class="text-input" placeholder="Type your answer..."
    oninput="if(!isComposing_${q.id})onInteract(${q.id})"
    oncompositionstart="isComposing_${q.id}=true"
    oncompositionend="isComposing_${q.id}=false;onInteract(${q.id})">
  <script>var isComposing_${q.id}=false;<\/script>`;
}

function renderParticle(q){
  const opts=q.sel1.map(s=>`<option value="${s}">${s}</option>`).join('');
  return`<div class="particle-sentence">${q.pre} <select id="sel1-${q.id}" onchange="onInteract(${q.id})"><option value="">--</option>${opts}</select> ${q.post}</div>
  <div class="translation-note">English: ${q.translation}</div>`;
}

function renderParticle2(q){
  const o1=q.sel1.map(s=>`<option value="${s}">${s}</option>`).join('');
  const o2=q.sel2.map(s=>`<option value="${s}">${s}</option>`).join('');
  return`<div class="particle-sentence">${q.pre} <select id="sel1-${q.id}" onchange="onInteract(${q.id})"><option value="">--</option>${o1}</select> ${q.mid} <select id="sel2-${q.id}" onchange="onInteract(${q.id})"><option value="">--</option>${o2}</select> ${q.post}</div>
  <div class="translation-note">English: ${q.translation}</div>`;
}

function renderSequence(q){
  const chips=q.chips.map((w,i)=>`<button class="chip" id="chip-${q.id}-${i}" data-word="${w}" data-idx="${i}" onclick="placeChip(${q.id},${i})">${w}</button>`).join('');
  return`<div class="chip-bank" id="bank-${q.id}">${chips}</div>
  <div class="seq-label">Your answer:</div>
  <div class="answer-slots" id="slots-${q.id}"></div>
  <div style="font-size:.8em;color:var(--muted);margin-top:4px;">Click chips to place. Click placed chips to remove.</div>`;
}

function renderSequenceEN(q){
  const chips=q.chips.map((w,i)=>`<button class="chip" id="chip-${q.id}-${i}" data-word="${w}" data-idx="${i}" onclick="placeChip(${q.id},${i})">${w}</button>`).join('');
  return`<span class="jp">${q.jp}</span>
  <div class="chip-bank" id="bank-${q.id}">${chips}</div>
  <div class="seq-label">Your translation:</div>
  <div class="answer-slots" id="slots-${q.id}"></div>
  <div style="font-size:.8em;color:var(--muted);margin-top:4px;">Click chips to place. Click placed chips to remove.</div>`;
}

function placeChip(qid,chipIdx){
  if(submitted)return;
  const chip=document.getElementById('chip-'+qid+'-'+chipIdx);
  if(!chip||chip.classList.contains('used'))return;
  chip.classList.add('used');
  const sc=document.createElement('button');
  sc.className='slot-chip';sc.dataset.word=chip.dataset.word;sc.dataset.chipIdx=chipIdx;
  sc.textContent=chip.dataset.word;
  sc.onclick=function(){removeSlotChip(qid,chipIdx,this);};
  document.getElementById('slots-'+qid).appendChild(sc);
  onInteract(qid);
}

function removeSlotChip(qid,chipIdx,el){
  if(submitted)return;
  const chip=document.getElementById('chip-'+qid+'-'+chipIdx);
  if(chip)chip.classList.remove('used');
  el.remove();onInteract(qid);
}

function renderMatching(q){
  const optHTML=`<option value="">-- select --</option>`+q.options.map(o=>`<option value="${o}">${o}</option>`).join('');
  return q.pairs.map((p,i)=>`
    <div class="matching-grid">
      <label>${p.jp}</label>
      <select id="match-${q.id}-${i}" class="match-sel-${q.id}" onchange="onInteract(${q.id})">${optHTML}</select>
    </div>`).join('');
}

function renderConversation(q){
  let youIdx=0;
  return`<div class="conv-wrap">${q.turns.map(tu=>{
    if(tu.speaker==='staff'){
      return`<div class="conv-turn"><div class="conv-speaker">Staff</div><div class="conv-line">${tu.line}</div></div>`;
    } else {
      const ti=youIdx++;
      const allChips=shuffle([...tu.answer,...tu.distractors]);
      const chips=allChips.map((w,ci)=>`<button class="chip" id="conv-chip-${q.id}-${ti}-${ci}" data-word="${w}" onclick="placeConvChip(${q.id},${ti},${ci})">${w}</button>`).join('');
      return`<div class="conv-turn"><div class="conv-speaker">You</div>
        <div class="conv-line you-turn">
          <div class="chip-bank">${chips}</div>
          <div class="seq-label">Your response:</div>
          <div class="answer-slots" id="conv-slots-${q.id}-${ti}"></div>
        </div></div>`;
    }
  }).join('')}</div>`;
}

function placeConvChip(qid,ti,ci){
  if(submitted)return;
  const chip=document.getElementById('conv-chip-'+qid+'-'+ti+'-'+ci);
  if(!chip||chip.classList.contains('used'))return;
  chip.classList.add('used');
  const sc=document.createElement('button');
  sc.className='slot-chip';sc.dataset.word=chip.dataset.word;
  sc.textContent=chip.dataset.word;
  sc.onclick=function(){removeConvChip(qid,ti,ci,this);};
  document.getElementById('conv-slots-'+qid+'-'+ti).appendChild(sc);
  onInteract(qid);
}

function removeConvChip(qid,ti,ci,el){
  if(submitted)return;
  const chip=document.getElementById('conv-chip-'+qid+'-'+ti+'-'+ci);
  if(chip)chip.classList.remove('used');
  el.remove();onInteract(qid);
}

function buildQuiz(){
  const body=document.getElementById('quizBody');
  const typeLabels={mc:'Multiple Choice','error-mc':'Error Correction',multiselect:'Multi-Select','type-word':'Type the Word',
    particle:'Fill the Particle',particle2:'Fill 2 Particles',sequence:'Build Sentence',
    'sequence-en':'Translate to English',matching:'Vocabulary Match',conversation:'Conversation'};
  questions.forEach(q=>{
    const card=document.createElement('div');
    card.className='question-card';card.id='q-'+q.id;
    let inner=`<div class="q-header"><span class="q-num">Q${q.id}</span><div class="badges"><span class="q-section">${q.section}</span><span class="q-type">${typeLabels[q.type]||q.type}</span></div></div>`;
    inner+=`<div class="q-text">${q.text}</div>`;
    if(q.jp)inner+=`<span class="jp">${q.jp}</span>`;
    inner+=`<div class="hint" onclick="this.classList.toggle('open')">Click to reveal hint <span class="hint-text">${q.hint}</span></div>`;
    if(q.type==='mc'||q.type==='error-mc')inner+=renderMC(q);
    else if(q.type==='multiselect')inner+=renderMultiselect(q);
    else if(q.type==='type-word')inner+=renderTypeWord(q);
    else if(q.type==='particle')inner+=renderParticle(q);
    else if(q.type==='particle2')inner+=renderParticle2(q);
    else if(q.type==='sequence')inner+=renderSequence(q);
    else if(q.type==='sequence-en')inner+=renderSequenceEN(q);
    else if(q.type==='matching')inner+=renderMatching(q);
    else if(q.type==='conversation')inner+=renderConversation(q);
    inner+=`<button class="check-btn" id="check-${q.id}" onclick="checkAnswer(${q.id})">Check Answer</button>`;
    inner+=`<div class="feedback" id="fb-${q.id}"></div>`;
    card.innerHTML=inner;
    body.appendChild(card);
  });
}

buildQuiz();
buildNav();
updateFooter();
</script>
