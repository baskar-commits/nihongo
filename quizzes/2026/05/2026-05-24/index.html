<style>

.check-btn:hover{background:#1a6fa0;}

#fixedFooter{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--border);padding:11px 18px;display:flex;justify-content:space-between;align-items:center;z-index:100;box-shadow:0 -4px 12px rgba(0,0,0,.08);}
#footerCount{font-weight:700;color:var(--muted);font-size:.9em;}
#submitBtn{padding:10px 26px;background:linear-gradient(135deg,var(--accent),#e74c3c);color:#fff;border:none;border-radius:8px;font-size:.93em;font-weight:700;cursor:pointer;}
.top-progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);transition:width .3s;z-index:999;}

.section-scores{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0;}
.sec-score-card{background:#f8f6f1;border-radius:10px;padding:12px 20px;min-width:130px;}
.sec-score-card h4{font-size:.82em;color:var(--muted);margin-bottom:4px;}
.sec-score-card .val{font-size:1.5em;font-weight:700;color:var(--text);}

.type-scores-section h3{font-size:.95em;font-weight:700;color:var(--accent2);margin-bottom:10px;}
.type-scores-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.type-score-row{display:flex;justify-content:space-between;align-items:center;background:#f8f6f1;border-radius:8px;padding:9px 14px;font-size:.9em;}
.type-score-row .t-label{color:var(--text);}
.type-score-row .t-val{font-weight:700;color:var(--text);}
.action-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}

  body{padding:0;}

<script>
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const questions=[

// ===== Q1 L17 MC: demonstrative (あれ vs あの) =====
{id:1,type:"mc",section:"L17",
 text:"Which sentence correctly uses a demonstrative word?",
 options:{
   a:"あれ じてんしゃは あたらしいです。",
   b:"あの じてんしゃは あたらしいです。",
   c:"あのれ じてんしゃは あたらしいです。",
   d:"あれな じてんしゃは あたらしいです。"
 },
 answer:"b",
 hint:"One of these words is a standalone pronoun. The other must directly precede a noun.",
 explanation:"あの must directly precede a noun (あの + じてんしゃ). あれ is a standalone pronoun that cannot modify a noun. あのれ and あれな are not real words.",
 example:"あの くるまは ふるいです。(Ano kuruma wa furui desu.) That car over there is old."},

// ===== Q2 L89 SEQUENCE: receiver ni - send email to teacher =====
{id:2,type:"sequence",section:"L89",
 text:"Build the Japanese sentence starting with わたしは: 'I will send an email to my teacher every week.'",
 chips:shuffle(["わたしは","まいしゅう","せんせいに","メールを","おくります","でんわを","ともだちに","へ"]),
 answer:["わたしは","まいしゅう","せんせいに","メールを","おくります"],
 hint:"Use the receiver-に pattern: Person は + time + receiver に + noun を + verb.",
 explanation:"Person1 は Person2 に Noun を Verb is the receiver-に pattern. まいしゅう (every week) goes before the receiver. おくります means 'send.'",
 example:"たなかさんは ともだちに メールを おくります。(Tanaka-san wa tomodachi ni meeru o okurimasu.) Mr. Tanaka sends an email to his friend."},

// ===== Q3 L17 PARTICLE: kara/made time range =====
{id:3,type:"particle",section:"L17",
 text:"Complete the sentence:",
 pre:"としょかんは くじ",sel1:["から","に","で","を"],answer1:"から",post:"ごごろくじ まで です。",
 hint:"This particle marks the starting point of a time range.",
 translation:"The library is open from 9 o'clock to 6 p.m.",
 explanation:"から (kara) marks the starting point of a time range. まで marks the ending point. The pattern is [time1] から [time2] まで.",
 example:"クラスは はちじ から じゅうじ まで です。(Kurasu wa hachi-ji kara juu-ji made desu.) The class is from 8 to 10 o'clock."},

// ===== Q4 L10 MC: tricky な-adj + noun (きれい) =====
{id:4,type:"mc",section:"L10",
 text:"Which option correctly uses the adjective きれい before a noun?",
 options:{
   a:"きれいい はな です。",
   b:"きれいな はな です。",
   c:"きれい はな です。",
   d:"きれいの はな です。"
 },
 answer:"b",
 hint:"This adjective ends in い but belongs to a special category that uses a different connector before nouns.",
 explanation:"きれい is a な-adjective (not an い-adjective) even though it ends in い. な-adjectives require な before a noun: きれいな はな. Never add い-adjective rules to きれい.",
 example:"きれいな まちです。(Kirei-na machi desu.) It is a beautiful town."},

// ===== Q5 L17 TYPE-WORD: WOTD めんどくさい =====
{id:5,type:"type-word",section:"L17",
 text:"Type the Japanese word that means 'troublesome' or 'what a hassle' (Word of the Day from class):",
 answer:"めんどくさい",
 altTyping:["mendokusai","mendokusei","めんどくさい"],
 hint:"This casual word is used when something feels annoying or too much effort. It was introduced as a Word of the Day in Lessons 5-7.",
 explanation:"めんどくさい (mendokusai) means troublesome, tiresome, or 'what a hassle.' It is commonly used in casual speech to express reluctance or frustration.",
 example:"しゅくだいは めんどくさい。(Shukudai wa mendokusai.) Homework is such a pain."},

// ===== Q6 L89 PARTICLE2: person wa place ni noun wo verb =====
{id:6,type:"particle2",section:"L89",
 text:"Complete the sentence with the correct particles:",
 pre:"わたしは まいあさ かのじょ",sel1:["に","を","で","へ"],answer1:"に",
 mid:"でんわ",sel2:["を","に","で","は"],answer2:"を",
 post:"します。",
 hint:"The first blank marks the receiver of the action. The second blank marks the direct object of the verb します.",
 translation:"Every morning I make a phone call to my girlfriend.",
 explanation:"Person2 に marks the receiver of でんわをします. The noun でんわ is the direct object, marked by を. Pattern: Person1 は Person2 に Noun を Verb.",
 example:"たなかさんは スミスさんに でんわを しました。(Tanaka-san wa Sumisu-san ni denwa o shimashita.) Mr. Tanaka called Mr. Smith."},

// ===== Q7 L17 SEQUENCE: transportation de + destination ni =====
{id:7,type:"sequence",section:"L17",
 text:"Build the Japanese sentence starting with わたしは: 'I go to Osaka by shinkansen every year.'",
 chips:shuffle(["わたしは","まいとし","しんかんせんで","おおさかに","いきます","バスで","かえります","えきへ"]),
 answer:["わたしは","まいとし","しんかんせんで","おおさかに","いきます"],
 hint:"Transportation uses the particle で. Destination uses the particle に with motion verbs.",
 explanation:"[transportation] で shows the means of travel. [place] に marks the destination with いきます. Word order: Person は + time + transport-で + place-に + verb.",
 example:"ともだちは でんしゃで とうきょうに いきます。(Tomodachi wa densha de Toukyou ni ikimasu.) My friend goes to Tokyo by train."},

// ===== Q8 L10 ERROR-MC: い-adj negative form =====
{id:8,type:"error-mc",section:"L10",
 text:"Find the mistake in this sentence: 'この コーヒーは あついくないです。'",
 options:{
   a:"あついくないです should be あつくないです",
   b:"この should be その",
   c:"コーヒーは should be コーヒーを",
   d:"あついくないです should be あついじゃありません"
 },
 answer:"a",
 hint:"When making an い-adjective negative, there is a specific step you must do to the adjective's ending first.",
 explanation:"To negate an い-adjective, drop the final い then add くない です. あつい becomes あつくない です, not あついくない. The い must be removed before adding くない.",
 example:"このスープは あつくないです。(Kono suupu wa atsuku nai desu.) This soup is not hot."},

// ===== Q9 L17 MC: counter mai (flat objects) =====
{id:9,type:"mc",section:"L17",
 text:"You want to buy 3 sheets of paper. Which counter is correct?",
 options:{
   a:"かみを さんぼん ください。",
   b:"かみを みっつ ください。",
   c:"かみを さんまい ください。",
   d:"かみを さんこ ください。"
 },
 answer:"c",
 hint:"Think about the shape of paper. Which counter is for flat, thin objects?",
 explanation:"まい is the counter for flat objects like paper, stamps, and T-shirts. さんまい = 3 flat items. ぼん/ぽん is for long cylindrical objects, こ is for small round objects, and つ is a general counter.",
 example:"Tシャツを にまい ください。(T-shatsu o nimai kudasai.) Two T-shirts, please."},

// ===== Q10 L89 MULTISELECT: correct masu conjugations =====
{id:10,type:"multiselect",section:"L89",
 text:"Which of the following sentences are grammatically correct? (Select all that apply.)",
 options:{
   a:"わたしは きのう えいがを みませんでした。",
   b:"たなかさんは まいにち ぎょうざを たべまして。",
   c:"スミスさんは あした ともだちに あいます。",
   d:"わたしは ぜんぜん コーヒーを のみません。",
   e:"かのじょは らいしゅう ほんを よみましたか。"
 },
 answer:["a","c","d"],
 hint:"Check the verb ending in each sentence. Consider the tense, and whether time words match the verb form.",
 explanation:"A: past negative みませんでした with きのう (yesterday) - correct. B: たべまして is not a valid form. C: future with あした + あいます - correct. D: ぜんぜん + negative のみません - correct. E: らいしゅう (next week) contradicts past tense よみました.",
 example:"わたしは まいあさ コーヒーを のみます。(Watashi wa maiasa koohii o nomimasu.) I drink coffee every morning."},

// ===== Q11 L17 MC: transportation particle で =====
{id:11,type:"mc",section:"L17",
 text:"Which sentence correctly says 'Mr. Smith went to the station by bus yesterday'?",
 options:{
   a:"スミスさんは きのう バスに えきで いきました。",
   b:"スミスさんは きのう バスで えきに いきました。",
   c:"スミスさんは きのう バスへ えきを いきました。",
   d:"スミスさんは きのう バスを えきに いきました。"
 },
 answer:"b",
 hint:"One particle marks the means of transport, a different particle marks the destination. Check which is which.",
 explanation:"Transportation uses で (means of travel): バスで = by bus. Destination of motion verb uses に: えきに = to the station. いきました = went (past tense). The order: transport-で + destination-に + verb.",
 example:"わたしは でんしゃで とうきょうに いきます。(Watashi wa densha de Toukyou ni ikimasu.) I go to Tokyo by train."},

// ===== Q12 L17 PARTICLE: days of the week + time に =====
{id:12,type:"particle",section:"L17",
 text:"Complete the sentence:",
 pre:"クラスは もくようび",sel1:["に","で","を","から"],answer1:"に",post:"あります。",
 hint:"Specific days of the week, like specific clock times, use a particular particle to mark when something happens.",
 translation:"Class is on Thursday.",
 explanation:"に marks specific time points: days of the week, clock times, months, years. Relative time words like きょう or あした do NOT take に.",
 example:"どようびに ともだちと こうえんに いきます。(Doyoubi ni tomodachi to kouen ni ikimasu.) I go to the park with a friend on Saturday."},

// ===== Q13 L89 MC: family terms own vs others' =====
{id:13,type:"mc",section:"L89",
 text:"Which sentence correctly talks about YOUR OWN mother?",
 options:{
   a:"わたしの おかあさんは まいにち テレビを みます。",

const answered={};
const typeCorrect={};

function normalizeText(s){return(s||"").trim().toLowerCase().replace(/\s+/g,"").replace(/ō/g,"o").replace(/ū/g,"u").replace(/ā/g,"a").replace(/ē/g,"e").replace(/ī/g,"i");}

function hasUserInput(qid){
  const q=questions.find(x=>x.id===qid);
  if(!q)return false;
  const t=q.type;
  if(t==="mc"||t==="error-mc"){return !!document.querySelector(`input[name="q${qid}"]:checked`);}
  if(t==="multiselect"){return !!document.querySelector(`input[name="ms${qid}"]:checked`);}
  if(t==="type-word"){const v=(document.getElementById(`tw${qid}`)||{}).value||"";return v.trim().length>0;}
  if(t==="particle"){const s=document.getElementById(`sel1_${qid}`);return s&&s.value!=="";}
  if(t==="particle2"){const s1=document.getElementById(`sel1_${qid}`),s2=document.getElementById(`sel2_${qid}`);return (s1&&s1.value!=="")||(s2&&s2.value!=="");}
  if(t==="matching"){const sels=document.querySelectorAll(`[id^="match_${qid}_"]`);return Array.from(sels).some(s=>s.value!=="");}
  if(t==="sequence"||t==="sequence-en"){return (document.getElementById(`slots_${qid}`)||{}).children&&document.getElementById(`slots_${qid}`).children.length>0;}
  if(t==="conversation"){
    for(let i=0;i<q.turns.length;i++){if(q.turns[i].speaker==="you"){const sl=document.getElementById(`cslots_${qid}_${i}`);if(sl&&sl.children.length>0)return true;}}
    return false;
  }
  return false;
}

function evaluateQ(qid){
  const q=questions.find(x=>x.id===qid);
  if(!q)return{hasAnswer:false,correct:false};
  const t=q.type;
  let correct=false,hasAnswer=hasUserInput(qid);
  if(!hasAnswer)return{hasAnswer:false,correct:false};
  if(t==="mc"||t==="error-mc"){
    const sel=document.querySelector(`input[name="q${qid}"]:checked`);
    correct=sel&&sel.value===q.answer;
  }else if(t==="multiselect"){
    const checked=Array.from(document.querySelectorAll(`input[name="ms${qid}"]:checked`)).map(x=>x.value).sort();
    correct=JSON.stringify(checked)===JSON.stringify([...q.answer].sort());
  }else if(t==="type-word"){
    const raw=(document.getElementById(`tw${qid}`)||{}).value||"";
    const norm=normalizeText(raw);
    const alts=[q.answer,...(q.altTyping||[])].map(normalizeText);
    correct=alts.some(a=>a===norm);
  }else if(t==="particle"){
    const s1=document.getElementById(`sel1_${qid}`);
    correct=s1&&normalizeText(s1.value)===normalizeText(q.answer1);
  }else if(t==="particle2"){
    const s1=document.getElementById(`sel1_${qid}`),s2=document.getElementById(`sel2_${qid}`);
    correct=(s1&&normalizeText(s1.value)===normalizeText(q.answer1))&&(s2&&normalizeText(s2.value)===normalizeText(q.answer2));
  }else if(t==="matching"){
    correct=q.pairs.every(p=>{const s=document.getElementById(`match_${qid}_${p.jp}`);return s&&s.value===p.en;});
  }else if(t==="sequence"||t==="sequence-en"){
    const sl=document.getElementById(`slots_${qid}`);
    const placed=Array.from((sl||{}).children||[]).map(c=>c.dataset.word);
    correct=JSON.stringify(placed)===JSON.stringify(q.answer);
  }else if(t==="conversation"){
    let allOk=true;
    let ti=0;
    for(let i=0;i<q.turns.length;i++){
      if(q.turns[i].speaker==="you"){
        const sl=document.getElementById(`cslots_${qid}_${i}`);
        const placed=Array.from((sl||{}).children||[]).map(c=>c.dataset.word);
        if(JSON.stringify(placed)!==JSON.stringify(q.turns[i].answer))allOk=false;
        ti++;
      }
    }
    correct=allOk;
  }
  return{hasAnswer,correct};
}

function onInteract(qid){
  const btn=document.getElementById(`chkbtn_${qid}`);
  if(btn&&!btn.classList.contains('checked-done')&&!btn.classList.contains('hidden-done'))btn.classList.add('visible');
  updateFooter();
  updateNavDot(qid);
}

function checkAnswer(qid){
  const {hasAnswer,correct}=evaluateQ(qid);
  answered[qid]=hasAnswer?correct:false;
  typeCorrect[qid]=correct;
  showFeedback(qid,correct);
  lockQuestion(qid);
  const btn=document.getElementById(`chkbtn_${qid}`);
  if(btn){btn.style.display="none";btn.classList.add('checked-done');}
  const card=document.getElementById(`card_${qid}`);
  if(card){card.classList.remove('correct','incorrect');card.classList.add(correct?'correct':'incorrect');}
  updateNavDot(qid);
  updateFooter();
}

function showFeedback(qid,correct){
  const q=questions.find(x=>x.id===qid);
  const fb=document.getElementById(`fb_${qid}`);
  if(!fb||!q)return;
  const isCorrect=correct;
  fb.className=`feedback show ${isCorrect?'correct-fb':'incorrect-fb'}`;
  let ansText="";
  const t=q.type;
  if(t==="mc"||t==="error-mc"){ansText=q.options[q.answer];}
  else if(t==="multiselect"){ansText=q.answer.map(k=>q.options[k]).join("; ");}
  else if(t==="type-word"){ansText=q.answer;}
  else if(t==="particle"){ansText=q.answer1;}
  else if(t==="particle2"){ansText=`${q.answer1} / ${q.answer2}`;}
  else if(t==="matching"){ansText=q.pairs.map(p=>`${p.jp} = ${p.en}`).join(", ");}
  else if(t==="sequence"||t==="sequence-en"){ansText=q.answer.join(" ");}
  else if(t==="conversation"){
    ansText=q.turns.filter(t=>t.speaker==="you").map((t,i)=>`Turn ${i+1}: ${t.answer.join(" ")}`).join(" | ");
    // Show correct chips per you-turn
    q.turns.forEach((turn,i)=>{
      if(turn.speaker==="you"){
        const ca=document.getElementById(`conv_correct_${qid}_${i}`);
        if(ca){ca.innerHTML="Correct: "+turn.answer.map(w=>`<span>${w}</span>`).join("");ca.style.display="block";}
      }
    });
  }
  fb.innerHTML=`<div class="answer-line">${isCorrect?'Correct!':'Incorrect.'} Correct answer: ${ansText}</div>
<div class="explanation">${q.explanation}</div>
<div class="example">${q.example}</div>`;
  // Show mc option highlighting
  if(t==="mc"||t==="error-mc"||t==="multiselect"){
    const ans=Array.isArray(q.answer)?q.answer:[q.answer];
    ["a","b","c","d","e"].forEach(k=>{
      const lbl=document.getElementById(`opt_${qid}_${k}`);
      if(!lbl)return;
      const inp=lbl.querySelector("input");
      const isAns=ans.includes(k);
      const isChk=inp&&inp.checked;
      if(isAns)lbl.classList.add("correct-opt");
      else if(isChk&&!isAns)lbl.classList.add("incorrect-opt");
    });
  }
}

function lockQuestion(qid){
  const q=questions.find(x=>x.id===qid);
  if(!q)return;
  const t=q.type;
  // Disable all inputs for this question
  document.querySelectorAll(`[id*="_${qid}"]`).forEach(el=>{
    if(el.tagName==="INPUT"||el.tagName==="SELECT")el.disabled=true;
  });
  // Disable chips in chip banks
  document.querySelectorAll(`#bank_${qid} .chip`).forEach(c=>c.style.pointerEvents="none");
  document.querySelectorAll(`#slots_${qid} .slot-chip`).forEach(c=>c.style.pointerEvents="none");
  // Conversation chips
  if(q.turns){
    q.turns.forEach((turn,i)=>{
      if(turn.speaker==="you"){
        document.querySelectorAll(`#cbank_${qid}_${i} .chip`).forEach(c=>c.style.pointerEvents="none");
        document.querySelectorAll(`#cslots_${qid}_${i} .slot-chip`).forEach(c=>c.style.pointerEvents="none");
      }
    });
  }
}

function handleSubmit(){
  const unanswered=questions.filter(q=>!hasUserInput(q.id)&&answered[q.id]===undefined).length;
  if(unanswered>0){
    if(!confirm(`${unanswered} question(s) have no input. Submit anyway? They will be marked incorrect.`))return;
  }
  confirmSubmit();
}

function confirmSubmit(){
  document.getElementById("fixedFooter").style.display="none";
  questions.forEach(q=>{
    if(answered[q.id]!==undefined){
      showFeedback(q.id,answered[q.id]);
      lockQuestion(q.id);
      const card=document.getElementById(`card_${q.id}`);
      if(card){card.classList.remove('correct','incorrect');card.classList.add(answered[q.id]?'correct':'incorrect');}
    }else if(hasUserInput(q.id)){
      const {correct}=evaluateQ(q.id);
      answered[q.id]=correct;
      showFeedback(q.id,correct);
      lockQuestion(q.id);
      const card=document.getElementById(`card_${q.id}`);
      if(card){card.classList.remove('correct','incorrect');card.classList.add(correct?'correct':'incorrect');}
    }else{
      answered[q.id]=false;
      showFeedback(q.id,false);
      lockQuestion(q.id);
      const card=document.getElementById(`card_${q.id}`);
      if(card){card.classList.remove('correct','incorrect');card.classList.add('incorrect');}
    }
    const btn=document.getElementById(`chkbtn_${q.id}`);
    if(btn)btn.style.display="none";
    updateNavDot(q.id);
  });
  showScore();
}

function showScore(){
  const sec=document.getElementById("scoreSection");
  sec.classList.add("show");
  const total=Object.values(answered).filter(v=>v===true).length;
  const pct=Math.round(total/30*100);
  document.getElementById("scoreBig").textContent=`${total}/30`;
  document.getElementById("scoreSub").textContent=`${pct}% — ${pct>=80?"Great work!":pct>=60?"Keep it up!":"Keep practicing!"}`;
  // Section scores
  const sections={L17:{total:15,correct:0},L89:{total:9,correct:0},L10:{total:6,correct:0}};
  questions.forEach(q=>{if(answered[q.id])sections[q.section].correct++;});
  document.getElementById("sectionScores").innerHTML=
    `<div class="sec-score-card"><h4>Lessons 1-7</h4><div class="val">${sections.L17.correct}/15</div></div>
     <div class="sec-score-card"><h4>Lessons 8-9</h4><div class="val">${sections.L89.correct}/9</div></div>
     <div class="sec-score-card"><h4>Lesson 10</h4><div class="val">${sections.L10.correct}/6</div></div>`;
  // Type scores
  const typeMap={};
  questions.forEach(q=>{
    const t=q.type;
    if(!typeMap[t])typeMap[t]={c:0,t:0};
    typeMap[t].t++;
    if(answered[q.id])typeMap[t].c++;
  });
  const typeLabels={"mc":"Multiple Choice","error-mc":"Error Correction","multiselect":"Multi-Select","type-word":"Type the Word","particle":"Fill-in-Particle","particle2":"Fill-in-2-Particles","matching":"Vocabulary Matching","sequence":"Build JP Sentence","sequence-en":"Translate to EN","conversation":"Conversation"};
  document.getElementById("typeScores").innerHTML=Object.entries(typeMap).map(([t,v])=>
    `<div class="type-score-row"><span class="t-label">${typeLabels[t]||t}</span><span class="t-val">${v.c}/${v.t}</span></div>`
  ).join("");
  sec.scrollIntoView({behavior:"smooth"});
}

function updateNavDot(qid){
  const dot=document.getElementById(`dot_${qid}`);
  if(!dot)return;
  dot.className="dot";
  if(answered[qid]!==undefined){dot.classList.add(answered[qid]?"correct":"incorrect");}
  else if(hasUserInput(qid)){dot.classList.add("interacted");}
}

function updateFooter(){
  const interacted=questions.filter(q=>hasUserInput(q.id)).length;
  const checked=Object.keys(answered).length;
  const count=Math.max(interacted,checked);
  const btn=document.getElementById("submitBtn");
  if(btn)btn.textContent=`Submit (${count}/30 answered)`;
  document.getElementById("footerCount").textContent=`Submit All 30 Questions`;
  const pct=count/30*100;
  document.getElementById("topProgress").style.width=pct+"%";
}

// ===== RENDERING =====
function buildNavDots(){
  const nav=document.getElementById("navDots");
  questions.forEach(q=>{
    const d=document.createElement("div");
    d.className="dot";d.id=`dot_${q.id}`;d.textContent=q.id;
    d.onclick=()=>document.getElementById(`card_${q.id}`).scrollIntoView({behavior:"smooth"});
    nav.appendChild(d);
  });
}

function buildQuestion(q){
  const card=document.createElement("div");
  card.className="question-card";card.id=`card_${q.id}`;
  const typeLabels={"mc":"Multiple Choice","error-mc":"Error Correction","multiselect":"Multi-Select","type-word":"Type the Word","particle":"Fill-in-Particle","particle2":"Fill-in-2-Particles","matching":"Vocab Matching","sequence":"Build Sentence","sequence-en":"Translate","conversation":"Conversation"};
  card.innerHTML=`<div class="q-header"><span class="q-num">Q${q.id}</span><div class="badges"><span class="q-section">${q.section}</span><span class="q-type">${typeLabels[q.type]||q.type}</span></div></div>
<div class="q-text">${q.text}</div>
<div class="hint" onclick="this.classList.toggle('open')"><span class="hint-text">${q.hint}</span></div>`;
  // Body
  const body=document.createElement("div");
  body.id=`body_${q.id}`;
  if(q.type==="mc"||q.type==="error-mc"){
    body.innerHTML=`<div class="option-group">${["a","b","c","d"].filter(k=>q.options[k]).map(k=>`<label class="option-label" id="opt_${q.id}_${k}"><input type="radio" name="q${q.id}" value="${k}" onchange="onInteract(${q.id})"> ${q.options[k]}</label>`).join("")}</div>`;
  }else if(q.type==="multiselect"){
    body.innerHTML=`<div class="option-group">${Object.entries(q.options).map(([k,v])=>`<label class="option-label" id="opt_${q.id}_${k}"><input type="checkbox" name="ms${q.id}" value="${k}" onchange="onInteract(${q.id})"> ${v}</label>`).join("")}</div>`;
  }else if(q.type==="type-word"){
    body.innerHTML=`<input type="text" class="text-input" id="tw${q.id}" placeholder="Type in hiragana, katakana, or romaji..." autocomplete="off" autocorrect="off" autocapitalize="off">`;
    setTimeout(()=>{
      const inp=body.querySelector(`#tw${q.id}`);
      if(!inp)return;
      let isComposing=false;
      inp.addEventListener("compositionstart",()=>{isComposing=true;});
      inp.addEventListener("compositionend",()=>{isComposing=false;onInteract(q.id);});
      inp.addEventListener("input",()=>{if(!isComposing)onInteract(q.id);});
    },0);
  }else if(q.type==="particle"){
    const opts=q.sel1.map(o=>`<option value="${o}">${o}</option>`).join("");
    body.innerHTML=`<div class="particle-sentence">${q.pre} <select id="sel1_${q.id}" onchange="onInteract(${q.id})"><option value="">--</option>${opts}</select> ${q.post}</div><div class="translation-note">English: ${q.translation}</div>`;
  }else if(q.type==="particle2"){
    const opts1=q.sel1.map(o=>`<option value="${o}">${o}</option>`).join("");
    const opts2=q.sel2.map(o=>`<option value="${o}">${o}</option>`).join("");
    body.innerHTML=`<div class="particle-sentence">${q.pre} <select id="sel1_${q.id}" onchange="onInteract(${q.id})"><option value="">--</option>${opts1}</select> ${q.mid} <select id="sel2_${q.id}" onchange="onInteract(${q.id})"><option value="">--</option>${opts2}</select> ${q.post}</div><div class="translation-note">English: ${q.translation}</div>`;
  }else if(q.type==="matching"){
    const optHtml=`<option value="">--select--</option>`+q.options.map(o=>`<option value="${o}">${o}</option>`).join("");
    body.innerHTML=`<div class="matching-grid">${q.pairs.map(p=>`<label>${p.jp}</label><select id="match_${q.id}_${p.jp}" onchange="onInteract(${q.id})">${optHtml}</select>`).join("")}</div>`;
  }else if(q.type==="sequence"){
    const shuffledChips=[...q.chips];
    body.innerHTML=`<div class="seq-label">Available words (click to add):</div>
<div class="chip-bank" id="bank_${q.id}">${shuffledChips.map((w,i)=>`<div class="chip" id="chip_${q.id}_${i}" data-word="${w}" data-idx="${i}" onclick="placeChip(${q.id},${i})">${w}</div>`).join("")}</div>
<div class="seq-label">Your sentence (click a word to remove):</div>
<div class="answer-slots" id="slots_${q.id}"></div>`;
  }else if(q.type==="sequence-en"){
    const shuffledChips=[...q.chips];
    body.innerHTML=`<div class="jp">${q.jp}</div>
<div class="seq-label">Available words (click to add):</div>
<div class="chip-bank" id="bank_${q.id}">${shuffledChips.map((w,i)=>`<div class="chip" id="chip_${q.id}_${i}" data-word="${w}" data-idx="${i}" onclick="placeChip(${q.id},${i})">${w}</div>`).join("")}</div>
<div class="seq-label">Your translation (click a word to remove):</div>
<div class="answer-slots" id="slots_${q.id}"></div>`;
  }else if(q.type==="conversation"){
    let convHtml="";
    q.turns.forEach((turn,i)=>{
      if(turn.speaker==="staff"){
        convHtml+=`<div class="conv-turn"><div class="conv-speaker">Staff</div><div class="conv-line">${turn.line}</div></div>`;
      }else{
        const allChips=[...turn.answer,...turn.distractors];
        const shuffledC=shuffle(allChips);
        convHtml+=`<div class="conv-turn"><div class="conv-speaker">You</div>
<div class="chip-bank" id="cbank_${q.id}_${i}">${shuffledC.map((w,ci)=>`<div class="chip" id="cchip_${q.id}_${i}_${ci}" data-word="${w}" data-idx="${ci}" onclick="placeConvChip(${q.id},${i},${ci})">${w}</div>`).join("")}</div>
<div class="answer-slots" id="cslots_${q.id}_${i}"></div>
<div class="conv-correct-ans" id="conv_correct_${q.id}_${i}" style="display:none"></div></div>`;
      }
    });
    body.innerHTML=convHtml;
  }
  card.appendChild(body);
  // Feedback div — use createElement so card.innerHTML+= never nukes the body DOM
  const fbDiv=document.createElement("div");
  fbDiv.className="feedback";fbDiv.id=`fb_${q.id}`;
  card.appendChild(fbDiv);
  // Check Answer button
  const chkBtn=document.createElement("button");
  chkBtn.className="check-btn";chkBtn.id=`chkbtn_${q.id}`;
  chkBtn.textContent="Check Answer";
  chkBtn.onclick=()=>checkAnswer(q.id);
  card.appendChild(chkBtn);
  return card;
}

function placeChip(qid,idx){
  const chip=document.getElementById(`chip_${qid}_${idx}`);
  if(!chip||chip.classList.contains("used"))return;
  chip.classList.add("used");
  const slots=document.getElementById(`slots_${qid}`);
  const sc=document.createElement("div");
  sc.className="slot-chip";sc.dataset.word=chip.dataset.word;sc.dataset.idx=idx;
  sc.textContent=chip.dataset.word;
  sc.onclick=()=>removeSlotChip(qid,idx,sc);
  slots.appendChild(sc);
  onInteract(qid);
}

function removeSlotChip(qid,idx,sc){
  sc.remove();
  const chip=document.getElementById(`chip_${qid}_${idx}`);
  if(chip)chip.classList.remove("used");
  onInteract(qid);
}

function placeConvChip(qid,turnIdx,chipIdx){
  const chip=document.getElementById(`cchip_${qid}_${turnIdx}_${chipIdx}`);
  if(!chip||chip.classList.contains("used"))return;
  chip.classList.add("used");
  const slots=document.getElementById(`cslots_${qid}_${turnIdx}`);
  const sc=document.createElement("div");
  sc.className="slot-chip";sc.dataset.word=chip.dataset.word;sc.dataset.idx=chipIdx;
  sc.textContent=chip.dataset.word;
  sc.onclick=()=>removeConvSlotChip(qid,turnIdx,chipIdx,sc);
  slots.appendChild(sc);
  onInteract(qid);
}

function removeConvSlotChip(qid,turnIdx,chipIdx,sc){
  sc.remove();
  const chip=document.getElementById(`cchip_${qid}_${turnIdx}_${chipIdx}`);
  if(chip)chip.classList.remove("used");
  onInteract(qid);
}

function copyReview(){
  const total=Object.values(answered).filter(v=>v===true).length;
  const pct=Math.round(total/30*100);
  const l17=questions.filter(q=>q.section==="L17"&&answered[q.id]===true).length;
  const l89=questions.filter(q=>q.section==="L89"&&answered[q.id]===true).length;
  const l10=questions.filter(q=>q.section==="L10"&&answered[q.id]===true).length;
  const correctQs=questions.filter(q=>answered[q.id]===true);
  const incorrectQs=questions.filter(q=>answered[q.id]!==true);
  function getAnsText(q){
    const t=q.type;
    if(t==="mc"||t==="error-mc")return q.options[q.answer]||q.answer;
    if(t==="multiselect")return q.answer.map(k=>q.options[k]).join("; ");
    if(t==="type-word")return q.answer;
    if(t==="particle")return q.answer1;
    if(t==="particle2")return`${q.answer1} / ${q.answer2}`;
    if(t==="matching")return q.pairs.map(p=>`${p.jp}=${p.en}`).join(", ");
    if(t==="sequence"||t==="sequence-en")return q.answer.join(" ");
    if(t==="conversation")return q.turns.filter(t=>t.speaker==="you").map((t,i)=>`Turn ${i+1}: ${t.answer.join(" ")}`).join(" | ");
    return"";
  }
  let out=`=== JAPANESE QUIZ RESULTS FOR AI REVIEW ===

STUDENT CONTEXT:
Textbook: Japanese for Busy People I, Romaji Revised 4th Edition
Currently studying: Lesson 10
Completed lessons: Lessons 1 through 9
Script knowledge: Can read and write hiragana and katakana (still learning). Reads romaji fluently. No kanji yet.

INSTRUCTIONS FOR AI REVIEWER:
Based on the quiz results below, please:
1. Identify the student's strengths based on what they answered correctly
2. Identify focus areas based on incorrect or skipped answers
3. Group your feedback thematically (e.g. particles, verb conjugation, vocabulary, counters) rather than question by question
4. For each focus area, briefly explain the underlying grammar or vocabulary concept and suggest how to think about it
5. Suggest 2-3 specific practice activities for the most important gaps

QUIZ SCORE: ${total} / 30 (${pct}%)

SCORE BY SECTION:
- Lessons 1-7 (L17): ${l17} / 15
- Lessons 8-9 (L89): ${l89} / 9
- Lesson 10 (L10): ${l10} / 6

=== CORRECTLY ANSWERED (${correctQs.length} questions) ===

${correctQs.map(q=>`Q${q.id} [${q.section}] ${q.text}\n  Correct answer: ${getAnsText(q)}\n  Explanation: ${q.explanation}`).join("\n\n")}

=== INCORRECT OR SKIPPED (${incorrectQs.length} questions) ===

${incorrectQs.map(q=>`Q${q.id} [${q.section}] ${q.text}\n  Correct answer: ${getAnsText(q)}\n  Explanation: ${q.explanation}`).join("\n\n")}
`;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(out).then(()=>alert("Copied to clipboard!")).catch(()=>{fallbackCopy(out);});
  }else{fallbackCopy(out);}
}

function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");alert("Copied to clipboard!");}
  catch(e){alert("Could not copy. Please copy manually.");}
  document.body.removeChild(ta);
}

// INIT
buildNavDots();
const quizBody=document.getElementById("quizBody");
questions.forEach(q=>quizBody.appendChild(buildQuestion(q)));
updateFooter();
</script>
</body>
</html>
